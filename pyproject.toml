[project]
name = "rpaoias"
version = "0.1.0"
description = "Учебный двухадресный процессор и эмулятор для варианта 2 РПАО ИАС"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = []

# Ядро и ассемблер работают без Qt. Графика устанавливается отдельно,
# поэтому тесты процессора можно запускать и на машине без оконной среды.
[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
rpaoias = "rpaoias.cli:main"
rpaoias-web = "rpaoias.web.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rpaoias.programs" = ["*.asm"]
"rpaoias.web" = ["static/*.html", "static/*.css", "static/*.js", "static/gravity-ui-LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]
