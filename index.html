\/span><span class=\"s2\">&quot;<\/span><span class=\"p\">,<\/span>","            <span class=\"n\">Mode<\/span><span class=\"o\">.<\/span><span class=\"n\">IMMEDIATE<\/span><span class=\"p\">:<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">&quot;0x<\/span><span class=\"si\">{<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">operand<\/span><span class=\"si\">:<\/span><span class=\"s2\">04X<\/span><span class=\"si\">}<\/span><span class=\"s2\">&quot;<\/span><span class=\"p\">,<\/span>","            <span class=\"n\">Mode<\/span><span class=\"o\">.<\/span><span class=\"n\">DIRECT<\/span><span class=\"p\">:<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">&quot;[0x<\/span><span class=\"si\">{<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">operand<\/span><span class=\"si\">:<\/span><span class=\"s2\">04X<\/span><span class=\"si\">}<\/span><span class=\"s2\">]&quot;<\/span><span class=\"p\">,<\/span>","            <span class=\"n\">Mode<\/span><span class=\"o\">.<\/span><span class=\"n\">INDIRECT<\/span><span class=\"p\">:<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">&quot;[R<\/span><span class=\"si\">{<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">operand<\/span><span class=\"si\">}<\/span><span class=\"s2\">]&quot;<\/span><span class=\"p\">,<\/span>","        <span class=\"p\">}[<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">mode<\/span><span class=\"p\">]<\/span>","        <span class=\"k\">if<\/span> <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">opcode<\/span> <span class=\"o\">==<\/span> <span class=\"n\">Opcode<\/span><span class=\"o\">.<\/span><span class=\"n\">STORE<\/span><span class=\"p\">:<\/span>","            <span class=\"k\">return<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">&quot;MOV <\/span><span class=\"si\">{<\/span><span class=\"n\">other<\/span><span class=\"si\">}<\/span><span class=\"s2\">, R<\/span><span class=\"si\">{<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">register<\/span><span class=\"si\">}<\/span><span class=\"s2\">&quot;<\/span>","        <span class=\"k\">return<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">&quot;<\/span><span class=\"si\">{<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">opcode<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span><span class=\"si\">}<\/span><span class=\"s2\"> R<\/span><span class=\"si\">{<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">register<\/span><span class=\"si\">}<\/span><span class=\"s2\">, <\/span><span class=\"si\">{<\/span><span class=\"n\">other<\/span><span class=\"si\">}<\/span><span class=\"s2\">&quot;<\/span>"],"symbols":{"Mode":[19,25],"Opcode":[28,45],"Instruction":[56,113],"validate":[64,97],"assembly":[99,113]},"sha256":"d781803af961f005a97e0de0e4bab4f0d5f8961d2164adae3f35b98f039f6fe1"},"src/rpaoias/programs/__init__.py":{"text":"\"\"\"Компонент учебного эмулятора; подробности находятся в соседних модулях.\"\"\"\n","html":["<span class=\"sd\">&quot;&quot;&quot;Компонент учебного эмулятора; подробности находятся в соседних модулях.&quot;&quot;&quot;<\/span>"],"symbols":{},"sha256":"31ec514d9a56a45b2f10e4106f07da09ac352eab883de883da9ef0bd8e98db84"},"src/rpaoias/programs/carry.asm":{"text":"; Микроопыт: почему ADD и ADC нельзя заменять двумя ADD.\n; Это учебный пример, а не одна из двух обязательных программ.\n.org 0\n    MOV R0, 0xFFFF     ; В младшем слове уже 65535.\n    MOV R1, 0          ; Старшее слово равно нулю.\n    ADD R0, 1          ; R0=0000, CF=1: 65536 не помещается в 16 бит.\n    ADC R1, 0          ; R1=0001 за счет входящего CF. Теперь R1:R0 = 65536.\n    MOV [RESULT], R0   ; MOV не портит флаги.\n    MOV [RESULT+2], R1\n    MOV [RESULT+4], R2 ; R2 после reset равен 0.\n    HALT\n.org 0x0500\nRESULT:\n    .word 0, 0, 0\n","html":["; Микроопыт: почему ADD и ADC нельзя заменять двумя ADD.","; Это учебный пример, а не одна из двух обязательных программ.",".org 0","    MOV R0, 0xFFFF     ; В младшем слове уже 65535.","    MOV R1, 0          ; Старшее слово равно нулю.","    ADD R0, 1          ; R0=0000, CF=1: 65536 не помещается в 16 бит.","    ADC R1, 0          ; R1=0001 за счет входящего CF. Теперь R1:R0 = 65536.","    MOV [RESULT], R0   ; MOV не портит флаги.","    MOV [RESULT+2], R1","    MOV [RESULT+4], R2 ; R2 после reset равен 0.","    HALT",".org 0x0500","RESULT:","    .word 0, 0, 0"],"symbols":{},"sha256":"d73ea39f8c8f8c8cd843ff54c8fc34bb3da7cb10882c4362f6e0eeb65106b000"},"src/rpaoias/programs/dot_product.asm":{"text":"; Вариант 2, задание 2: S = сумма A[i]*B[i], по 10 знаковых элементов.\n; В методичке эта формула названа \"сверткой\". Реализуем именно формулу (4.1).\n;\n; Произведение 16x16 требует 32 бит. Но сумма 10 таких произведений\n; может достичь 10 * (-32768)^2 = 10737418240: это уже больше 32 бит.\n; Поэтому используем R2:R1:R0 (48 бит), а НЕ одну 32-битную пару.\n;\n; R3, R4 – указатели A/B; R5 – счетчик; R7:R6 – произведение.\n; R8 – знаковое расширение произведения; R9 – длина B; R15 – статус.\n\n.entry start\n.org 0\nstart:\n    MOV R0, 0          ; Младшая треть длинного накопителя.\n    MOV R1, 0          ; Средняя треть.\n    MOV R2, 0          ; Старшая треть.\n    MOV R15, 0         ; Статус самой программы: 0 означает успех.\n    MOV R3, ARRAY_A    ; Адрес заголовка A.\n    MOV R4, ARRAY_B    ; Адрес заголовка B.\n    MOV R5, [R3]       ; Читаем длину A из ОЗУ, не зашиваем ее в цикл.\n    MOV R9, [R4]       ; Второй массив тоже содержит собственный заголовок.\n    CMP R5, R9         ; Скалярное произведение требует совпадения длин.\n    JNZ invalid        ; Не используем молча минимум из двух длин.\n    CMP R5, 10         ; Выделено место под 10 элементов каждого массива.\n    JC length_ok       ; Длины 0..9 тоже допустимы для граничных тестов.\n    JZ length_ok       ; Основной вариант задания: ровно 10.\ninvalid:\n    MOV R15, 1         ; Разные или слишком большие длины – ошибка входных данных.\n    HALT               ; Это ошибка программы, а не ошибка декодера процессора.\n\nlength_ok:\n    ADD R3, 2          ; Перейти от заголовка A к A[0].\n    ADD R4, 2          ; Перейти от заголовка B к B[0].\n    CMP R5, 0          ; Пустые массивы дают нулевую сумму.\n    JZ done            ; Не читаем ни одного элемента для длины 0.\nloop:\n    MOV R6, [R3]       ; Загрузить A[i] в регистр: только MOV обращается к данным ОЗУ.\n    MOV R7, [R4]       ; Загрузить B[i]. Сам MUL не обращается к памяти.\n    MUL R6, R7         ; Наша ISA: signed(R6)*signed(R7) -> R7:R6.\n    MOV R8, R7         ; Знак 32-битного произведения находится в старшем слове.\n    SAR R8, 15         ; Готовим третье слово: 0000 для плюса, FFFF для минуса.\n    ADD R0, R6         ; Сложить младшие слова и получить CF.\n    ADC R1, R7         ; Сложить средние слова с переносом из предыдущего ADD.\n    ADC R2, R8         ; Сложить старшие слова с переносом из предыдущего ADC.\n    ADD R3, 2          ; Шаг указателя равен размеру элемента, а не инструкции.\n    ADD R4, 2          ; Следующий элемент B.\n    SUB R5, 1          ; Последняя арифметическая команда перед JNZ задает ZF.\n    JNZ loop           ; Управление потоком через PC, а не через цикл Python.\n\ndone:\n    MOV [RESULT], R0    ; Три обычные пересылки записывают длинный результат.\n    MOV [RESULT+2], R1\n    MOV [RESULT+4], R2\n    HALT\n\n.org 0x0400\nARRAY_A:\n    .word 10\n    .word -32768, 32767, -30000, 30000, -25000, 25000, -20000, 20000, -15000, 15000\n.org 0x0440\nARRAY_B:\n    .word 10\n    .word -32768, 32767, 30000, 30000, 25000, 25000, -20000, 20000, 15000, 15000\n.org 0x0500\nRESULT:\n    .word 0, 0, 0      ; Порядок в памяти: младшее слово, среднее, старшее.\n","html":["; Вариант 2, задание 2: S = сумма A[i]*B[i], по 10 знаковых элементов.","; В методичке эта формула названа &quot;сверткой&quot;. Реализуем именно формулу (4.1).",";","; Произведение 16x16 требует 32 бит. Но сумма 10 таких произведений","; может достичь 10 * (-32768)^2 = 10737418240: это уже больше 32 бит.","; Поэтому используем R2:R1:R0 (48 бит), а НЕ одну 32-битную пару.",";","; R3, R4 – указатели A/B; R5 – счетчик; R7:R6 – произведение.","; R8 – знаковое расширение произведения; R9 – длина B; R15 – статус.","",".entry start",".org 0","start:","    MOV R0, 0          ; Младшая треть длинного накопителя.","    MOV R1, 0          ; Средняя треть.","    MOV R2, 0          ; Старшая треть.","    MOV R15, 0         ; Статус самой программы: 0 означает успех.","    MOV R3, ARRAY_A    ; Адрес заголовка A.","    MOV R4, ARRAY_B    ; Адрес заголовка B.","    MOV R5, [R3]       ; Читаем длину A из ОЗУ, не зашиваем ее в цикл.","    MOV R9, [R4]       ; Второй массив тоже содержит собственный заголовок.","    CMP R5, R9         ; Скалярное произведение требует совпадения длин.","    JNZ invalid        ; Не используем молча минимум из двух длин.","    CMP R5, 10         ; Выделено место под 10 элементов каждого массива.","    JC length_ok       ; Длины 0..9 тоже допустимы для граничных тестов.","    JZ length_ok       ; Основной вариант задания: ровно 10.","invalid:","    MOV R15, 1         ; Разные или слишком большие длины – ошибка входных данных.","    HALT               ; Это ошибка программы, а не ошибка декодера процессора.","","length_ok:","    ADD R3, 2          ; Перейти от заголовка A к A[0].","    ADD R4, 2          ; Перейти от заголовка B к B[0].","    CMP R5, 0          ; Пустые массивы дают нулевую сумму.","    JZ done            ; Не читаем ни одного элемента для длины 0.","loop:","    MOV R6, [R3]       ; Загрузить A[i] в регистр: только MOV обращается к данным ОЗУ.","    MOV R7, [R4]       ; Загрузить B[i]. Сам MUL не обращается к памяти.","    MUL R6, R7         ; Наша ISA: signed(R6)*signed(R7) -&gt; R7:R6.","    MOV R8, R7         ; Знак 32-битного произведения находится в старшем слове.","    SAR R8, 15         ; Готовим третье слово: 0000 для плюса, FFFF для минуса.","    ADD R0, R6         ; Сложить младшие слова и получить CF.","    ADC R1, R7         ; Сложить средние слова с переносом из предыдущего ADD.","    ADC R2, R8         ; Сложить старшие слова с переносом из предыдущего ADC.","    ADD R3, 2          ; Шаг указателя равен размеру элемента, а не инструкции.","    ADD R4, 2          ; Следующий элемент B.","    SUB R5, 1          ; Последняя арифметическая команда перед JNZ задает ZF.","    JNZ loop           ; Управление потоком через PC, а не через цикл Python.","","done:","    MOV [RESULT], R0    ; Три обычные пересылки записывают длинный результат.","    MOV [RESULT+2], R1","    MOV [RESULT+4], R2","    HALT","",".org 0x0400","ARRAY_A:","    .word 10","    .word -32768, 32767, -30000, 30000, -25000, 25000, -20000, 20000, -15000, 15000",".org 0x0440","ARRAY_B:","    .word 10","    .word -32768, 32767, 30000, 30000, 25000, 25000, -20000, 20000, 15000, 15000",".org 0x0500","RESULT:","    .word 0, 0, 0      ; Порядок в памяти: младшее слово, среднее, старшее."],"symbols":{},"sha256":"995465137a54715563e4a7dc6841c5fbc054cf6bbc3fe90d35b132c033efea5a"},"src/rpaoias/programs/overflow.asm":{"text":"; Микроопыт: CF и OF отвечают на разные вопросы.\n.org 0\n    MOV R0, 32767      ; Максимальное положительное знаковое 16-битное число.\n    ADD R0, 1          ; Биты 8000: signed=-32768, unsigned=32768.\n    HALT               ; OF=1, CF=0, SF=1, ZF=0. HALT сохраняет эти флаги.\n","html":["; Микроопыт: CF и OF отвечают на разные вопросы.",".org 0","    MOV R0, 32767      ; Максимальное положительное знаковое 16-битное число.","    ADD R0, 1          ; Биты 8000: signed=-32768, unsigned=32768.","    HALT               ; OF=1, CF=0, SF=1, ZF=0. HALT сохраняет эти флаги."],"symbols":{},"sha256":"f26ad83b23f3dc30990e242b86d483702a60cfcefda9d2631959ecc72c8c92a5"},"src/rpaoias/programs/sum.asm":{"text":"; Вариант 2, задание 1: сумма знаковых элементов массива.\n; Первый элемент ARRAY – количество последующих элементов, а не слагаемое.\n; ОЗУ байтовая: одно 16-битное значение занимает ДВА адреса.\n;\n; R2:R1:R0 – 48-битный накопитель, от старшего слова к младшему.\n; R3 – адрес текущего элемента; R5 – оставшееся количество.\n; R6 – элемент; R7 – его знаковое расширение; R15 – статус (0=успех).\n\n.entry start\n.org 0\nstart:\n    MOV R0, 0          ; Обнуляем младшие 16 бит накопителя.\n    MOV R1, 0          ; Средние 16 бит – отдельный регистр, не Python int.\n    MOV R2, 0          ; Старшие 16 бит; все три части вместе представляют сумму.\n    MOV R15, 0         ; Это соглашение программы, не аппаратный флаг CPU.\n    MOV R3, ARRAY      ; Без скобок имя метки означает ее АДРЕС.\n    MOV R5, [R3]       ; Со скобками читаем слово ОЗУ по этому адресу: длину.\n    ADD R3, 2          ; Пропускаем заголовок: он занимает два байта.\n    CMP R5, 15         ; Для демонстрации принимаем длины 0..15.\n    JC length_ok       ; CF=1 после CMP означает unsigned R5 < 15.\n    JZ length_ok       ; Равенство 15 также допустимо.\n    MOV R15, 1         ; Заголовок поврежден: не выходим за выделенный массив.\n    HALT               ; Отладчик покажет ненулевой статус.\n\nlength_ok:\n    CMP R5, 0          ; Нулевую длину обрабатываем до первой итерации.\n    JZ done            ; Иначе SUB 0,1 превратил бы счетчик в 65535.\nloop:\n    MOV R6, [R3]       ; Косвенно-регистровая адресация: читаем текущий элемент.\n    MOV R7, R6         ; Сохраняем копию для получения знакового расширения.\n    SAR R7, 15         ; Для отрицательного числа R7=FFFF, иначе R7=0000.\n    ADD R0, R6         ; Сумма младших частей формирует перенос CF.\n    ADC R1, R7         ; Средние части + перенос из младшего слова.\n    ADC R2, R7         ; Старшие части + НОВЫЙ перенос из среднего слова.\n    ADD R3, 2          ; Только после цепочки ADC можно менять флаги счетчиками.\n    SUB R5, 1          ; Уменьшаем число оставшихся элементов и обновляем ZF.\n    JNZ loop           ; Возвращаемся, пока ZF=0, то есть счетчик не нулевой.\n\ndone:\n    MOV [RESULT], R0    ; Сохраняем младшую часть результата в память.\n    MOV [RESULT+2], R1  ; Следующее слово начинается через два байта.\n    MOV [RESULT+4], R2  ; Старшая часть завершает 48-битное число.\n    HALT               ; PC уже укажет за HALT; IR останется равен коду HALT.\n\n.org 0x0400\nARRAY:\n    .word 10           ; Длина массива, не один из десяти обрабатываемых элементов.\n    .word 32767, 32767, -12, 8, -3, 100, -200, 50, -25, 7\n\n.org 0x0500\nRESULT:\n    .word 0, 0, 0      ; Резервируем 6 байт: low, middle, high.\n","html":["; Вариант 2, задание 1: сумма знаковых элементов массива.","; Первый элемент ARRAY – количество последующих элементов, а не слагаемое.","; ОЗУ байтовая: одно 16-битное значение занимает ДВА адреса.",";","; R2:R1:R0 – 48-битный накопитель, от старшего слова к младшему.","; R3 – адрес текущего элемента; R5 – оставшееся количество.","; R6 – элемент; R7 – его знаковое расширение; R15 – статус (0=успех).","",".entry start",".org 0","start:","    MOV R0, 0          ; Обнуляем младшие 16 бит накопителя.","    MOV R1, 0          ; Средние 16 бит – отдельный регистр, не Python int.","    MOV R2, 0          ; Старшие 16 бит; все три части вместе представляют сумму.","    MOV R15, 0         ; Это соглашение программы, не аппаратный флаг CPU.","    MOV R3, ARRAY      ; Без скобок имя метки означает ее АДРЕС.","    MOV R5, [R3]       ; Со скобками читаем слово ОЗУ по этому адресу: длину.","    ADD R3, 2          ; Пропускаем заголовок: он занимает два байта.","    CMP R5, 15         ; Для демонстрации принимаем длины 0..15.","    JC length_ok       ; CF=1 после CMP означает unsigned R5 &lt; 15.","    JZ length_ok       ; Равенство 15 также допустимо.","    MOV R15, 1         ; Заголовок поврежден: не выходим за выделенный массив.","    HALT               ; Отладчик покажет ненулевой статус.","","length_ok:","    CMP R5, 0          ; Нулевую длину обрабатываем до первой итерации.","    JZ done            ; Иначе SUB 0,1 превратил бы счетчик в 65535.","loop:","    MOV R6, [R3]       ; Косвенно-регистровая адресация: читаем текущий элемент.","    MOV R7, R6         ; Сохраняем копию для получения знакового расширения.","    SAR R7, 15         ; Для отрицательного числа R7=FFFF, иначе R7=0000.","    ADD R0, R6         ; Сумма младших частей формирует перенос CF.","    ADC R1, R7         ; Средние части + перенос из младшего слова.","    ADC R2, R7         ; Старшие части + НОВЫЙ перенос из среднего слова.","    ADD R3, 2          ; Только после цепочки ADC можно менять флаги счетчиками.","    SUB R5, 1          ; Уменьшаем число оставшихся элементов и обновляем ZF.","    JNZ loop           ; Возвращаемся, пока ZF=0, то есть счетчик не нулевой.","","done:","    MOV [RESULT], R0    ; Сохраняем младшую часть результата в память.","    MOV [RESULT+2], R1  ; Следующее слово начинается через два байта.","    MOV [RESULT+4], R2  ; Старшая часть завершает 48-битное число.","    HALT               ; PC уже укажет за HALT; IR останется равен коду HALT.","",".org 0x0400","ARRAY:","    .word 10           ; Длина массива, не один из десяти обрабатываемых элементов.","    .word 32767, 32767, -12, 8, -3, 100, -200, 50, -25, 7","",".org 0x0500","RESULT:","    .word 0, 0, 0      ; Резервируем 6 байт: low, middle, high."],"symbols":{},"sha256":"eb3b2cbbe7d18371f05d55269f973448acde310756333a3a1746d48a13ae7b6b"},"src/rpaoias/ui/__init__.py":{"text":"\"\"\"Компонент учебного эмулятора; подробности находятся в соседних модулях.\"\"\"\n","html":["<span class=\"sd\">&quot;&quot;&quot;Компонент учебного эмулятора; подробности находятся в соседних модулях.&quot;&quot;&quot;<\/span>"],"symbols":{},"sha256":"31ec514d9a56a45b2f10e4106f07da09ac352eab883de883da9ef0bd8e98db84"},"src/rpaoias/ui/window.py":{"text":"\"\"\"Оконный отладчик: показывает CPU, но не подменяет его исполнение.\n\nМетодичка, 4.1, стр. 35–36: РОН, PC, IR, флаги, машинная инструкция,\nее поля и ассемблерное представление должны быть понятны пользователю.\n\nЗдесь Run – серия вызовов step по сигналам QTimer. Бесконечный while\nв обработчике кнопки заблокировал бы цикл событий Qt: окно перестало бы\nперерисовываться, а кнопку паузы невозможно было бы нажать.\nТаймер задает скорость ПОКАЗА, а не тактовую частоту моделируемого CPU.\n\nИнтерфейс не знает формул ADD/ADC и не вычисляет сумму массива. Для него\nCPU – объект со step(), snapshot() и памятью для наблюдения.\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nfrom PySide6.QtCore import Qt, QTimer\nfrom PySide6.QtGui import QCloseEvent, QColor, QFontDatabase, QTextCharFormat, QTextCursor, QTextFormat\nfrom PySide6.QtWidgets import (\n    QAbstractItemView,\n    QApplication,\n    QComboBox,\n    QFileDialog,\n    QGroupBox,\n    QHBoxLayout,\n    QHeaderView,\n    QLabel,\n    QMainWindow,\n    QMessageBox,\n    QPlainTextEdit,\n    QPushButton,\n    QSpinBox,\n    QSplitter,\n    QTabWidget,\n    QTableWidget,\n    QTableWidgetItem,\n    QTextEdit,\n    QVBoxLayout,\n    QWidget,\n)\n\nfrom rpaoias.assembler.assembler import Program, assemble\nfrom rpaoias.cli import trace_line\nfrom rpaoias.cpu.processor import CPU, StepResult\nfrom rpaoias.cpu.word import MEMORY_BYTES, join_words, signed\nfrom rpaoias.errors import EmulatorError\nfrom rpaoias.examples import EXAMPLES, example_source\nfrom rpaoias.isa.codec import decode\n\n\ndef _table(headers: list[str], rows: int = 0) -> QTableWidget:\n    \"\"\"Таблицы здесь только для чтения: редактирование идет через исходник .asm.\"\"\"\n    table = QTableWidget(rows, len(headers))\n    table.setHorizontalHeaderLabels(headers)\n    table.setEditTriggers(QAbstractItemView.EditTrigger.NoEditTriggers)\n    table.setSelectionBehavior(QAbstractItemView.SelectionBehavior.SelectRows)\n    table.verticalHeader().hide()\n    table.setAlternatingRowColors(True)\n    table.setFont(QFontDatabase.systemFont(QFontDatabase.SystemFont.FixedFont))\n    table.horizontalHeader().setSectionResizeMode(QHeaderView.ResizeMode.ResizeToContents)\n    table.horizontalHeader().setStretchLastSection(True)\n    return table\n\n\ndef _cell(table: QTableWidget, row: int, column: int, text: str, changed: bool = False) -> None:\n    item = QTableWidgetItem(text)\n    if changed:\n        # Цвет – только указание изменения на последнем шаге, не значение CPU.\n        item.setBackground(QColor(\"#d8f0e2\"))\n        item.setForeground(QColor(\"#173a29\"))\n    table.setItem(row, column, item)\n\n\nclass MainWindow(QMainWindow):\n    def __init__(self) -> None:\n        super().__init__()\n        self.setWindowTitle(\"РПАО ИАС | Вариант 2 | Учебный процессор\")\n        self.resize(1380, 930)\n        self.program: Program | None = None\n        self.cpu: CPU | None = None\n        self.assembled_source = \"\"\n        self.last_step: StepResult | None = None\n        self.current_path: Path | None = None\n        self.faulted = False\n        self.run_budget = 0\n        self.timer = QTimer(self)\n        self.timer.timeout.connect(self._tick)\n\n        central = QWidget()\n        root = QVBoxLayout(central)\n        self.setCentralWidget(central)\n        heading = QLabel(\"Двухадресная машина: 16-битные данные / 32-битные команды / единая ОЗУ\")\n        heading.setWordWrap(True)\n        root.addWidget(heading)\n\n        toolbar = QHBoxLayout()\n        self.example_box = QComboBox()\n        for name, label in EXAMPLES.items():\n            self.example_box.addItem(label, name)\n        self.load_button = QPushButton(\"Загрузить пример\")\n        self.open_button = QPushButton(\"Открыть .asm\")\n        self.save_button = QPushButton(\"Сохранить .asm\")\n        self.assemble_button = QPushButton(\"Собрать\")\n        self.reset_button = QPushButton(\"Сброс CPU\")\n        self.step_button = QPushButton(\"Шаг\")\n        self.run_button = QPushButton(\"Пуск\")\n        self.pause_button = QPushButton(\"Пауза\")\n        self.speed = QSpinBox()\n        self.speed.setRange(1, 100)\n        self.speed.setValue(10)\n        self.speed.setSuffix(\" ком/с\")\n        for widget in (self.example_box, self.load_button, self.open_button, self.save_button,\n                       self.assemble_button, self.reset_button, self.step_button,\n                       self.run_button, self.pause_button, self.speed):\n            toolbar.addWidget(widget)\n        root.addLayout(toolbar)\n\n        # Splitter дает изменить пропорции без фиксированных размеров экрана.\n        vertical = QSplitter(Qt.Orientation.Vertical)\n        top = QSplitter(Qt.Orientation.Horizontal)\n        left = QTabWidget()\n        self.editor = QPlainTextEdit()\n        self.editor.setFont(QFontDatabase.systemFont(QFontDatabase.SystemFont.FixedFont))\n        self.editor.setLineWrapMode(QPlainTextEdit.LineWrapMode.NoWrap)\n        self.editor.setPlaceholderText(\"Введи программу на нашем ассемблере и нажми «Собрать».\")\n        self.listing = _table([\"Адрес\", \"Машинное слово\", \"Исходная команда\"])\n        left.addTab(self.editor, \"Исходник с комментариями\")\n        left.addTab(self.listing, \"Листинг сборки\")\n        top.addWidget(left)\n\n        right = QWidget()\n        side = QVBoxLayout(right)\n        self.state_label = QLabel()\n        self.state_label.setWordWrap(True)\n        side.addWidget(self.state_label)\n        self.register_table = _table([\"РОН\", \"HEX\", \"signed\", \"unsigned\"], 16)\n        side.addWidget(self.register_table, 2)\n        instruction_box = QGroupBox(\"IR: последняя исполненная инструкция и ее поля\")\n        instruction_layout = QVBoxLayout(instruction_box)\n        self.instruction_text = QPlainTextEdit()\n        self.instruction_text.setReadOnly(True)\n        self.instruction_text.setFont(QFontDatabase.systemFont(QFontDatabase.SystemFont.FixedFont))\n        self.instruction_text.setMaximumHeight(170)\n        instruction_layout.addWidget(self.instruction_text)\n        side.addWidget(instruction_box)\n        self.result_label = QLabel()\n        self.result_label.setWordWrap(True)\n        side.addWidget(self.result_label)\n        top.addWidget(right)\n        top.setStretchFactor(0, 3)\n        top.setStretchFactor(1, 2)\n        top.setSizes([820, 520])\n        vertical.addWidget(top)\n\n        lower = QTabWidget()\n        memory_panel = QWidget()\n        memory_layout = QVBoxLayout(memory_panel)\n        memory_controls = QHBoxLayout()\n        memory_controls.addWidget(QLabel(\"ОЗУ: страница по 256 байт\"))\n        self.memory_page = QComboBox()\n        for address in range(0, MEMORY_BYTES, 256):\n            self.memory_page.addItem(f\"0x{address:04X}..0x{address + 255:04X}\", address)\n        memory_controls.addWidget(self.memory_page)\n        self.result_memory_button = QPushButton(\"К RESULT\")\n        memory_controls.addWidget(self.result_memory_button)\n        memory_controls.addStretch()\n        memory_layout.addLayout(memory_controls)\n        self.memory_table = _table([\"Адрес\", \"Байты low high\", \"Слово HEX\", \"signed\", \"Метки\"], 128)\n        memory_layout.addWidget(self.memory_table)\n        lower.addTab(memory_panel, \"Единая память команд и данных\")\n        self.trace = QPlainTextEdit()\n        self.trace.setReadOnly(True)\n        self.trace.setFont(QFontDatabase.systemFont(QFontDatabase.SystemFont.FixedFont))\n        self.trace.setMaximumBlockCount(5000)\n        lower.addTab(self.trace, \"Трасса исполнения, последние 5000 строк\")\n        vertical.addWidget(lower)\n        vertical.setSizes([650, 220])\n        root.addWidget(vertical)\n        self.error_label = QLabel()\n        self.error_label.setWordWrap(True)\n        root.addWidget(self.error_label)\n\n        self.load_button.clicked.connect(self.load_example)\n        self.open_button.clicked.connect(self.open_source)\n        self.save_button.clicked.connect(self.save_source)\n        self.assemble_button.clicked.connect(self.assemble_source)\n        self.reset_button.clicked.connect(self.reset_cpu)\n        self.step_button.clicked.connect(self.step_once)\n        self.run_button.clicked.connect(self.start_run)\n        self.pause_button.clicked.connect(self.pause)\n        self.speed.valueChanged.connect(self._update_interval)\n        self.memory_page.currentIndexChanged.connect(self._refresh_memory)\n        self.result_memory_button.clicked.connect(self.show_result_memory)\n        self.editor.textChanged.connect(self._source_changed)\n        self._update_interval()\n        self.editor.setPlainText(example_source(\"sum\"))\n        self.assemble_source()\n\n    def _update_interval(self, _value: int = 0) -> None:\n        self.timer.setInterval(max(1, 1000 // self.speed.value()))\n\n    def _source_changed(self) -> None:\n        \"\"\"Изменение текста не должно незаметно менять исполняемый образ ОЗУ.\"\"\"\n        if self.timer.isActive():\n            self.pause()\n        self._buttons()\n        if self.program and self.editor.toPlainText() != self.assembled_source:\n            self.statusBar().showMessage(\"Исходник изменен. Для исполнения новой версии нажми «Собрать».\")\n            self.editor.setExtraSelections([])\n\n    def _buttons(self) -> None:\n        running = self.timer.isActive()\n        fresh = self.program is not None and self.editor.toPlainText() == self.assembled_source\n        executable = fresh and self.cpu is not None and not self.cpu.halted and not self.faulted\n        self.step_button.setEnabled(executable and not running)\n        self.run_button.setEnabled(executable and not running)\n        self.pause_button.setEnabled(running)\n        self.reset_button.setEnabled(fresh and not running)\n        self.assemble_button.setEnabled(not running)\n        self.load_button.setEnabled(not running)\n        self.open_button.setEnabled(not running)\n        self.example_box.setEnabled(not running)\n        self.editor.setReadOnly(running)\n        self.result_memory_button.setEnabled(bool(self.program and \"RESULT\" in self.program.symbols))\n\n    def _may_replace_source(self) -> bool:\n        \"\"\"Перед заменой пользовательского текста спрашиваем, чтобы не терять правки.\"\"\"\n        if not self.editor.document().isModified():\n            return True\n        answer = QMessageBox.question(\n            self, \"Несохраненный исходник\", \"Заменить исходник и отбросить несохраненные изменения?\",\n            QMessageBox.StandardButton.Yes | QMessageBox.StandardButton.No,\n            QMessageBox.StandardButton.No,\n        )\n        return answer == QMessageBox.StandardButton.Yes\n\n    def load_example(self) -> None:\n        if not self._may_replace_source():\n            return\n        self.pause()\n        self.current_path = None\n        self.editor.setPlainText(example_source(str(self.example_box.currentData())))\n        self.assemble_source()\n\n    def open_source(self) -> None:\n        if not self._may_replace_source():\n            return\n        filename, _filter = QFileDialog.getOpenFileName(self, \"Открыть программу\", \"\", \"Ассемблер (*.asm);;Все файлы (*)\")\n        if filename:\n            try:\n                path = Path(filename)\n                text = path.read_text(encoding=\"utf-8-sig\")\n            except (OSError, UnicodeError) as exc:\n                self._error(str(exc))\n                return\n            self.current_path = path\n            self.editor.setPlainText(text)\n            self.assemble_source()\n\n    def save_source(self) -> None:\n        filename, _filter = QFileDialog.getSaveFileName(\n            self, \"Сохранить программу\", str(self.current_path or \"program.asm\"), \"Ассемблер (*.asm)\")\n        if filename:\n            try:\n                Path(filename).write_text(self.editor.toPlainText(), encoding=\"utf-8\")\n            except OSError as exc:\n                self._error(str(exc))\n                return\n            self.current_path = Path(filename)\n            self.editor.document().setModified(False)\n            self.statusBar().showMessage(f\"Сохранено: {filename}\")\n\n    def assemble_source(self) -> None:\n        self.pause()\n        source = self.editor.toPlainText()\n        try:\n            program = assemble(source)\n        except EmulatorError as exc:\n            self._error(str(exc))\n            self._buttons()\n            return\n        self.program = program\n        self.assembled_source = source\n        self.listing.setRowCount(len(program.listing))\n        for index, row in enumerate(program.listing):\n            _cell(self.listing, index, 0, f\"{row.address:04X}\")\n            _cell(self.listing, index, 1, f\"{row.word:08X}\")\n            _cell(self.listing, index, 2, row.source.split(\";\", 1)[0].strip())\n        self.reset_cpu()\n        self.statusBar().showMessage(f\"Собрано: {len(program.listing)} инструкций. Точка входа 0x{program.entry:04X}.\")\n\n    def reset_cpu(self) -> None:\n        \"\"\"Сброс восстанавливает И регистры, И память из исходного образа сборки.\"\"\"\n        if self.program is None:\n            return\n        self.pause()\n        self.cpu = CPU(self.program.image, self.program.entry)\n        self.last_step = None\n        self.faulted = False\n        self.error_label.clear()\n        self.trace.clear()\n        self.refresh()\n\n    def step_once(self) -> None:\n        if self.cpu is None or self.cpu.halted or self.faulted:\n            return\n        if self.editor.toPlainText() != self.assembled_source:\n            self._error(\"Сначала собери измененный исходник.\")\n            return\n        try:\n            self.last_step = self.cpu.step()\n        except EmulatorError as exc:\n            self.faulted = True\n            self.pause()\n            self._error(str(exc))\n            self.refresh()\n            return\n        self.trace.appendPlainText(trace_line(self.last_step))\n        if self.cpu.halted:\n            self.pause()\n        self.refresh()\n\n    def start_run(self) -> None:\n        if self.cpu is None or self.cpu.halted or self.faulted:\n            return\n        if self.editor.toPlainText() != self.assembled_source:\n            return\n        self.run_budget = 100_000\n        self.timer.start()\n        self._buttons()\n\n    def _tick(self) -> None:\n        if self.run_budget <= 0:\n            self.pause()\n            self._error(\"Лимит 100000 команд исчерпан. CPU не остановлен HALT; доступно продолжение.\")\n            return\n        self.step_once()\n        self.run_budget -= 1\n\n    def pause(self) -> None:\n        self.timer.stop()\n        self._buttons()\n\n    def _error(self, message: str) -> None:\n        # Не блокируем event loop модальным окном при ошибке машинной программы.\n        self.error_label.setText(f\"Ошибка: {message}\")\n        self.statusBar().showMessage(message)\n\n    def show_result_memory(self) -> None:\n        if self.program and \"RESULT\" in self.program.symbols:\n            self.memory_page.setCurrentIndex(self.program.symbols[\"RESULT\"] // 256)\n\n    def _refresh_memory(self, _index: int = 0) -> None:\n        if self.cpu is None:\n            return\n        base = int(self.memory_page.currentData() or 0)\n        image = self.cpu.memory.image()\n        changed = {address for address, old, new in self.last_step.memory_writes if old != new} if self.last_step else set()\n        labels: dict[int, list[str]] = {}\n        if self.program:\n            for name, address in self.program.symbols.items():\n                labels.setdefault(address, []).append(name)\n        for row in range(128):\n            address = base + 2 * row\n            word = self.cpu.memory.read_word(address)\n            values = (f\"{address:04X}\", f\"{image[address]:02X} {image[address + 1]:02X}\",\n                      f\"{word:04X}\", str(signed(word)), \", \".join(labels.get(address, [])))\n            for column, text in enumerate(values):\n                _cell(self.memory_table, row, column, text, address in changed)\n\n    def refresh(self) -> None:\n        if self.cpu is None:\n            return\n        cpu = self.cpu\n        flags = cpu.flags\n        state = \"ОШИБКА\" if self.faulted else (\"HALT\" if cpu.halted else \"готов к шагу\")\n        self.state_label.setText(\n            f\"PC: 0x{cpu.pc:04X} | шагов: {cpu.steps} | {state}\\n\"\n            f\"ZF={int(flags.zf)}  SF={int(flags.sf)}  CF={int(flags.cf)}  OF={int(flags.of)}\")\n        for row, word in enumerate(cpu.registers):\n            changed = bool(self.last_step and word != self.last_step.before.registers[row])\n            for column, text in enumerate((f\"R{row}\", f\"{word:04X}\", str(signed(word)), str(word))):\n                _cell(self.register_table, row, column, text, changed)\n        if self.last_step:\n            instruction = self.last_step.instruction\n            self.instruction_text.setPlainText(\n                f\"Адрес IR: 0x{self.last_step.address:04X}\\n\"\n                f\"ASM: {instruction.assembly()}\\nHEX: 0x{cpu.ir:08X}\\n\"\n                f\"opcode[31:24]={int(instruction.opcode):08b}  reg[23:20]={instruction.register:04b}\\n\"\n                f\"mode[19:18]={int(instruction.mode):02b} ({instruction.mode.name})  reserve[17:16]=00\\n\"\n                f\"operand[15:0]={instruction.operand:016b}\")\n        else:\n            self.instruction_text.setPlainText(\"IR=0x00000000 после сброса. Ни одна команда еще не исполнена.\")\n        if not cpu.halted:\n            try:\n                upcoming = decode(cpu.memory.read_instruction(cpu.pc)).assembly()\n            except EmulatorError as exc:\n                upcoming = f\"ошибка чтения следующей команды: {exc}\"\n        else:\n            upcoming = \"не выполняется: достигнут HALT\"\n        text = (f\"По PC следующая: {upcoming}\\n\"\n                f\"Наблюдение R2:R1:R0 (signed 48): {join_words(cpu.registers[:3])}\")\n        if self.program and \"RESULT\" in self.program.symbols:\n            address = self.program.symbols[\"RESULT\"]\n            try:\n                value = join_words([cpu.memory.read_word(address + 2 * i) for i in range(3)])\n                text += f\"\\nОЗУ RESULT (3 слова, low first): {value}\"\n            except EmulatorError:\n                text += \"\\nRESULT: для трех слов не хватает ОЗУ\"\n            text += \"\\nДля встроенных задач: R15=0 успех, R15=1 ошибка заголовков.\"\n        self.result_label.setText(text)\n        # Подсветка относится к следующей команде, а не к уже выполненному IR.\n        selections = []\n        if self.program and not cpu.halted and self.editor.toPlainText() == self.assembled_source:\n            for index, row in enumerate(self.program.listing):\n                if row.address == cpu.pc:\n                    self.listing.selectRow(index)\n                    block = self.editor.document().findBlockByNumber(row.line - 1)\n                    selection = QTextEdit.ExtraSelection()\n                    selection.cursor = QTextCursor(block)\n                    selection.format = QTextCharFormat()\n                    selection.format.setBackground(QColor(\"#dcebf6\"))\n                    selection.format.setForeground(QColor(\"#152f43\"))\n                    selection.format.setProperty(QTextFormat.Property.FullWidthSelection, True)\n                    selections.append(selection)\n                    break\n        else:\n            self.listing.clearSelection()\n        self.editor.setExtraSelections(selections)\n        self._refresh_memory()\n        self._buttons()\n\n    def closeEvent(self, event: QCloseEvent) -> None:  # noqa: N802\n        \"\"\"Закрытие окна не должно терять несохраненный исходник без вопроса.\"\"\"\n        if self._may_replace_source():\n            self.timer.stop()\n            event.accept()\n        else:\n            event.ignore()\n\n\ndef launch() -> int:\n    app = QApplication.instance() or QApplication(sys.argv[:1])\n    window = MainWindow()\n    # Не предполагаем, что у пользователя большой монитор без масштабирования.\n    # Это влияет только на начальный размер окна, не на размеры модели CPU.\n    screen = app.primaryScreen()\n    if screen is not None:\n        available = screen.availableGeometry()\n        window.resize(min(1380, max(640, available.width() - 60)),\n                      min(930, max(480, available.height() - 80)))\n    window.show()\n    return app.exec()\n","html":["<span class=\"sd\">&quot;&quot;&quot;Оконный отладчик: показывает CPU, но не подменяет его исполнение.<\/span>","","<span class=\"sd\">Методичка, 4.1, стр. 35–36: РОН, PC, IR, флаги, машинная инструкция,<\/span>","<span class=\"sd\">ее поля и ассемблерное представление должны быть понятны пользователю.<\/span>","","<span class=\"sd\">Здесь Run – серия вызовов step по сигналам QTimer. Бесконечный while<\/span>","<span class=\"sd\">в обработчике кнопки заблокировал бы цикл событий Qt: окно перестало бы<\/span>","<span class=\"sd\">перерисовываться, а кнопку паузы невозможно было бы нажать.<\/span>","<span class=\"sd\">Таймер задает скорость ПОКАЗА, а не тактовую частоту моделируемого CPU.<\/span>","","<span class=\"sd\">Интерфейс не знает формул ADD/ADC и не вычисляет сумму массива. Для него<\/span>","<span class=\"sd\">CPU – объект со step(), snapshot() и памятью для наблюдения.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">sys<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">pathlib<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Path<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">PySide6.QtCore<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Qt<\/span><span class=\"p\">,<\/span> <span class=\"n\">QTimer<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">PySide6.QtGui<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">QCloseEvent<\/span><span class=\"p\">,<\/span> <span class=\"n\">QColor<\/span><span class=\"p\">,<\/span> <span class=\"n\">QFontDatabase<\/span><span class=\"p\">,<\/span> <span class=\"n\">QTextCharFormat<\/span><span class=\"p\">,<\/span> <span class=\"n\">QTextCursor<\/span><span class=\"p\">,<\/span> <span class=\"n\">QTextFormat<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">PySide6.QtWidgets<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"p\">(<\/span>","    <span class=\"n\">QAbstractItemView<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QApplication<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QComboBox<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QFileDialog<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QGroupBox<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QHBoxLayout<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QHeaderView<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QLabel<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QMainWindow<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QMessageBox<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QPlainTextEdit<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QPushButton<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QSpinBox<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QSplitter<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QTabWidget<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QTableWidget<\/span><span class=\"p\">,<\/span>","    <span class=\"n\">QTableWidgetItem<\/span><span class=\"p\">,<\/span>"," ass=\"n\">width<\/span><span class=\"p\">()<\/span> <span class=\"o\">-<\/span> <span class=\"mi\">60<\/span><span class=\"p\">)),<\/span>","                      <span class=\"nb\">min<\/span><span class=\"p\">(<\/span><span class=\"mi\">930<\/span><span class=\"p\">,<\/span> <span class=\"nb\">max<\/span><span class=\"p\">(<\/span><span class=\"mi\">480<\/span><span class=\"p\">,<\/span> <span class=\"n\">available<\/span><span class=\"o\">.<\/span><span class=\"n\">height<\/span><span class=\"p\">()<\/span> <span class=\"o\">-<\/span> <span class=\"mi\">80<\/span><span class=\"p\">)))<\/span>","    <span class=\"n\">window<\/span><span class=\"o\">.<\/span><span class=\"n\">show<\/span><span class=\"p\">()<\/span>","    <span class=\"k\">return<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">exec<\/span><span class=\"p\">()<\/span>"],"symbols":{"_table":[52,63],"_cell":[66,72],"MainWindow":[75,440],"launch":[443,454],"__init__":[76,198],"_update_interval":[200,201],"_source_changed":[203,210],"_buttons":[212,225],"_may_replace_source":[227,236],"load_example":[238,244],"open_source":[246,259],"save_source":[261,272],"assemble_source":[274,291],"reset_cpu":[293,303],"step_once":[305,322],"start_run":[324,331],"_tick":[333,339],"pause":[341,343],"_error":[345,348],"show_result_memory":[350,352],"_refresh_memory":[354,370],"refresh":[372,432],"closeEvent":[434,440]},"sha256":"35e60443379d31b03b6c5f40d04957d6ddbb28fa0588d679bad3c266ab2daf0e"},"tests/test_alu.py":{"text":"\"\"\"Тесты как маленькие опыты: каждый фиксирует конкретное правило арифметики.\"\"\"\n\nimport random\n\nimport pytest\n\nfrom rpaoias.cpu.alu import Flags, add, multiply, sar, sub\nfrom rpaoias.cpu.word import join_words, signed, u16\n\n\n@pytest.mark.parametrize(\"bits,value,expected\", [\n    (16, 0, 0), (16, 32767, 32767), (16, 32768, -32768), (16, 65535, -1),\n    (32, 0xFFFFFFFF, -1), (48, 0xFFFFFFFFFFFF, -1),\n])\ndef test_same_bits_different_signed_interpretation(bits, value, expected):\n    assert signed(value, bits) == expected\n\n\ndef test_word_width_is_enforced():\n    assert u16(65536) == 0\n    assert u16(-1) == 65535\n    assert join_words([0, 1, 0]) == 65536\n    assert join_words([0xFFFF] * 3) == -1\n    with pytest.raises(ValueError):\n        signed(0, 0)\n    with pytest.raises(ValueError):\n        join_words([])\n\n\n@pytest.mark.parametrize(\"left,right,carry,result,flags\", [\n    (0, 0, 0, 0, Flags(True, False, False, False)),\n    (32767, 1, 0, 32768, Flags(False, True, False, True)),\n    (65535, 1, 0, 0, Flags(True, False, True, False)),\n    (32768, 65535, 0, 32767, Flags(False, False, True, True)),\n    (65535, 0, 1, 0, Flags(True, False, True, False)),\n    (32767, 0, 1, 32768, Flags(False, True, False, True)),\n    (0, 65535, 1, 0, Flags(True, False, True, False)),\n    (65535, 65535, 1, 65535, Flags(False, True, True, False)),\n])\ndef test_carry_is_not_signed_overflow(left, right, carry, result, flags):\n    actual = add(left, right, carry)\n    assert actual.value == result\n    assert actual.flags == flags\n\n\n@pytest.mark.parametrize(\"left,right,result,flags\", [\n    (0, 1, 65535, Flags(False, True, True, False)),\n    (1, 1, 0, Flags(True, False, False, False)),\n    (32768, 1, 32767, Flags(False, False, False, True)),\n    (32767, 65535, 32768, Flags(False, True, True, True)),\n])\ndef test_borrow_and_signed_subtraction(left, right, result, flags):\n    actual = sub(left, right)\n    assert actual.value == result\n    assert actual.flags == flags\n\n\n@pytest.mark.parametrize(\"left\", [-32768, -32767, -1, 0, 1, 32767])\n@pytest.mark.parametrize(\"right\", [-32768, -32767, -1, 0, 1, 32767])\ndef test_signed_product_has_two_halves(left, right):\n    low, high, flags = multiply(left, right)\n    assert join_words([low, high]) == left * right\n    assert flags.cf == flags.of == (not -32768 <= left * right <= 32767)\n    assert flags.zf == (left * right == 0)\n    assert flags.sf == (left * right < 0)\n\n\n@pytest.mark.parametrize(\"value\", [-32768, -19, -1, 0, 1, 32767])\ndef test_sar_produces_sign_extension(value):\n    assert sar(value, 15, Flags()).value == (0xFFFF if value < 0 else 0)\n\n\ndef test_zero_shift_preserves_flags():\n    previous = Flags(True, True, True, True)\n    assert sar(123, 0, previous).flags is previous\n    assert sar(3, 1, Flags()).flags.cf\n    with pytest.raises(ValueError):\n        sar(1, 16, previous)\n    with pytest.raises(ValueError):\n        add(1, 1, 2)\n\n\ndef test_random_add_adc_sub_against_mathematical_definition():\n    \"\"\"Фиксированный seed делает найденную ошибку воспроизводимой.\"\"\"\n    rng = random.Random(2048)\n    for _ in range(3000):\n        left, right = rng.randrange(65536), rng.randrange(65536)\n        carry = rng.randrange(2)\n        actual = add(left, right, carry)\n        mathematical = signed(left) + signed(right) + carry\n        assert actual.value == (left + right + carry) % 65536\n        assert actual.flags.cf == (left + right + carry >= 65536)\n        assert actual.flags.of == (mathematical < -32768 or mathematical > 32767)\n        difference = sub(left, right)\n        assert difference.value == (left - right) % 65536\n        assert difference.flags.cf == (left < right)\n","html":["<span class=\"sd\">&quot;&quot;&quot;Тесты как маленькие опыты: каждый фиксирует конкретное правило арифметики.&quot;&quot;&quot;<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">random<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">pytest<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.alu<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Flags<\/span><span class=\"p\">,<\/span> <span class=\"n\">add<\/span><span class=\"p\">,<\/span> <span class=\"n\">multiply<\/span><span class=\"p\">,<\/span> <span class=\"n\">sar ing[0].word).operand == 65535\n    assert decode(program.listing[0].word).mode == Mode.IMMEDIATE\n\n\n@pytest.mark.parametrize(\"source\", [\n    \"\", \"; only a comment\", \".word 1\", \"unknown R0,1\", \"MOV R0\", \"HALT R0\", \"NOP,\", \"MOV R0,\",\n    \"MOV ,R0\", \"MOV R0,,1\", \"MOV R0,[R1\", \"MOV R0,R1]\", \"MOV R0,[[R1]]\",\n    \"MOV R0,[]\", \"MOV R0,@\", \"MOV R0,65536\", \"MOV R0,-32769\", \"MOV R16,1\",\n    \"MOV R0,R16\", \"MOV R0,[R16]\", \"MOV [256],[258]\", \"MOV [256],1\",\n    \"ADD R0,[256]\", \"ADD [256],R0\", \"MUL R3,R1\", \"SAR R0,16\",\n    \"JMP nowhere\", \"JMP 3\", \"JMP -4\", \"JMP 4096\", \"MOV R0,[4096]\",\n    \"MOV R0,[3]\", \"MOV R0,1*2\", \"MOV R0,1+\", \"MOV R0,1++2\", \"MOV R0,R1 R2\",\n    \"a: NOP\\na: HALT\", \"R0: HALT\", \".unknown 1\", \".org\", \".word\",\n    \".org -1\\nHALT\", \".org 4096\\nHALT\", \".org 2\\nHALT\",\n    \".org 1\\n.word 1\\nHALT\", \"a: .org 0\\nHALT\",\n    \".org a\\na: HALT\", \".entry 0\\n.entry 0\\nHALT\",\n    \".entry data\\nHALT\\ndata: .word 1\", \"HALT\\n.org 0\\n.word 1\",\n    \"HALT\\n.org 4094\\n.word 1,2\", \"HALT\\n.word 65536\", \"STORE R0,1\",\n])\ndef test_bad_source_has_controlled_diagnostic(source):\n    with pytest.raises(AssemblyError):\n        assemble(source)\n\n\ndef test_error_keeps_line_number():\n    with pytest.raises(AssemblyError) as caught:\n        assemble(\"NOP\\nNOP\\nMOV R16,1\")\n    assert caught.value.line == 3\n\n\ndef test_extremely_long_number_is_a_source_error():\n    with pytest.raises(AssemblyError):\n        assemble(\"MOV R0,\" + \"9\" * 10000)\n","html":["<span class=\"sd\">&quot;&quot;&quot;Отдельно проверяем синтаксис, таблицу меток и ограничения ISA.&quot;&quot;&quot;<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">pytest<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.assembler.assembler<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/sp t<\/span> <span class=\"n\">main<\/span><span class=\"p\">([<\/span><span class=\"s2\">&quot;run&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;sum&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;--result&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;missing&quot;<\/span><span class=\"p\">])<\/span> <span class=\"o\">==<\/span> <span class=\"mi\">2<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">test_execution_limit_and_missing_file<\/span><span class=\"p\">(<\/span><span class=\"n\">capsys<\/span><span class=\"p\">):<\/span>","    <span class=\"k\">assert<\/span> <span class=\"n\">main<\/span><span class=\"p\">([<\/span><span class=\"s2\">&quot;run&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;sum&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;--max-steps&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;1&quot;<\/span><span class=\"p\">])<\/span> <span class=\"o\">==<\/span> <span class=\"mi\">2<\/span>","    <span class=\"k\">assert<\/span> <span class=\"n\">main<\/span><span class=\"p\">([<\/span><span class=\"s2\">&quot;run&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;sum&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;--trace&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;--max-steps&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;1&quot;<\/span><span class=\"p\">])<\/span> <span class=\"o\">==<\/span> <span class=\"mi\">2<\/span>","    <span class=\"k\">assert<\/span> <span class=\"n\">main<\/span><span class=\"p\">([<\/span><span class=\"s2\">&quot;run&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;definitely_absent_54d31.asm&quot;<\/span><span class=\"p\">])<\/span> <span class=\"o\">==<\/span> <span class=\"mi\">2<\/span>","    <span class=\"k\">assert<\/span> <span class=\"n\">capsys<\/span><span class=\"o\">.<\/span><span class=\"n\">readouterr<\/span><span class=\"p\">()<\/span><span class=\"o\">.<\/span><span class=\"n\">err<\/span>"],"symbols":{"test_run_and_trace":[6,9],"test_assemble_exports_full_image":[12,16],"test_bad_input_returns_error_not_traceback":[19,25],"test_execution_limit_and_missing_file":[28,32]},"sha256":"6e47e8b90c648b1af65e9521fdf2bcd15e685ed1f67e441acb07ade74c87d280"},"tests/test_cpu.py":{"text":"\"\"\"Проверяем поведение настоящего fetch/decode/execute, а не только АЛУ.\"\"\"\n\nimport pytest\n\nfrom rpaoias.assembler.assembler import assemble\nfrom rpaoias.cpu.memory import Memory\nfrom rpaoias.cpu.processor import CPU\nfrom rpaoias.errors import CPUFault, ExecutionLimit\n\n\ndef machine(source: str) -> CPU:\n    program = assemble(source)\n    return CPU(program.image, program.entry)\n\n\ndef test_all_four_addressing_modes_and_both_stores():\n    cpu = machine(\"MOV R0,7\\nMOV R1,R0\\nMOV R2,[data]\\nMOV R3,data\\n\"\n                  \"MOV R4,[R3]\\nMOV [R3],R0\\nMOV [data+2],R4\\nHALT\\n\"\n                  \".org 256\\ndata: .word 99,0\")\n    cpu.run()\n    assert cpu.registers[:5] == [7, 7, 99, 256, 99]\n    assert cpu.memory.read_word(256) == 7\n    assert cpu.memory.read_word(258) == 99\n\n\ndef test_cmp_updates_flags_without_replacing_operand():\n    cpu = machine(\"MOV R0,9\\nCMP R0,10\\nHALT\")\n    cpu.run()\n    assert cpu.registers[0] == 9 and cpu.flags.cf\n\n\ndef test_mov_and_halt_preserve_carry_for_adc():\n    cpu = machine(\"MOV R0,65535\\nADD R0,1\\nMOV R1,0\\nADC R1,0\\nHALT\")\n    cpu.run()\n    assert cpu.registers[:2] == [0, 1]\n\n\ndef test_mul_reads_source_before_writing_overlapping_result_pair():\n    cpu = machine(\"MOV R6,-32768\\nMOV R7,-32768\\nMUL R6,R7\\nHALT\")\n    cpu.run()\n    assert cpu.registers[6:8] == [0, 0x4000]\n\n\n@pytest.mark.parametrize(\"command,setup,taken\", [\n    (\"JMP\", \"NOP\", True), (\"JZ\", \"CMP R0,0\", True), (\"JZ\", \"CMP R0,1\", False),\n    (\"JNZ\", \"CMP R0,1\", True), (\"JNZ\", \"CMP R0,0\", False),\n    (\"JC\", \"SUB R0,1\", True), (\"JC\", \"ADD R0,1\", False),\n    (\"JNC\", \"ADD R0,1\", True), (\"JNC\", \"SUB R0,1\", False),\n    (\"JO\", \"MOV R0,32767\\nADD R0,1\", True), (\"JO\", \"ADD R0,1\", False),\n    (\"JNO\", \"ADD R0,1\", True), (\"JNO\", \"MOV R0,32767\\nADD R0,1\", False),\n])\ndef test_branch_conditions(command, setup, taken):\n    cpu = machine(f\"{setup}\\n{command} end\\nMOV R1,1\\nend: HALT\")\n    cpu.run()\n    assert cpu.registers[1] == (0 if taken else 1)\n\n\ndef test_program_can_modify_future_instruction_in_unified_memory():\n    \"\"\"Записываем старшее слово будущего NOP, превращая его в HALT.\n\n    Если CPU исполнял бы заранее разобранный список Python-объектов,\n    эта проверка провалилась бы: он не заметил бы изменения кода в ОЗУ.\n    \"\"\"\n    cpu = machine(\"MOV R0,0xFF00\\nMOV [target+2],R0\\nJMP target\\n\"\n                  \"target: NOP\\nMOV R1,123\\nHALT\")\n    cpu.run()\n    assert cpu.steps == 4\n    assert cpu.registers[1] == 0\n    assert cpu.ir == 0xFF000000\n\n\n@pytest.mark.parametrize(\"source\", [\n    \"MOV R0,4096\\nMOV R1,[R0]\\nHALT\",\n    \"MOV R0,3\\nMOV [R0],R1\\nHALT\",\n    \"MOV R0,-1\\nMOV R1,[R0]\\nHALT\",\n    \"MOV R1,16\\nSAR R0,R1\\nHALT\",\n])\ndef test_fault_does_not_partially_commit(source):\n    cpu = machine(source)\n    cpu.step()\n    before, memory = cpu.snapshot(), cpu.memory.image()\n    with pytest.raises(CPUFault):\n        cpu.step()\n    assert cpu.snapshot() == before\n    assert cpu.memory.image() == memory\n\n\ndef test_corrupted_machine_code_is_checked_at_runtime():\n    cpu = machine(\"NOP\\nHALT\")\n    cpu.memory.write_word(2, 0xAB00)\n    before = cpu.snapshot()\n    with pytest.raises(CPUFault):\n        cpu.step()\n    assert cpu.snapshot() == before\n\n\ndef test_halt_limit_and_instruction_size():\n    cpu = machine(\"loop: JMP loop\")\n    with pytest.raises(ExecutionLimit):\n        cpu.run(7)\n    assert cpu.steps == 7 and not cpu.halted and cpu.pc == 0\n    assert cpu.step().after.steps == 8\n    with pytest.raises(ValueError):\n        cpu.run(0)\n    halted = machine(\"HALT\")\n    halted.run(1)\n    assert halted.pc == 4\n    with pytest.raises(CPUFault):\n        halted.step()\n\n\ndef test_end_of_memory_fetch():\n    cpu = machine(\".entry start\\n.org 4092\\nstart: NOP\")\n    cpu.step()\n    assert cpu.pc == 4096\n    with pytest.raises(CPUFault):\n        cpu.step()\n\n\ndef test_memory_is_little_endian_and_word_reads_are_aligned():\n    memory = Memory()\n    memory.write_word(256, 0x1234)\n    assert memory.image()[256:258] == b\"\\x34\\x12\"\n    for address in (-2, 1, 4095, 4096):\n        with pytest.raises(CPUFault):\n            memory.read_word(address)\n    with pytest.raises(ValueError):\n        Memory(b\"too short\")\n","html":["<span class=\"sd\">&quot;&quot;&quot;Проверяем поведение настоящего fetch/decode/execute, а не только АЛУ.&quot;&quot;&quot;<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">pytest<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.assembler.assembler<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">assemble<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.memory<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Memory<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.processor<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CPU<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.errors<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CPUFault<\/span><span class=\"p\">,<\/span> <span class=\"n\">ExecutionLimit<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/ IMMEDIATE, 4)\n    assert decode(encode(instruction)) == instruction\n\n\ndef test_known_layout_is_not_just_self_consistent():\n    \"\"\"Проверяем конкретную ручную кодировку, не только encode(decode(x)).\"\"\"\n    instruction = Instruction(Opcode.MOV, 2, Mode.IMMEDIATE, 12)\n    assert encode(instruction) == 0x0124000C\n    assert decode(0x0124000C).assembly() == \"MOV R2, 0x000C\"\n    assert encode(Instruction(Opcode.HALT)) == 0xFF000000\n\n\n@pytest.mark.parametrize(\"instruction\", [\n    Instruction(Opcode.ADD, 0, Mode.DIRECT, 1024),\n    Instruction(Opcode.MUL, 1, Mode.REGISTER, 2),\n    Instruction(Opcode.MOV, 16, Mode.IMMEDIATE, 1),\n    Instruction(Opcode.MOV, 0, Mode.REGISTER, 16),\n    Instruction(Opcode.MOV, 0, Mode.INDIRECT, 16),\n    Instruction(Opcode.MOV, 0, Mode.DIRECT, 4096),\n    Instruction(Opcode.MOV, 0, Mode.DIRECT, 3),\n    Instruction(Opcode.MOV, 0, Mode.IMMEDIATE, -1),\n    Instruction(Opcode.MOV, 0, Mode.IMMEDIATE, 65536),\n    Instruction(Opcode.HALT, 1),\n    Instruction(Opcode.NOP, 0, Mode.IMMEDIATE, 0),\n    Instruction(Opcode.JMP, 0, Mode.IMMEDIATE, 2),\n    Instruction(Opcode.JMP, 0, Mode.IMMEDIATE, 4096),\n    Instruction(Opcode.STORE, 0, Mode.IMMEDIATE, 1),\n])\ndef test_invalid_fields_are_rejected_not_truncated(instruction):\n    with pytest.raises(CPUFault):\n        encode(instruction)\n\n\n@pytest.mark.parametrize(\"word\", [-1, 0x100000000, 0xAB000000, 0x01010000])\ndef test_invalid_machine_words_fault(word):\n    with pytest.raises(CPUFault):\n        decode(word)\n","html":["<span class=\"sd\">&quot;&quot;&quot;Машинное кодирование проверяем независимо от ассемблерных строк.&quot;&quot;&quot;<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">pytest<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.errors<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CPUFault<\/span>","<span class=\"kn\">from<\/s =\"n\">word<\/span><span class=\"p\">)<\/span>"],"symbols":{"test_roundtrip_preserves_every_mov_field":[13,15],"test_arithmetic_roundtrip":[20,22],"test_jump_roundtrip":[26,28],"test_known_layout_is_not_just_self_consistent":[31,36],"test_invalid_fields_are_rejected_not_truncated":[55,57],"test_invalid_machine_words_fault":[61,63]},"sha256":"6fb83b4ee7598146c4ad402d3b7d614dafb2445c12d0eeec0e2f37f616427de6"},"tests/test_programs.py":{"text":"\"\"\"Сравниваем программы CPU с независимым математическим эталоном Python.\n\nPython sum используется только В ТЕСТЕ. В CPU отсутствует такая операция:\nего результат строят машинные ADD/ADC/MUL в цикле из .asm-файла.\n\"\"\"\n\nimport random\n\nimport pytest\n\nfrom rpaoias.assembler.assembler import assemble\nfrom rpaoias.cpu.processor import CPU\nfrom rpaoias.cpu.word import join_words\nfrom rpaoias.examples import example_source\n\n\ndef execute(name, left=None, right=None):\n    program = assemble(example_source(name))\n    cpu = CPU(program.image, program.entry)\n    if left is not None:\n        arrays = [(\"ARRAY\" if name == \"sum\" else \"ARRAY_A\", left)]\n        if right is not None:\n            arrays.append((\"ARRAY_B\", right))\n        for label, data in arrays:\n            address = program.symbols[label]\n            cpu.memory.write_word(address, len(data))\n            for index, value in enumerate(data):\n                cpu.memory.write_word(address + 2 + 2 * index, value)\n    cpu.run(5000)\n    address = program.symbols[\"RESULT\"]\n    result = join_words([cpu.memory.read_word(address + 2 * index) for index in range(3)])\n    return result, cpu\n\n\n@pytest.mark.parametrize(\"name,expected,steps\", [(\"sum\", 65459, 105),\n                                                 (\"dot_product\", 2947418113, 141),\n                                                 (\"carry\", 65536, 8)])\ndef test_bundled_examples(name, expected, steps):\n    result, cpu = execute(name)\n    assert result == expected\n    assert cpu.steps == steps\n    assert cpu.registers[15] == 0\n\n\n@pytest.mark.parametrize(\"values\", [[], [0], [-1], [-32768], [32767],\n                                     [32767] * 15, [-32768] * 15,\n                                     [-1, 1] * 7, [32767, -32768] * 7])\ndef test_sum_boundaries_and_header_is_not_summed(values):\n    actual, cpu = execute(\"sum\", values)\n    assert actual == sum(values)\n    assert cpu.registers[15] == 0\n\n\n@pytest.mark.parametrize(\"left,right\", [\n    ([], []), ([0] * 10, [0] * 10), ([-1] * 10, [1] * 10),\n    ([-32768] * 10, [-32768] * 10), ([32767] * 10, [32767] * 10),\n    ([-32768] * 10, [32767] * 10), ([32767, -32768] * 5, [32767] * 10),\n])\ndef test_dot_product_extremes_need_more_than_32_bits(left, right):\n    actual, cpu = execute(\"dot_product\", left, right)\n    expected = sum(a * b for a, b in zip(left, right, strict=True))\n    assert actual == expected\n    assert cpu.registers[15] == 0\n\n\n@pytest.mark.parametrize(\"seed\", range(120))\ndef test_random_arrays_match_math(seed):\n    rng = random.Random(seed)\n    values = [rng.randint(-32768, 32767) for _ in range(rng.randint(6, 15))]\n    actual, _cpu = execute(\"sum\", values)\n    assert actual == sum(values)\n    left = [rng.randint(-32768, 32767) for _ in range(10)]\n    right = [rng.randint(-32768, 32767) for _ in range(10)]\n    actual, _cpu = execute(\"dot_product\", left, right)\n    assert actual == sum(a * b for a, b in zip(left, right, strict=True))\n\n\n@pytest.mark.parametrize(\"a_length,b_length\", [(9, 10), (11, 11), (65535, 65535)])\ndef test_invalid_headers_report_program_status(a_length, b_length):\n    program = assemble(example_source(\"dot_product\"))\n    cpu = CPU(program.image, program.entry)\n    cpu.memory.write_word(program.symbols[\"ARRAY_A\"], a_length)\n    cpu.memory.write_word(program.symbols[\"ARRAY_B\"], b_length)\n    cpu.run()\n    assert cpu.registers[15] == 1\n\n\ndef test_reset_requires_original_memory_image_not_just_zero_registers():\n    program = assemble(example_source(\"sum\"))\n    cpu = CPU(program.image, program.entry)\n    cpu.run()\n    cpu = CPU(program.image, program.entry)\n    assert cpu.steps == 0 and cpu.registers == [0] * 16\n    assert cpu.memory.read_word(program.symbols[\"RESULT\"]) == 0\n","html":["<span class=\"sd\">&quot;&quot;&quot;Сравниваем программы CPU с независимым математическим эталоном Python.<\/span>","","<span class=\"sd\">Python sum используется только В ТЕСТЕ. В CPU отсутствует такая операция:<\/span>","<span class=\"sd\">его результат строят машинные ADD/ADC/MUL в цикле из .asm-файла.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">random<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">pytest<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.assembler.assembler<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">assemble<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.processor<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CPU<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.word<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">join_words<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.examples<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">example_source<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">execute<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"p\">,<\/span> <span class=\"n\">left<\/span><span class=\"o\">=<\/span><span class=\"kc\">None<\/span><span class=\"p\">,<\/span> <span class=\ \"\"\"\n\nimport os\n\nimport pytest\n\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\npytest.importorskip(\"PySide6\", reason=\"Для проверки GUI установи extra gui\")\n\nfrom PySide6.QtTest import QTest  # noqa: E402\nfrom PySide6.QtWidgets import QApplication  # noqa: E402\n\nfrom rpaoias.examples import example_source  # noqa: E402\nfrom rpaoias.ui.window import MainWindow  # noqa: E402\n\n\n@pytest.fixture(scope=\"module\")\ndef app():\n    return QApplication.instance() or QApplication([])\n\n\n@pytest.fixture\ndef window(app):\n    widget = MainWindow()\n    yield widget\n    widget.editor.document().setModified(False)\n    widget.close()\n    app.processEvents()\n\n\ndef test_initial_state_step_and_reset(window):\n    assert window.cpu.steps == 0\n    window.step_button.click()\n    assert window.cpu.steps == 1\n    assert \"MOV R0\" in window.instruction_text.toPlainText()\n    window.reset_button.click()\n    assert window.cpu.steps == 0 and window.cpu.registers == [0] * 16\n\n\ndef test_modified_source_must_be_reassembled(window):\n    window.editor.appendPlainText(\"; changed\")\n    assert not window.step_button.isEnabled()\n    window.assemble_button.click()\n    assert window.step_button.isEnabled()\n\n\ndef test_timer_run_can_be_paused(window):\n    window.speed.setValue(100)\n    window.start_run()\n    QTest.qWait(80)\n    window.pause()\n    steps = window.cpu.steps\n    assert steps > 0\n    QTest.qWait(50)\n    assert window.cpu.steps == steps\n\n\ndef test_dot_product_shown_in_ui(window):\n    window.editor.setPlainText(example_source(\"dot_product\"))\n    window.assemble_source()\n    for _ in range(200):\n        if window.cpu.halted:\n            break\n        window.step_once()\n    assert window.cpu.halted\n    assert \"2947418113\" in window.result_label.text()\n\n\ndef test_fault_is_visible_and_does_not_commit(window):\n    window.editor.setPlainText(\"MOV R0,3\\nMOV R1,[R0]\\nHALT\")\n    window.assemble_source()\n    window.step_once()\n    before = window.cpu.snapshot()\n    window.step_once()\n    assert window.cpu.snapshot() == before\n    assert window.faulted\n    assert \"Ошибка\" in window.error_label.text()\n    assert not window.step_button.isEnabled()\n","html":["<span class=\"sd\">&quot;&quot;&quot;Smoke-тесты реального Qt. Без установленного PySide6 модуль пропускается.<\/span>","","<span class=\"sd\">На машине без дисплея: QT_QPA_PLATFORM=offscreen uv run --extra gui pytest.<\/span>","<span class=\"sd\">Пропуск этих тестов не является подтверждением работоспособности графики.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">os<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">pytest<\/span>","","<span class=\"n\">os<\/span><span class=\"o\">.<\/span><span class=\"n\">environ<\/span><span class=\"o\">.<\/span><span class=\"n\">setdefault<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;QT_QPA_PLATFORM&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;offscreen&quot;<\/span><span class=\"p\">)<\/span>","<span class=\"n\">pytest<\/span><span class=\"o\">.<\/span><span class=\"n\">importorskip<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;PySide6&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">reason<\/span><span class=\"o\">=<\/span><span class=\"s2\">&quot;Для проверки GUI установи extra gui&quot;<\/span><span class=\"p\">)<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">PySide6.QtTest<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">QTest<\/span>  <span class=\"c1\"># noqa: E402<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">PySide6.QtWidgets<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">QApplication<\/span>  <span class=\"c1\"># noqa: о знаковое расширение; R15 – статус (0=успех).\n\n.entry start\n.org 0\nstart:\n    MOV R0, 0          ; Обнуляем младшие 16 бит накопителя.\n    MOV R1, 0          ; Средние 16 бит – отдельный регистр, не Python int.\n    MOV R2, 0          ; Старшие 16 бит; все три части вместе представляют сумму.\n    MOV R15, 0         ; Это соглашение программы, не аппаратный флаг CPU.\n    MOV R3, ARRAY      ; Без скобок имя метки означает ее АДРЕС.\n    MOV R5, [R3]       ; Со скобками читаем слово ОЗУ по этому адресу: длину.\n    ADD R3, 2          ; Пропускаем заголовок: он занимает два байта.\n    CMP R5, 15         ; Для демонстрации принимаем длины 0..15.\n    JC length_ok       ; CF=1 после CMP означает unsigned R5 < 15.\n    JZ length_ok       ; Равенство 15 также допустимо.\n    MOV R15, 1         ; Заголовок поврежден: не выходим за выделенный массив.\n    HALT               ; Отладчик покажет ненулевой статус.\n\nlength_ok:\n    CMP R5, 0          ; Нулевую длину обрабатываем до первой итерации.\n    JZ done            ; Иначе SUB 0,1 превратил бы счетчик в 65535.\nloop:\n    MOV R6, [R3]       ; Косвенно-регистровая адресация: читаем текущий элемент.\n    MOV R7, R6         ; Сохраняем копию для получения знакового расширения.\n    SAR R7, 15         ; Для отрицательного числа R7=FFFF, иначе R7=0000.\n    ADD R0, R6         ; Сумма младших частей формирует перенос CF.\n    ADC R1, R7         ; Средние части + перенос из младшего слова.\n    ADC R2, R7         ; Старшие части + НОВЫЙ перенос из среднего слова.\n    ADD R3, 2          ; Только после цепочки ADC можно менять флаги счетчиками.\n    SUB R5, 1          ; Уменьшаем число оставшихся элементов и обновляем ZF.\n    JNZ loop           ; Возвращаемся, пока ZF=0, то есть счетчик не нулевой.\n\ndone:\n    MOV [RESULT], R0    ; Сохраняем младшую часть результата в память.\n    MOV [RESULT+2], R1  ; Следующее слово начинается через два байта.\n    MOV [RESULT+4], R2  ; Старшая часть завершает 48-битное число.\n наковое расширение произведения; R9 – длина B; R15 – статус.\n\n.entry start\n.org 0\nstart:\n    MOV R0, 0          ; Младшая треть длинного накопителя.\n    MOV R1, 0          ; Средняя треть.\n    MOV R2, 0          ; Старшая треть.\n    MOV R15, 0         ; Статус самой программы: 0 означает успех.\n    MOV R3, ARRAY_A    ; Адрес заголовка A.\n    MOV R4, ARRAY_B    ; Адрес заголовка B.\n    MOV R5, [R3]       ; Читаем длину A из ОЗУ, не зашиваем ее в цикл.\n    MOV R9, [R4]       ; Второй массив тоже содержит собственный заголовок.\n    CMP R5, R9         ; Скалярное произведение требует совпадения длин.\n    JNZ invalid        ; Не используем молча минимум из двух длин.\n    CMP R5, 10         ; Выделено место под 10 элементов каждого массива.\n    JC length_ok       ; Длины 0..9 тоже допустимы для граничных тестов.\n    JZ length_ok       ; Основной вариант задания: ровно 10.\ninvalid:\n    MOV R15, 1         ; Разные или слишком большие длины – ошибка входных данных.\n    HALT               ; Это ошибка программы, а не ошибка декодера процессора.\n\nlength_ok:\n    ADD R3, 2          ; Перейти от заголовка A к A[0].\n    ADD R4, 2          ; Перейти от заголовка B к B[0].\n    CMP R5, 0          ; Пустые массивы дают нулевую сумму.\n    JZ done            ; Не читаем ни одного элемента для длины 0.\nloop:\n    MOV R6, [R3]       ; Загрузить A[i] в регистр: только MOV обращается к данным ОЗУ.\n    MOV R7, [R4]       ; Загрузить B[i]. Сам MUL не обращается к памяти.\n    MUL R6, R7         ; Наша ISA: signed(R6)*signed(R7) -> R7:R6.\n    MOV R8, R7         ; Знак 32-битного произведения находится в старшем слове.\n    SAR R8, 15         ; Готовим третье слово: 0000 для плюса, FFFF для минуса.\n    ADD R0, R6         ; Сложить младшие слова и получить CF.\n    ADC R1, R7         ; Сложить средние слова с переносом из предыдущего ADD.\n    ADC R2, R8         ; Сложить старшие слова с переносом из предыдущего ADC.\n    ADD R3, 2          ; Шаг указателя равен размеру элемента, а не инструкции.\n    ADD R4, 2          ; Следующий элемент B.\n    SUB R5, 1          ; Последняя арифметическая команда перед JNZ задает ZF.\n    JNZ loop           ; Управление потоком через PC, а не через цикл Python.\n\ndone:\n    MOV [RESULT], R0    ; Три обычные пересылки записывают длинный результат.\n    MOV [RESULT+2], R1\n    MOV [RESULT+4], R2\n    HALT\n\n.org 0x0400\nARRAY_A:\n    .word 10\n    .word -32768, 32767, -30000, 30000, -25000, 25000, -20000, 20000, -15000, 15000\n.org 0x0440\nARRAY_B:\n    .word 10\n    .word -32768, 32767, 30000, 30000, 25000, 25000, -20000, 20000, 15000, 15000\n.org 0x0500\nRESULT:\n    .word 0, 0, 0      ; Порядок в памяти: младшее слово, среднее, старшее.\n","listing":[{"address":0,"line":14,"source":"    MOV R0, 0          ; Младшая треть длинного накопителя.","word":17039360},{"address":4,"line":15,"source":"    MOV R1, 0          ; Средняя треть.","word":18087936},{"address":8,"line":16,"source":"    MOV R2, 0          ; Старшая треть.","word":19136512},{"address":12,"line":17,"source":"    MOV R15, 0         ; Статус самой программы: 0 означает успех.","word":32768000},{"address":16,"line":18,"source":"    MOV R3, ARRAY_A    ; Адрес заголовка A.","word":20186112},{"address":20,"line":19,"source":"    MOV R4, ARRAY_B    ; Адрес заголовка B.","word":21234752},{"address":24,"line":20,"source":"    MOV R5, [R3]       ; Читаем длину A из ОЗУ, не зашиваем ее в цикл.","word":22806531},{"address":28,"line":21,"source":"    MOV R9, [R4]       ; Второй массив тоже содержит собственный заголовок.","word":27000836},{"address":32,"line":22,"source":"    CMP R5, R9         ; Скалярное произведение требует совпадения длин.","word":340787209},{"address":36,"line":23,"source":"    JNZ invalid        ; Не используем молча минимум из двух длин.","word":570687540},{"address":40,"line":24,"source":"    CMP R5, 10         ; Выделено место под 10 элементов каждого массива.","word":341049354},{"address":44,"line":25,"source"
