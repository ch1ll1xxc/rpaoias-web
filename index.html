<script type="application/json" id="lesson-data">{"lessons":[{"id":"start","title":"Зачем вообще писать процессор?","kicker":"Начало · сначала задача","goal":"Отделить программу, которая считает, от машины, которая умеет исполнять команды.","body":"<p>Допустим, нам нужно сложить <b>3 и 4<\/b>. В Python это одна строка. Но в этой работе мы задаём другой вопрос: <b>какие действия должна уметь машина, чтобы выполнить такую строку?<\/b><\/p>\n<p>Для начала ей достаточно сохранить два числа, сложить их и сохранить результат. Мы будем добавлять детали только тогда, когда без них нельзя объяснить следующий шаг.<\/p>\n<p>В твоём варианте 2 две задачи: сумма элементов массива и «свёртка» двух массивов по 10 знаковых элементов. Под свёрткой методичка понимает <b>сумму попарных произведений<\/b>. Мы не заменяем её другим алгоритмом.<\/p>","widget":"intro","after":"<p><b>Эмулятор<\/b> — программа, которая воспроизводит поведение выбранной машины. Python описывает правила этой машины. А команды её собственной программы говорят, что сейчас делать с числами.<\/p>\n<p>Сначала пройдём теорию без чтения Python. Во второй части откроем файлы именно твоего проекта и сопоставим каждое правило с кодом.<\/p><aside class=\"note\">Объём страницы: темы предоставленной методички и проект <b>rpaoias 0.1.0<\/b>. Это не полный университетский курс всей вычислительной техники. Темы вне базового варианта отмечены отдельно.<\/aside>","refs":[{"kind":"method","section":"4.1, таблица 4.1","pages":"35–38"},{"kind":"method","section":"4.3","pages":"40–44"}],"quiz":{"q":"Кто проходит по элементам массива в нашем проекте?","options":["Специальная Python-функция суммирования внутри CPU","Программа на ассемблере нашего процессора","Таблица регистров в окне"],"correct":1,"why":["В CPU нет отдельной команды «суммировать массив».","Да. Python исполняет правила MOV, ADD и переходов; последовательность этих команд обходит массив.","Окно только отображает состояние. Оно не вычисляет сумму."]},"part":"theory"},{"id":"bits","title":"Как восемь переключателей хранят число","kicker":"Числа · 1","goal":"Увидеть, что двоичная запись — это сумма весов включённых разрядов.","body":"<p>У каждого переключателя два состояния: <b>0 и 1<\/b>. Такой разряд называется <b>битом<\/b>. Один бит различает два варианта. Два бита — четыре: 00, 01, 10, 11.<\/p>\n<p>Поставим восемь битов в ряд. Справа налево назначим им веса <b>1, 2, 4, 8, 16, 32, 64, 128<\/b>. Включённый бит добавляет свой вес, выключенный — ничего. Никакого угадывания: чтобы прочитать число, складываем видимые веса.<\/p>\n<p>Начни с 5: включены веса 4 и 1. Затем попробуй собрать 13, не нажимая готовый пример.<\/p>","widget":"bits","after":"<p>Восемь битов образуют <b>байт<\/b>. Здесь байт без знака может содержать значения от 0 до 255. Всего значений 256: ноль тоже занимает один вариант.<\/p>\n<p>Крайний справа бит называется <b>младшим<\/b>, потому что его вес минимален. Крайний слева — <b>старшим<\/b>. В коде разряды обычно нумеруют с нуля: в байте это биты 0–7.<\/p><aside class=\"note\">Этот восьмибитный опыт — наш учебный пример. Регистры проекта шире: 16 бит. Начинаем с восьми, чтобы все разряды помещались перед глазами.<\/aside>","refs":[{"kind":"method","section":"3.1","pages":"29–31"},{"kind":"project","path":"src/rpaoias/cpu/word.py"}],"quiz":{"q":"Какие веса дают двоичное 00001101?","options":["8 + 4 + 1","8 + 2 + 1","4 + 2 + 1"],"correct":0,"why":["Да: 8+4+1=13.","Это 11, то есть 00001011.","Это 7, то есть 00000111."]},"part":"theory"},{"id":"bases","title":"Почему в окне написано FFFF","kicker":"Числа · 2","goal":"Связать двоичную, десятичную и шестнадцатеричную запись одного значения.","body":"<p>Число 12 можно записать как <b>12<\/b>, <b>1100₂<\/b> или <b>C₁₆<\/b>. Это не три значения, а три способа записать одно значение. Основание системы счисления определяет веса позиций.<\/p>\n<p>Длинную двоичную строку неудобно читать. Поэтому каждые четыре бита объединяют в одну шестнадцатеричную цифру: 0000 → 0, 1001 → 9, 1010 → A, …, 1111 → F.<\/p>\n<p>Так <b>1111 1111<\/b> превращается в <b>FF<\/b>. Группы битов не исчезли — запись просто стала короче.<\/p>","widget":"bases","after":"<p>Префикс <code>0x<\/code> указывает шестнадцатеричную запись: <code>0x10<\/code> — это 16, а не десять. Префикс <code>0b<\/code> указывает двоичную запись: <code>0b10<\/code> — это 2.<\/p>\n<p>Восьмеричная система группирует биты по три. Она есть среди тем методички, но наш ассемблер принимает десятичные, двоичные и шестнадцатеричные литералы; синтаксис <code>0o<\/code> в нём не реализован.<\/p><aside class=\"note\">Уточнение терминологии источника: основания равны 2, 8 и 16. Восьмеричная и шестнадцатеричная системы имеют основания — степени двойки, но не само основание 2.<\/aside>","refs":[{"kind":"method","section":"3.1","pages":"29"},{"kind":"project","path":"docs/assembler.md"}],"quiz":{"q":"Чему равно 0x0010?","options":["10","16","2"],"correct":1,"why":["Это было бы 0x000A.","Да: одна шестнадцатеричная шестнадцатка и ноль единиц.","Это 0b10, но не 0x10."]},"part":"theory"},{"id":"signed","title":"Одни биты — два прочтения","kicker":"Числа · 3","goal":"Разделить хранимые биты и знаковую интерпретацию.","body":"<p>В регистре нашего процессора 16 мест для битов. Они не содержат отдельной наклейки «отрицательное число». Правило чтения этих битов выбирает операция или отображение.<\/p>\n<p>Без знака все 16 весов положительны. Диапазон получается <b>0…65535<\/b>. В <b>дополнительном коде<\/b> старший бит имеет вес −32768, остальные веса остаются положительными. Диапазон: <b>−32768…32767<\/b>.<\/p>\n<p>Проверь FFFF: без знака сумма весов равна 65535. Со знаком получаем −32768 + 32767 = −1. Значение в регистре при переключении вида не меняется.<\/p>","widget":"signed","after":"<p>Именно поэтому GUI одновременно показывает <b>HEX, signed, unsigned<\/b>. Это три представления одного набора битов, а не три регистра.<\/p>\n<p><b>Разрядность<\/b> — количество битов, отведённых под величину. У нас данные занимают 16 бит, инструкция — 32 бита, а адресуемая ячейка памяти — 8 бит. Эти размеры не обязаны совпадать.<\/p>","refs":[{"kind":"method","section":"1.1–1.2","pages":"8–9"},{"kind":"method","section":"3.1","pages":"29–32"},{"kind":"project","path":"src/rpaoias/cpu/word.py"}],"quiz":{"q":"В R0 лежит 0x8000. Что покажет колонка signed?","options":["32768","−32768","−0"],"correct":1,"why":["Так эти биты читаются без знака.","Да. В дополнительном коде один старший бит имеет вес −32768.","В дополнительном коде нет отдельного отрицательного нуля."]},"part":"theory"},{"id":"complement","title":"Как записать −5, не рисуя минус","kicker":"Числа · 4","goal":"Получить дополнительный код и проверить, что он сохраняет арифметику.","body":"<p>В обычном тексте мы пишем −5. Но у регистра есть только фиксированное количество битов. Для 16-битного дополнительного кода отрицательное число x кодируется как <b>65536 + x<\/b>.<\/p>\n<p>Для −5 это 65531, то есть <b>FFFB<\/b>. Тот же результат можно получить двумя действиями: инвертировать 16 битов числа 5, затем прибавить 1.<\/p>\n<p>Одна инверсия даёт <b>обратный код<\/b>, а не дополнительный. Прибавление единицы — существенная часть преобразования.<\/p>","widget":"complement","after":"<p>Проверка: <code>0005 + FFFB = 10000<\/code>. В 16-битном регистре остаётся <code>0000<\/code>, то есть 5 + (−5) = 0.<\/p>\n<p>Почему диапазон несимметричен? Одно из 65536 сочетаний занято нулём; отрицательных значений 32768, положительных — 32767. Число −32768 существует, а +32768 в signed 16 уже не помещается.<\/p><details><summary>Не путать с прямым кодом<\/summary><div><p>В прямом коде можно выделить бит знака и хранить модуль отдельно. Тогда появляются две записи нуля и нужны другие правила арифметики. Методичка сравнивает такие подходы. Наш проект использует именно дополнительный код.<\/p><\/div><\/details><aside class=\"warn\">В списке на стр. 29 у источника есть «1+0=0». Это отмеченная опечатка. В наших расчётах 1+0=1; исправление не выдаётся за буквальный текст пособия.<\/aside>","refs":[{"kind":"method","section":"3.1","pages":"29–31"},{"kind":"project","path":"src/rpaoias/cpu/word.py"}],"quiz":{"q":"Чтобы получить дополнительный код −5 из +5, нужно…","options":["Только перевернуть биты","Перевернуть ровно 16 битов и прибавить 1","Поставить старший бит в 1, остальные не менять"],"correct":1,"why":["Это обратный код. Для дополнительного нужна ещё единица.","Верно. Ограничение «16 битов» тоже важно.","Это был бы подход со знаком и модулем, а не дополнительный код."]},"part":"theory"},{"id":"memory","title":"Адрес — не то, что по нему лежит","kicker":"Память · 1","goal":"Перестать смешивать номер ячейки и её содержимое.","body":"<p>Представь ряд пронумерованных ячеек. Номер снаружи — <b>адрес<\/b>. Запись внутри — <b>содержимое<\/b>. Записать новое число в ячейку не означает перенумеровать её.<\/p>\n<p>В нашей памяти один адрес обозначает один байт. По адресу 1024 может лежать байт 7. Тогда <b>1024 — где искать<\/b>, а <b>7 — что нашли<\/b>.<\/p>\n<p>Нажми на разные адреса. Затем измени байт выбранной ячейки. Обрати внимание: её номер останется прежним.<\/p>","widget":"memory","after":"<p><b>ОЗУ<\/b> — оперативная память. Для нашей модели это область хранения команд и данных. «Произвольный доступ» означает, что можно запросить выбранный адрес, а не извлекать всё по очереди.<\/p>\n<p>Если в регистре хранится адрес, программа использует этот регистр как <b>указатель<\/b>. Регистр не меняет физическую природу: в нём по-прежнему биты. Меняется то, как команда использует значение.<\/p><aside class=\"note\">Аналогия с ячейками объясняет адресацию, но не скорость ОЗУ и не электрическую схему. Эти свойства не изображены в опыте.<\/aside>","refs":[{"kind":"method","section":"1.1","pages":"5–8"},{"kind":"project","path":"src/rpaoias/cpu/memory.py"}],"quiz":{"q":"В ячейке с адресом 12 лежит 99. После записи туда 7 её адрес…","options":["Станет 7","Останется 12","Станет 99"],"correct":1,"why":["7 — новое содержимое, не новый адрес.","Да. Запись меняет содержимое по прежнему адресу.","99 — прежнее содержимое."]},"part":"theory"},{"id":"endian","title":"Почему одно число занимает два адреса","kicker":"Память · 2","goal":"Разобрать размер ячейки, порядок байтов и выравнивание.","body":"<p>Наш регистр вмещает 16 бит, а одна ячейка ОЗУ — 8 бит. Поэтому при сохранении регистра нужны <b>два соседних байта<\/b>.<\/p>\n<p>Разделим <code>0x1234<\/code>: старший байт — 12, младший — 34. В проекте принят <b>little-endian<\/b>: младший байт идёт по меньшему адресу. Значит, в памяти видим <b>34 12<\/b>. Число при чтении остаётся 0x1234.<\/p>\n<p>Инструкция занимает четыре байта. Поэтому следующая инструкция обычно начинается через 4 адреса, а следующий элемент массива — через 2.<\/p>","widget":"endian","after":"<p><b>Выравнивание<\/b> — ограничение начального адреса. В нашей ISA слово читается с адреса, кратного 2; инструкция — с адреса, кратного 4. Это выбранные правила проекта, не обязательное свойство любого компьютера.<\/p>\n<p>В ОЗУ 4096 байт: адреса 0…4095. Для их нумерации хватает 12 бит, хотя наш PC выделен как 16-битный регистр. Размер адресного поля и реально установленная память различаются.<\/p><aside class=\"warn\">На стр. 8 методички встречается пример про 16 бит адреса и 16 кБ. Точный предел при байтовой адресации: 2¹⁶ = 65536 байт, то есть 64 КиБ. Самих 16 бит достаточно и для меньшей памяти, но её размер не обязан быть 16 кБ.<\/aside>","refs":[{"kind":"method","section":"1.1","pages":"7–8"},{"kind":"project","path":"docs/cpu.md"},{"kind":"project","path":"src/rpaoias/cpu/memory.py"}],"quiz":{"q":"Первый 16-битный элемент лежит с адреса 0x0402. Следующий начинается…","options":["0x0403","0x0404","0x0406"],"correct":1,"why":["Это второй байт того же элемента.","Да: 0x0402+2=0x0404.","Такой шаг пропустит один элемент."]},"part":"theory"},{"id":"registers","title":"Где считать, а где хранить","kicker":"Память · 3","goal":"Развести роли памяти, регистров, АЛУ и устройства управления.","body":"<p>Пусть два числа уже лежат в памяти. В нашей машине сложение не берёт их прямо оттуда. Сначала команда пересылки загружает значения в <b>регистры<\/b>.<\/p>\n<p><b>Регистры общего назначения, РОН<\/b>, хранят значения, с которыми работает программа. Их 16: R0…R15. <b>АЛУ<\/b>, арифметико-логическое устройство, получает операнды и возвращает результат операции.<\/p>\n<p>Кто решает, когда загрузить, сложить и записать? <b>Устройство управления<\/b>. В эмуляторе его поведение выражено алгоритмом исполнения команды.<\/p>","widget":"registers","after":"<p>Путь выглядит так: <b>ОЗУ → РОН → АЛУ → РОН → ОЗУ<\/b>. Но не каждая команда проходит весь путь. При сложении уже загруженных регистров обращаться к данным ОЗУ не требуется.<\/p>\n<p><b>Аккумулятор<\/b> — место накопления результата. В одноадресной машине он может быть специальным регистром. В наших программах эту роль выполняют выбранные РОН. R0 не «нулевой навсегда»: в него можно записывать.<\/p>","refs":[{"kind":"method","section":"1.2","pages":"8–9"},{"kind":"method","section":"2.2","pages":"16–18"},{"kind":"project","path":"docs/cpu.md"}],"quiz":{"q":"Меняет ли АЛУ само адрес следующей инструкции в нашей реализации?","options":["Да, оно управляет всем процессором","Нет, АЛУ считает; выбор следующего PC делает CPU","Да, но только после ADD"],"correct":1,"why":["Это разные обязанности.","Верно. Поэтому арифметику можно тестировать отдельно от CPU.","ADD возвращает результат и флаги. Движение PC организует CPU."]},"part":"theory"},{"id":"architectures","title":"Одна память или две","kicker":"Память · 4","goal":"Отличить архитектуру Фон Неймана от Гарвардской.","body":"<p>До сих пор мы помещали в память только числа. Но <b>команды тоже нужно где-то хранить<\/b>. Есть два рассматриваемых в методичке подхода.<\/p>\n<p>В архитектуре <b>Фон Неймана<\/b> команды и данные используют общую память. В <b>Гарвардской<\/b> — отдельные памяти команд и данных. Поэтому одинаковое числовое значение адреса может обозначать разные места в разных памятях.<\/p>\n<p>Вариант 2 требует Фон Неймана. В коде это один объект Memory с одним bytearray. Размещение кода около 0x0000, а данных около 0x0400 — соглашение наших программ, не две отдельные памяти.<\/p>","widget":"architecture","after":"<p>У отдельного байта нет врождённой метки «я команда». <b>Если CPU прочитает его как часть инструкции, он попытается декодировать команду.<\/b> Если MOV прочитает его как часть слова данных, получится число.<\/p>\n<p>Отсюда важное следствие нашей простой модели: запись в область будущих команд может изменить программу. В проекте это проверяется специальным тестом. Защиту кода мы не моделируем.<\/p>","refs":[{"kind":"method","section":"1.1","pages":"5–6"},{"kind":"project","path":"docs/cpu.md"},{"kind":"project","path":"tests/test_cpu.py"}],"quiz":{"q":"В одном bytearray код лежит с 0x0000, данные — с 0x0400. Это…","options":["Две памяти: Гарвардская архитектура","Одна память с двумя условными областями: Фон Нейман","Неопределимо даже для нашего проекта"],"correct":1,"why":["Разные диапазоны адресов не создают две памяти.","Да. Именно так устроен наш эмулятор.","Для этого проекта структура Memory известна."]},"part":"theory"},{"id":"pcir","title":"Как машина не теряет место в программе","kicker":"Команды · 1","goal":"Разделить адрес команды PC и машинное слово IR.","body":"<p>После первой команды нужно понять, какую выполнять дальше. Для этого хранится <b>PC — счётчик команд<\/b>. В нашей модели перед шагом он указывает на команду, которую сейчас нужно прочитать.<\/p>\n<p><b>IR — регистр команд<\/b>. В интерфейсе проекта он хранит последнюю <em>успешно выполненную<\/em> инструкцию. PC содержит адрес, IR — сам машинный код. Их значения нельзя сравнивать как одно и то же.<\/p>\n<p>Сделай один шаг в опыте. После обычной инструкции PC прибавит 4. IR покажет выполненную команду, а стрелка PC окажется у следующей.<\/p>","widget":"pcir","after":"<p>Обычный порядок можно изменить: инструкция перехода запишет в PC другой адрес. А <code>HALT<\/code> остановит исполнение. В нашей ISA даже HALT сначала продвигает PC на 4; это не означает, что следующая команда будет выполнена.<\/p>\n<p>В методичке отдельно оговорено, что «текущая» и «следующая» зависят от момента наблюдения. На странице всегда показано, смотрим мы состояние <b>до<\/b> или <b>после<\/b> шага.<\/p>","refs":[{"kind":"method","section":"1.2","pages":"9"},{"kind":"project","path":"docs/cpu.md"}],"quiz":{"q":"После успешного MOV по адресу 0x0000 в нашей модели…","options":["PC=0x0004, IR хранит выполненный MOV","IR=0x0004, PC хранит биты MOV","PC всегда остаётся нулём"],"correct":0,"why":["Да. Адрес следующей команды и биты прошлой — разные вещи.","Здесь роли PC и IR перепутаны.","Без изменения PC процессор повторял бы ту же команду."]},"part":"theory"},{"id":"semantics","title":"Запись команды и её смысл — разные вещи","kicker":"Команды · 2","goal":"Понять термины «инструкция», «операнд», «синтаксис» и «семантика».","body":"<p>Возьмём <code>ADD R1, R2<\/code>. <b>ADD<\/b> — мнемоника операции, то есть её удобное текстовое имя. <b>R1 и R2<\/b> — операнды: указания, с какими значениями работать.<\/p>\n<p><b>Синтаксис<\/b> описывает допустимую запись: где имя команды, сколько операндов, какие нужны скобки и запятые. <b>Семантика<\/b> описывает действие: что прочитать, что изменить, какие флаги обновить.<\/p>\n<p>В нашей двухадресной ISA смысл ADD таков: <b>новое R1 = старое R1 + старое R2<\/b> с ограничением результата до 16 бит. R2 сохраняется. Сам текст этого правила не заменяет описание переполнения и флагов — до них скоро дойдём.<\/p>","widget":"semantics","after":"<p><b>Инструкция<\/b> — команда процессора. <b>Opcode<\/b> — числовой код операции внутри машинной инструкции. Мнемоника ADD — не те буквы, которые CPU ищет в памяти: он распознаёт код операции.<\/p>\n<p><b>ISA<\/b> — архитектура системы команд: договор о командах, регистрах, форматах и видимых эффектах исполнения. Разные процессоры могут использовать похожие мнемоники, но разные кодировки и правила.<\/p>","refs":[{"kind":"method","section":"2.1–2.2","pages":"12–18"},{"kind":"method","section":"4.3","pages":"44–48"},{"kind":"project","path":"docs/isa.md"}],"quiz":{"q":"«После ADD результат записывается в первый операнд» — это…","options":["Правило синтаксиса","Правило семантики","Правило цвета подсветки"],"correct":1,"why":["Синтаксис отвечает за форму записи.","Да. Здесь определяется эффект исполнения.","Оформление не задаёт поведение процессора."]},"part":"theory"},{"id":"addressing","title":"Что означают квадратные скобки","kicker":"Команды · 3","goal":"Различить четыре способа получить операнд.","body":"<p>В машинной инструкции есть поле операнда. Но само число в этом поле ещё не говорит, <b>нужно использовать его или что-то по нему найти<\/b>. Это определяет режим адресации.<\/p>\n<p>В опыте всегда выполняем пересылку в R1. Исходное состояние не меняем: R2 содержит 1024; слово по адресу 12 равно 77; слово по адресу 1024 равно 7. Меняем только запись источника.<\/p>\n<p>Нажимай четыре варианта и отслеживай путь. Главное — не заучить названия, а увидеть, сколько обращений нужно, чтобы добраться до значения.<\/p>","widget":"addressing","after":"<p><b>Непосредственная:<\/b> 12 уже является значением. <b>Регистровая прямая:<\/b> R2 указывает регистр со значением. <b>Прямая:<\/b> [12] задаёт адрес слова в ОЗУ. <b>Косвенно-регистровая:<\/b> [R2] сначала берёт адрес из R2, затем читает слово ОЗУ.<\/p>\n<p>В <code>MOV R3, ARRAY<\/code> имя метки без скобок означает её адрес. В <code>MOV R3, [ARRAY]<\/code> скобки требуют прочитать содержимое по этому адресу. Поэтому первая команда загружает указатель, а вторая может загрузить длину массива.<\/p><aside class=\"warn\">В источнике на стр. 15 для MOV R2,12 указан результат 000C, а таблица на стр. 16 даёт 0007. В опыте использована явно заданная семантика нашей ISA; противоречие источника не перенесено.<\/aside>","refs":[{"kind":"method","section":"2.1","pages":"12–16"},{"kind":"project","path":"docs/isa.md"}],"quiz":{"q":"R2=1024, слово ОЗУ[1024]=7. MOV R1,R2 запишет…","options":["7","1024","Адрес самого регистра R2"],"correct":1,"why":["7 даст MOV R1,[R2].","Да: без скобок копируем значение регистра.","Номер регистра находится в инструкции, но пересылается его содержимое."]},"part":"theory"},{"id":"arity","title":"Двухадресная — не значит две памяти","kicker":"Команды · 4","goal":"Не путать адресность команды с режимом адресации и архитектурой памяти.","body":"<p>Мы уже знаем <em>как найти<\/em> операнд. Теперь другой вопрос: <b>сколько операндов нужно явно указать<\/b>?<\/p>\n<p>Для вычисления 5−3 можно назвать два источника и отдельное место результата. Это трёхадресная схема. Можно перезаписать один из источников результатом — так устроена наша двухадресная арифметика.<\/p>\n<p>В одноадресной схеме часть работы закреплена за аккумулятором. В безадресной арифметике источники берутся с вершины стека, поэтому их адреса в самой команде не перечисляются.<\/p>","widget":"arity","after":"<p>Это независимые признаки: <b>двухадресная<\/b> — про явные операнды; <b>косвенно-регистровая адресация<\/b> — про поиск значения; <b>Фон Нейман<\/b> — про организацию памяти.<\/p>\n<p>HALT не имеет текстовых операндов, но его наличие не делает нашу машину безадресной. Класс адресности характеризует схему арифметических команд. MUL у нас явно называет два операнда, хотя широкий результат изменяет пару регистров.<\/p><details><summary>Зачем в методичке четыре адреса<\/summary><div><p>В четырёхадресной схеме дополнительно указывается адрес следующей команды. В обычной последовательной схеме он получается через PC. Для проекта такой формат не нужен.<\/p><\/div><\/details>","refs":[{"kind":"method","section":"2.2","pages":"16–18"},{"kind":"project","path":"docs/cpu.md"}],"quiz":{"q":"Можно ли иметь двухадресную машину с единой памятью?","options":["Да: это как раз наш вариант","Нет, нужны ровно две памяти","Только при отсутствии регистров"],"correct":0,"why":["Да. Число явных операндов не равно числу устройств памяти.","Здесь смешаны два независимых свойства.","Регистры этому не мешают."]},"part":"theory"},{"id":"isa","title":"Почему не любая удобная команда разрешена","kicker":"Команды · 5","goal":"Увидеть ограничения ISA и отделить реализованные операции от материала курса.","body":"<p>Кажется удобным написать <code>ADD R0, [R3]<\/code>: взять число прямо из памяти и прибавить. Но методичка требует, чтобы с данными ОЗУ работали команды пересылки. В нашей арифметике допустимы регистры и непосредственные значения.<\/p>\n<p>Поэтому сначала <code>MOV R6, [R3]<\/code>, затем <code>ADD R0, R6<\/code>. Две инструкции, зато у каждой определённая роль.<\/p>\n<p>Выбери запись в опыте: увидишь, принимает ли её наш ассемблер и чем заменить запрещённую форму.<\/p>","widget":"legal","after":"<p>Реализованы пересылки MOV, арифметика ADD/ADC/SUB/MUL/CMP/SAR, переходы JMP/JZ/JNZ/JC/JNC/JO/JNO, NOP и HALT. Этого хватает программам варианта.<\/p>\n<p>AND/OR/XOR/NOT, обычные сдвиги, DIV, PUSH/POP и CALL/RET рассматриваем как теорию из пособия, но <b>в ISA проекта 0.1.0 их нет<\/b>. Их наличие в объяснении не означает, что такой текст соберётся в эмуляторе.<\/p><aside class=\"note\">Фиксированная длина — обязательное ограничение нашего задания. Это не универсальное определение всех RISC-процессоров. В официальной спецификации RISC-V, например, базовые 32-битные инструкции сочетаются с расширением сжатых 16-битных инструкций. См. внешний источник [R] в разделе источников.<\/aside>","refs":[{"kind":"method","section":"4.1","pages":"35–36"},{"kind":"project","path":"docs/isa.md"},{"kind":"external","key":"R"}],"quiz":{"q":"Как прибавить слово ОЗУ[R3] к R0 в нашем процессоре?","options":["ADD R0,[R3]","MOV R6,[R3], затем ADD R0,R6","Вызвать Python sum"],"correct":1,"why":["Эта форма запрещена нашей ISA.","Верно. Сначала пересылка, затем арифметика.","Это обошло бы исполнение программы процессором."]},"part":"theory"},{"id":"encoding","title":"Как команда превращается в 32 бита","kicker":"Команды · 6","goal":"Собрать машинное слово из полей и прочитать его обратно.","body":"<p>Чтобы CPU распознал команду, нужно заранее договориться, <b>какие биты что означают<\/b>. В нашей инструкции 32 бита. Они поделены на код операции, номер регистра, режим адресации, резерв и поле операнда.<\/p>\n<p>Для <code>MOV R2,12<\/code>: opcode=01, reg=2, mode=01₂, operand=000C. В результате получается <b>0x0124000C<\/b>. Это код именно нашей ISA, не универсальный код MOV.<\/p>\n<p>Измени регистр или источник. Следи, какие поля меняются, а какие остаются прежними.<\/p>","widget":"encoding","after":"<p><b>Кодирование<\/b> собирает поля в одно слово. <b>Декодирование<\/b> извлекает их обратно. Оба процесса должны использовать один договор о позициях битов.<\/p>\n<p>Поле reg в записи в ОЗУ означает регистр-источник. Поэтому <code>MOV [1024],R2<\/code> получает отдельный внутренний opcode STORE=02, хотя в тексте остаётся MOV. Это позволяет сохранить один формат без двух 16-битных полей адреса.<\/p><aside class=\"warn\">Поправка к прежнему объяснению в чате: ADD R1,2 кодируется как <b>0x10140002<\/b>. Ранее приведённое 0x10100002 имеет mode=00 и означает ADD R1,R2. Здесь значения вычисляются по настоящему codec.py.<\/aside>","refs":[{"kind":"method","section":"2.1","pages":"14–16"},{"kind":"method","section":"4.3","pages":"44–46"},{"kind":"project","path":"src/rpaoias/isa/codec.py"}],"quiz":{"q":"Почему 0x10100002 и 0x10140002 действуют по-разному?","options":["Во втором больше памяти","Различается mode: регистр R2 или число 2","Это случайный выбор декодера"],"correct":1,"why":["Размер обеих инструкций одинаков — четыре байта.","Да. Последнее поле одинаково, но интерпретируется иначе.","Декодер следует точному формату."]},"part":"theory"},{"id":"masks","title":"Как достать нужные биты","kicker":"Арифметика · 1","goal":"Разобрать AND, OR, XOR, NOT и маску на видимых разрядах.","body":"<p>Пусть инструкция уже прочитана как одно число. Как достать только младшие четыре бита? Применим <b>побитовое И<\/b> с маской 00001111.<\/p>\n<p>У AND результат равен 1 только там, где оба входных бита равны 1. Поэтому единицы маски сохраняют выбранные биты, а нули убирают остальные. Маска — не отдельный аппаратный объект, а обычный набор битов с нужным рисунком.<\/p>\n<p>Сначала попробуй AND с 00001111, затем переключи операцию. Каждый столбец считается независимо.<\/p>","widget":"logic","after":"<p><b>OR<\/b> ставит 1, если хотя бы один вход равен 1. <b>XOR<\/b> ставит 1 при разных входах. <b>NOT<\/b> инвертирует каждый бит. Побитовые операции обрабатывают все разряды числа, а не одно логическое условие целиком.<\/p>\n<p>Чтобы извлечь поле не с края, сначала сдвигают слово вправо, затем накладывают маску. Например: <code>(word &gt;&gt; 20) &amp; 0xF<\/code> получает четыре бита номера регистра.<\/p><aside class=\"note\">В Python-коде декодера побитовые операции есть. Это не значит, что в эмулируемой ISA реализованы отдельные машинные инструкции AND/OR/XOR/NOT. Два уровня нужно различать.<\/aside>","refs":[{"kind":"method","section":"2.2","pages":"18–19"},{"kind":"method","section":"4.3","pages":"45–46"},{"kind":"project","path":"src/rpaoias/isa/codec.py"}],"quiz":{"q":"Что делает x & 0x000F?","options":["Оставляет младшие четыре бита x","Заменяет x числом 15","Сохраняет только старший бит"],"correct":0,"why":["Да. В маске единицы стоят в позициях 0–3.","Результат зависит от исходных четырёх битов.","Для старшего бита 16-битного слова использовали бы маску 0x8000."]},"part":"theory"},{"id":"flags","title":"Почему у переполнения два флага","kicker":"Арифметика · 2","goal":"Разделить перенос CF и знаковое переполнение OF.","body":"<p>Сложим 65535 и 1. Математически получится 65536. В 16 местах для битов это число не помещается: младшие 16 бит равны нулю, а лишняя единица уходит за границу. <b>CF<\/b> запоминает этот перенос.<\/p>\n<p>Теперь 32767 + 1. Биты результата 8000 помещаются в 16 разрядов — CF=0. Но как signed это −32768, хотя складывались два положительных числа. <b>OF<\/b> отмечает, что математический знаковый результат вышел за диапазон.<\/p>\n<p>Переключай готовые случаи. Каждый флаг отвечает на свой вопрос, показанный прямо рядом с ним.<\/p>","widget":"alu","after":"<p><b>ZF<\/b> равен 1, если сохранённый результат операции нулевой. <b>SF<\/b> равен старшему биту результата. Для ADD/ADC <b>CF<\/b> означает беззнаковый перенос; для SUB/CMP в нашей ISA — заём. <b>OF<\/b> означает выход знакового математического результата за диапазон.<\/p>\n<p>Флаги не проверяют все регистры непрерывно. Они описывают последнюю операцию, которая их изменила. После сброса ZF=0 по правилам нашей модели, хотя регистры нулевые; MOV сохраняет прежние флаги.<\/p>","refs":[{"kind":"method","section":"2.3","pages":"20"},{"kind":"method","section":"3.1","pages":"31–32"},{"kind":"project","path":"src/rpaoias/cpu/alu.py"}],"quiz":{"q":"FFFF + 1 при signed-интерпретации — это −1 + 1. Какие CF и OF?","options":["CF=1, OF=0","CF=0, OF=1","Оба обязательно равны 1"],"correct":0,"why":["Верно: перенос есть, но signed-результат 0 представим.","Это случай 7FFF+1, а не FFFF+1.","Эти флаги отвечают на разные вопросы."]},"part":"theory"},{"id":"branch","title":"Как if превращается в переход","kicker":"Управление · 1","goal":"Понять CMP, условие по флагу и выбор нового PC.","body":"<p>На высоком уровне пишут «если счётчик не нулевой, повторить». На нашем ассемблере нужно сначала получить признак результата, затем проверить его.<\/p>\n<p><b>CMP<\/b> вычисляет вычитание и меняет флаги, но не записывает разность в операнд. <b>JZ<\/b> переходит при ZF=1, <b>JNZ<\/b> — при ZF=0. Сам переход флаги не меняет.<\/p>\n<p>В опыте меняй значения и выбирай условие. Стрелка покажет не «красиво ли написан if», а конкретный адрес, который получит PC.<\/p>","widget":"branch","after":"<p>У нас адрес перехода <b>абсолютный<\/b>: его прямо записывают в PC. Методичка допускает также <b>относительный<\/b> адрес — смещение относительно выбранной точки отсчёта. В проекте относительные переходы не реализованы.<\/p>\n<p>После CMP флаг CF в нашей ISA отвечает за <b>беззнаковое<\/b> сравнение: left &lt; right. Поэтому JC нельзя бездумно читать как «первое signed-число меньше». Например, FFFF как unsigned больше 1, хотя как signed это −1.<\/p><details><summary>А как сравнивать знаковые числа?<\/summary><div><p>Для вычитания в дополнительном коде отношение signed «меньше» связано с SF ≠ OF. Но наша ISA не имеет готовой команды JL. Программы варианта проверяют длины массивов как беззнаковые величины, поэтому используемых JC/JZ достаточно.<\/p><\/div><\/details>","refs":[{"kind":"method","section":"2.3","pages":"19–22"},{"kind":"project","path":"docs/isa.md"}],"quiz":{"q":"После CMP R5,0 получено ZF=1. Выполнится JNZ loop?","options":["Да","Нет","Только если CF=1"],"correct":1,"why":["JNZ проверяет противоположное условие.","Да, ответ «нет»: JNZ нужен ZF=0.","CF этой командой не проверяется."]},"part":"theory"},{"id":"loop","title":"Как пройти массив, не зная слова for","kicker":"Управление · 2","goal":"Связать указатель, счётчик и повторение через PC.","body":"<p>Массив — несколько элементов, расположенных подряд. Наш процессор не знает, где массив начинается и заканчивается: этот договор хранится в программе и данных.<\/p>\n<p>Первое слово — <b>количество следующих элементов<\/b>. Для маленького примера в памяти лежит: 3, затем числа 3, 4, −2. Заголовок 3 не входит в сумму.<\/p>\n<p>Нам нужны указатель на текущий элемент, счётчик оставшихся элементов и накопитель. За итерацию читаем элемент, прибавляем, сдвигаем указатель на 2 байта, уменьшаем счётчик и возвращаемся переходом.<\/p>","widget":"loop","after":"<p>Один и тот же фрагмент машинного кода исполняется несколько раз. Переход меняет PC, поэтому CPU снова читает инструкции тела цикла.<\/p>\n<p>После <code>SUB R5,1<\/code> получаем ZF, относящийся к счётчику. <code>JNZ loop<\/code> проверяет именно его, не флаг суммы. На реальной программе дополнительно проверяем пустой массив до первой итерации и ограничиваем длину.<\/p><aside class=\"note\">Стр. 35 методички говорит о «номере» в первом элементе, а стр. 37 — о размере. В проекте явно выбран второй вариант: заголовок хранит длину. Маленький массив из трёх элементов здесь служит обучению; сдаваемые примеры содержат 10.<\/aside>","refs":[{"kind":"method","section":"2.3","pages":"20–21"},{"kind":"method","section":"4.1","pages":"35–38"},{"kind":"project","path":"src/rpaoias/programs/sum.asm"}],"quiz":{"q":"Почему указатель прибавляет 2, а обычный PC — 4?","options":["Из-за разных размеров элемента и инструкции в байтовой памяти","Потому что массив всегда идёт вдвое медленнее","Это два случайных числа"],"correct":0,"why":["Да: элемент — 2 байта, инструкция — 4.","Здесь речь об адресах, не о скорости.","Они следуют из выбранных размеров."]},"part":"theory"},{"id":"shifts","title":"Сдвинуть, сохранить знак или повернуть","kicker":"Арифметика · 3","goal":"Не смешивать логический, арифметический и циклический сдвиг.","body":"<p>При сдвиге вправо каждый бит перемещается на соседнюю позицию. Справа один бит вытесняется. Возникает вопрос: <b>что вставить слева?<\/b><\/p>\n<p>Логический сдвиг вправо вставляет 0. Арифметический сдвиг вправо повторяет прежний знаковый бит. Циклический сдвиг возвращает вытесненный бит с другого края.<\/p>\n<p>В опыте восемь битов для наглядности. Возьми 11111001: как signed 8 это −7. Посмотри, почему арифметический сдвиг сохраняет отрицательный знак, а логический — нет.<\/p>","widget":"shifts","after":"<p>В проекте реализован только <b>SAR<\/b>, арифметический сдвиг вправо 16-битного слова. Сдвиг на 15 оставляет 0000 для неотрицательного числа или FFFF для отрицательного. Это понадобится для расширения числа.<\/p>\n<p>Не называй SAR безусловной заменой деления с любым округлением: например, −7 после сдвига вправо на один разряд даёт −4. Усечение деления к нулю дало бы −3.<\/p><aside class=\"warn\">Описания на стр. 19 смешивают обычные и циклические сдвиги. Наш опыт явно разделяет три заданных правила; точная семантика SAR проекта описана в isa.md. На стр. 34 сохранение знака SAR объяснено отдельно.<\/aside>","refs":[{"kind":"method","section":"2.2","pages":"19"},{"kind":"method","section":"3.2","pages":"34"},{"kind":"project","path":"docs/isa.md"}],"quiz":{"q":"Почему SAR отрицательного числа не вставляет нули слева?","options":["Он повторяет знаковый бит, чтобы сохранить знаковую интерпретацию","Потому что CF всегда равен 1","Потому что это вращение"],"correct":0,"why":["Верно.","CF — вытесненный бит, а не источник заполнения в нашей SAR.","У SAR вытесненный бит не возвращается с противоположной стороны."]},"part":"theory"},{"id":"extension","title":"Как сделать число шире, не изменить его","kicker":"Арифметика · 4","goal":"Понять знаковое расширение перед длинной арифметикой.","body":"<p>Мы хотим прибавить маленькое отрицательное число к большому накопителю. Просто приписать нули слева нельзя: изменится значение при новом размере.<\/p>\n<p>−7 в 16 битах — <b>FFF9<\/b>. Если сделать 32 бита как <b>0000:FFF9<\/b>, получится +65529. Чтобы сохранить −7, нужно <b>FFFF:FFF9<\/b>.<\/p>\n<p><b>Знаковое расширение<\/b> повторяет прежний знаковый бит во всех добавленных разрядах. Для неотрицательных чисел добавляет нули, для отрицательных — единицы.<\/p>","widget":"extension","after":"<p>В программе копируем исходное слово и выполняем SAR на 15. Получается готовое добавочное слово: 0000 либо FFFF. При расширении 32-битного произведения берём знак из его <b>старшей половины<\/b>.<\/p>\n<p>Смысл расширения — сохранить математическое значение при увеличении ширины. Сам исходный набор младших битов не меняется.<\/p>","refs":[{"kind":"method","section":"3.1–3.2","pages":"29–34"},{"kind":"project","path":"src/rpaoias/programs/dot_product.asm"},{"kind":"project","path":"docs/cpu.md"}],"quiz":{"q":"Как расширить FFF9 (signed 16 = −7) до 48 бит?","options":["0000:0000:FFF9","FFFF:FFFF:FFF9","FFF9:0000:0000"],"correct":1,"why":["Это положительное 65529 в 48 битах.","Да: добавили единицы знака, значение осталось −7.","Перестановка в старшие разряды умножает значение, а не расширяет его."]},"part":"theory"},{"id":"adc","title":"Куда девается перенос между регистрами","kicker":"Арифметика · 5","goal":"Вручную собрать длинное сложение из ADD и ADC.","body":"<p>Регистр не может стать шире по нашему желанию. Но число можно хранить частями: младшее слово в R0, следующее в R1, старшее в R2.<\/p>\n<p>При сложении в столбик мы переносим единицу в следующий разряд. Здесь «разряд» крупнее: целое 16-битное слово. <b>ADD<\/b> младших частей формирует CF, а <b>ADC<\/b> прибавляет входящий CF к сумме следующих частей.<\/p>\n<p>В опыте сначала нажми «младшее слово», затем «среднее», затем «старшее». Это три отдельные операции. Видимый перенос связывает их в одно длинное сложение.<\/p>","widget":"adc","after":"<p>После каждого ADC может появиться новый перенос. Поэтому в цепочке из трёх слов второй ADC использует CF от первого ADC, не от исходного ADD.<\/p>\n<p>Между этими операциями нельзя вставлять команду, меняющую CF. Например, прибавление шага указателя может уничтожить нужный перенос. MOV в нашей ISA флаги сохраняет; цепочка не обязана быть буквально без любой промежуточной инструкции.<\/p><aside class=\"note\">После последнего ADC флаг ZF говорит о его <b>16-битном<\/b> результате, а не обо всём длинном числе. Для проверки длинного числа на ноль нужно учитывать все его слова.<\/aside>","refs":[{"kind":"method","section":"3.2","pages":"33–34"},{"kind":"project","path":"src/rpaoias/programs/carry.asm"},{"kind":"project","path":"docs/isa.md"}],"quiz":{"q":"Что вычисляет ADC A,B?","options":["A + B","A + B + входящий CF","A + B + OF"],"correct":1,"why":["Так работает обычный ADD.","Верно. Затем ADC формирует новые флаги для своего результата.","OF не используется как перенос между словами."]},"part":"theory"},{"id":"multiply","title":"Почему для десяти произведений три регистра","kicker":"Арифметика · 6","goal":"Отделить ширину одного произведения от ширины накопленной суммы.","body":"<p>Один 16-битный регистр не вмещает любой результат умножения двух signed 16. Поэтому наш MUL возвращает <b>32 бита<\/b>: младшие в R6, старшие в R7.<\/p>\n<p>Но задача не заканчивается одним произведением. Нужно сложить десять. В предельном случае каждое равно (−32768)×(−32768)=1073741824, а сумма — <b>10737418240<\/b>.<\/p>\n<p>Даже беззнаковые 32 бита дают максимум 4294967295. Поэтому накопитель только из пары регистров потерял бы данные. Для полного signed-диапазона суммы достаточно 35 бит; целыми 16-битными словами выбираем 48.<\/p>","widget":"multiply","after":"<p>Перед накоплением расширяем произведение из R7:R6 до R8:R7:R6, затем выполняем ADD/ADC/ADC. Это <b>длинная арифметика<\/b>: число шире одной обычной операции.<\/p>\n<p>Первый операнд MUL в проекте должен быть чётным: R0, R2, …, R14. Следующий регистр неявно хранит старшую часть. Сначала читаются оба старых источника, поэтому MUL R6,R7 корректен, хотя R7 затем перезаписывается.<\/p><details><summary>Почему сумма массива тоже хранится в трёх словах?<\/summary><div><p>Для суммы максимум 15 signed 16 трёх слов не требуется: двух уже достаточно. В проекте используется общий 48-битный формат результата для обоих примеров. Это удобство реализации и визуализации, не математическая необходимость первой задачи.<\/p><\/div><\/details>","refs":[{"kind":"method","section":"3.2","pages":"32–34"},{"kind":"method","section":"4.1","pages":"37–38"},{"kind":"project","path":"docs/cpu.md"}],"quiz":{"q":"Что требует 48-битного формата в нашей свёртке?","options":["Размер одной инструкции","Накопление нескольких широких произведений","Количество колонок в окне"],"correct":1,"why":["32-битная инструкция не ограничивает ширину результата программы.","Да. Одно произведение помещается в 32 бита, сумма десяти — уже не всегда.","Интерфейс следует формату, а не определяет диапазон задачи."]},"part":"theory"},{"id":"other-numbers","title":"Деление и другие форматы чисел","kicker":"Теория вне текущей ISA · 1","goal":"Не смешивать частное, остаток, фиксированную и плавающую точку.","body":"<p>В методичке есть операции, которых не потребовали две наши программы. Их всё равно нужно различать. Например, целочисленное деление 203 на 4 даёт <b>частное 50 и остаток 3<\/b>: 203 = 50×4 + 3.<\/p>\n<p>У конкретной ISA отдельно определяется, где лежит делимое, куда записываются частное и остаток, что делать при нуле в делителе и как округлять отрицательные значения. В нашем проекте DIV не реализован — обещать его поведение нельзя.<\/p>\n<p>Один набор битов может означать не только целое. При <b>фиксированной точке<\/b> программа договаривается о постоянном масштабе. Например, целое 125 при масштабе 100 означает 1,25.<\/p>","widget":"numbers","after":"<p>При <b>плавающей точке<\/b> отдельно кодируются знак, значащая часть и порядок. Это другой формат, не «очень длинный int». В нашей ISA все вычисления целочисленные; блок плавающей точки отсутствует.<\/p>\n<p>Маленькая схема выше — учебное арифметическое пояснение, не реализация конкретного формата IEEE 754. Методичка упоминает форматы чисел, но не задаёт полную спецификацию арифметики с плавающей точкой.<\/p><aside class=\"warn\">На стр. 33 в примере деления AX на BL частное подписано как AX=50. Для приведённой восьмибитной операции в пояснении источника частное размещается в AL, остаток — в AH. Мы показываем отдельно частное и остаток и не используем этот листинг как код нашего процессора.<\/aside>","refs":[{"kind":"method","section":"2.2","pages":"17–18"},{"kind":"method","section":"3.2","pages":"32–34"}],"quiz":{"q":"Почему 203/4 в целочисленной операции может дать два результата?","options":["Потому что есть частное и остаток","Потому что 203 слишком большое для Python","Потому что деление всегда знаковое"],"correct":0,"why":["Да: 203 = 50×4 + 3.","Здесь причина не в возможностях Python.","Знаковость — другой вопрос."]},"part":"theory"},{"id":"stack","title":"Машина, которая берёт операнды сверху","kicker":"Теория вне текущей ISA · 2","goal":"Разобрать стек, LIFO и обратную польскую запись.","body":"<p>У стека есть выделенный край — <b>вершина<\/b>. Добавление кладёт значение на вершину. Извлечение берёт последнее добавленное. Этот порядок называется <b>LIFO: последним вошёл — первым вышел<\/b>.<\/p>\n<p>Чтобы вычислить 5−3 на стековой машине, кладём 5, затем 3, затем выполняем SUB. Первый снятый элемент — 3, второй — 5. Операция должна дать 5−3, не 3−5.<\/p>\n<p>Запись <b>5 3 SUB<\/b> называется обратной польской: операция идёт после своих операндов. Так работает идея безадресной арифметики, рассмотренная в разделе о Forth.<\/p>","widget":"stack","after":"<p><b>PUSH<\/b> добавляет, <b>POP<\/b> снимает. <b>DUP<\/b> дублирует вершину, <b>SWAP<\/b> меняет два верхних элемента местами, <b>DROP<\/b> удаляет вершину. При попытке взять два операнда из пустого стека возникает ошибка.<\/p>\n<p>Стек может быть организован в ОЗУ или в регистрах. <b>SP<\/b> хранит положение вершины либо связанное с ней состояние по выбранному соглашению. В пособии показаны разные варианты; направление роста не является свойством всех стеков.<\/p><aside class=\"warn\">Это отдельная учебная модель по разделам 1.2 и 2.4, не добавление команд в наш вариант 2. В источнике фраза LIFO на стр. 10 содержит опечатку «первым вошёл»; порядок опыта указан выше явно.<\/aside>","refs":[{"kind":"method","section":"1.2","pages":"10–11"},{"kind":"method","section":"2.4","pages":"23–28"}],"quiz":{"q":"После PUSH 5, PUSH 3, SUB по правилам этого опыта на вершине…","options":["−2","2","8"],"correct":1,"why":["Так получилось бы при перепутанном порядке вычитания.","Да: второй снятый операнд 5 минус первый снятый 3.","Это результат ADD, не SUB."]},"part":"theory"},{"id":"calls","title":"Почему возврат — не обычный прыжок","kicker":"Теория вне текущей ISA · 3","goal":"Увидеть адрес возврата и отличие CALL от JMP.","body":"<p>Один и тот же фрагмент программы может вызываться из разных мест. Если просто прыгнуть в него, при завершении нужно понять, <b>куда вернуться<\/b>.<\/p>\n<p>В модели подпрограмм из методички <b>CALL<\/b> сохраняет адрес продолжения в стек и переходит к подпрограмме. <b>RET<\/b> извлекает сохранённый адрес и записывает его в PC.<\/p>\n<p>В опыте сначала основная программа вызывает A, затем A вызывает B. Возвраты идут в обратном порядке: B → A → основная программа.<\/p>","widget":"calls","after":"<p>Данные, временно оставленные поверх адреса возврата, могут сломать RET. Поэтому важно соблюдать соглашения о стеке и о том, какие регистры подпрограмма сохраняет.<\/p>\n<p>Это пояснение выбранной в пособии модели. Другие ISA могут хранить адрес возврата иначе. Наш проект не реализует CALL/RET или обработку прерываний, потому что программы варианта обходятся циклами и переходами.<\/p>","refs":[{"kind":"method","section":"2.3","pages":"22"},{"kind":"project","path":"docs/isa.md"}],"quiz":{"q":"Что нужно дополнительно сделать при CALL по модели пособия?","options":["Сохранить адрес продолжения","Обнулить все регистры","Стереть вызывающую программу"],"correct":0,"why":["Да. Иначе RET не узнает, куда возвращаться.","Сохранение рабочих регистров — отдельное соглашение, не автоматическое обнуление.","Исходная программа остаётся в памяти."]},"part":"theory"},{"id":"assembler-theory","title":"Кто переводит текст в машинную программу","kicker":"Сборка · теория","goal":"Различить лексический, синтаксический и семантический анализ и разрешение меток.","body":"<p>CPU не читает слова «MOV» и «loop». Это делает <b>ассемблер<\/b>, программа-переводчик. Не путай её с языком ассемблера, на котором написан исходник.<\/p>\n<p><b>Лексический анализ<\/b> выделяет элементы: имя, число, запятую, скобки. <b>Синтаксический анализ<\/b> собирает из них структуру строки. <b>Семантическая проверка<\/b> определяет, существует ли команда и разрешены ли её операнды.<\/p>\n<p>После этого нужно подставить адреса меток и закодировать инструкции. Попробуй два прохода на программе с переходом вперёд: сначала узнаем адрес метки, затем впишем его в команду.<\/p>","widget":"assembler","after":"<p><code>.org<\/code> задаёт адрес размещения, <code>.word<\/code> кладёт слова данных, <code>.entry<\/code> задаёт точку старта. Это <b>директивы сборщика<\/b>, а не исполняемые инструкции. Метка тоже не занимает отдельные четыре байта.<\/p>\n<p>Пособие показывает таблицу неразрешённых ссылок для переходов вперёд. Мы выбрали другой явный механизм: два прохода. Сложное AST для нашего линейного ассемблера не требуется; достаточно структуры строки.<\/p><details><summary>Где здесь кросс-компиляция и грамматики?<\/summary><div><p>Инструмент, работающий на одном компьютере и создающий код для другой целевой архитектуры, является кросс-инструментом. В широком разборе компилятора лексер, парсер и семантический анализ образуют входную часть, генерация целевого кода — выходную. Методичка также перечисляет регулярные, контекстно-свободные, контекстно-зависимые и наиболее общие грамматики. Для нашего ассемблера не нужно реализовывать универсальный компилятор этих классов.<\/p><\/div><\/details>","refs":[{"kind":"method","section":"4.4","pages":"49–54"},{"kind":"project","path":"docs/assembler.md"}],"quiz":{"q":"Строка loop: сама по себе занимает…","options":["4 байта как инструкция","0 байт; она присваивает имя текущему адресу","2 байта как слово данных"],"correct":1,"why":["Метка не является инструкцией.","Верно. Адрес следующей реальной команды получает имя loop.","Слово создаёт директива .word, не метка."]},"part":"theory"},{"id":"boundaries","title":"Что мы намеренно не моделируем","kicker":"Границы модели","goal":"Связать шины, банки памяти и физическое исполнение с уровнем учебного эмулятора.","body":"<p>В настоящем устройстве адрес и данные нужно передать между компонентами. Методичка различает <b>шину адреса<\/b>, <b>шину данных<\/b> и <b>шину управления<\/b>. Первая сообщает куда обратиться, вторая переносит содержимое, третья задаёт чтение, запись и согласование действий.<\/p>\n<p>Наш эмулятор сразу выполняет проверенное чтение или запись. Он не считает электрические задержки и не изображает каждый аппаратный такт. <b>Один step — одна инструкция, не один такт.<\/b><\/p>\n<p>В дополнительном разделе 4.2 рассматривается выбор банка памяти. Посмотри на опыт: номер банка и смещение вместе образуют адрес. Это помогает понять базовую адресацию, но в нашу ISA такая команда не добавлена.<\/p>","widget":"bank","after":"<p>В описанном примере банка 256 байт, банков 16. Адрес учебного опыта вычисляется как <b>банк×256 + смещение<\/b>. Детали регистров конкретного PIC18 — отдельная спецификация, которую наша машина не воспроизводит.<\/p>\n<p>Кеш, конвейер, периферия и подробная работа с прерываниями не входят в базовую модель пособия. Наша страница обозначает их границу, а не обещает курс по их проектированию. Скорость «10 ком/с» в GUI относится к показу шагов.<\/p>","refs":[{"kind":"method","section":"Введение","pages":"4"},{"kind":"method","section":"1.1","pages":"6–8"},{"kind":"method","section":"4.2–4.3","pages":"39–44"},{"kind":"project","path":"docs/cpu.md"}],"quiz":{"q":"Если GUI показывает 10 команд в секунду, означает ли это CPU с частотой 10 Гц?","options":["Да","Нет, такты аппаратуры не моделируются","Да, если отключить комментарии"],"correct":1,"why":["Команда и такт — не одно и то же.","Верно. Это темп визуализации покомандной модели.","Комментарии не определяют частоту аппаратуры."]},"part":"theory"},{"id":"checkpoint","title":"Соберём картину перед чтением кода","kicker":"Теория → проект","goal":"Проверить связи между понятиями, а не память на сокращения.","body":"<p>Теперь известны все основные детали: числа представлены битами; память хранит байты; регистры держат текущие операнды; инструкция задаёт действие; адресация указывает, откуда взять значение; PC организует порядок исполнения.<\/p>\n<p>Сборщик переводит текст в машинные слова. CPU каждый раз читает слово из памяти, декодирует поля, вычисляет изменения и сохраняет результат шага. Длинные числа программа складывает несколькими обычными командами.<\/p>\n<p>Перед Python проверь несколько связей. Здесь нет таймера или штрафов. Каждый ответ объясняется; к любой теме можно вернуться.<\/p>","widget":"checkpoint","after":"<p><b>Что является решением проекта:<\/b> 16 РОН по 16 бит; 4096 байт единой ОЗУ; 32-битная инструкция; little-endian; точные opcode, правила флагов, MUL и SAR; 48-битный формат результата.<\/p>\n<p><b>Что задаёт методичка:<\/b> вариант архитектуры и адресности, задачи над массивами, фиксированная длина, пересылки для работы с ОЗУ, четыре адресации, длинная арифметика, ввод ассемблера и наблюдение состояния.<\/p><aside class=\"note\">Спорные места источника собраны в «Источники и оговорки». Собственные примеры и исправления явно отделены. Исходные листинги пособия не выдаются за исполняемые программы нашего проекта.<\/aside>","refs":[{"kind":"method","section":"4.1","pages":"35–38"},{"kind":"project","path":"docs/method-notes.md"},{"kind":"project","path":"docs/requirements.md"}],"quiz":null,"part":"theory"},{"id":"project-map","title":"Теперь открываем настоящий проект","kicker":"Код · 1","goal":"Увидеть границы модулей и найти место каждого понятия.","body":"<p>Теория закончилась не списком терминов, а схемой работы. Теперь каждой части схемы найдём соответствующий файл. Это <b>исходники из твоего rpaoias.zip, версия 0.1.0<\/b>, а не заново сочинённый пример.<\/p>\n<p>Сначала строится образ памяти в assembler. Затем CPU исполняет его по правилам ISA и вызывает АЛУ. CLI и GUI показывают результат, но не реализуют команды второй раз.<\/p>\n<p>Нажми на блок схемы. Он откроет настоящий файл с номерами строк. Для первого прохода можно читать только подсвеченный фрагмент; остальной код остаётся доступным.<\/p>","widget":"projectmap","after":"<p>Папка <code>programs/<\/code> содержит код для <em>эмулируемого<\/em> процессора. Остальные Python-файлы — реализация <em>эмулятора<\/em>. Эти программы исполняются на разных уровнях.<\/p>\n<p>Дальше идём от представления чисел и памяти к инструкции и шагу, затем разбираем сборщик, обе программы и окно. Эта последовательность соответствует зависимостям, а не алфавиту имён файлов.<\/p>","refs":[{"kind":"project","path":"docs/theory.md"},{"kind":"project","path":"src/rpaoias/cpu/processor.py"}],"quiz":{"q":"Где искать алгоритм обхода массива?","options":["cpu/alu.py","programs/sum.asm","ui/window.py"],"correct":1,"why":["АЛУ выполняет одну арифметическую операцию.","Да. Там указатель, счётчик, тело цикла и переход.","Окно не должно вычислять массив за процессор."]},"part":"code"},{"id":"code-word","title":"word.py и memory.py: ограничиваем Python","kicker":"Код · 2","goal":"Понять, зачем Python вручную ограничивает разрядность и проверяет адреса.","body":"<p>Python int может хранить числа шире 16 бит. Поэтому простого сложения недостаточно для эмуляции нашего регистра. Функция <code>u16<\/code> оставляет только младшие 16 бит через маску <code>0xFFFF<\/code>.<\/p>\n<p><code>signed<\/code> не меняет память. Она интерпретирует набор битов: при установленном старшем бите вычитает 2 в степени выбранной ширины.<\/p>\n<p>В Memory находится один bytearray. Перед чтением проверяются не только начало, но и весь диапазон обращения, а также выравнивание. Иначе, например, чтение двух байтов с адреса 4095 вышло бы за память.<\/p>","widget":"code","after":"<p>Отрицательные индексы Python обычно отсчитывают элементы с конца последовательности. Для адреса нашего CPU такое поведение было бы ошибкой, поэтому проверка запрещает отрицательный адрес.<\/p>\n<p><code>join_words<\/code> собирает длинное значение для отображения и тестов. CPU не использует его для накопления суммы: эта работа остаётся за инструкциями ADD/ADC.<\/p>","refs":[{"kind":"project","path":"src/rpaoias/cpu/word.py"},{"kind":"project","path":"src/rpaoias/cpu/memory.py"},{"kind":"external","key":"P"}],"quiz":{"q":"Почему u16(65536) возвращает 0?","options":["Это ошибка Python","Маска отбрасывает бит за 16-разрядной границей","Функция удаляет все положительные числа"],"correct":1,"why":["Python корректно посчитал 65536 до ограничения.","Верно. Перенос сохраняется отдельно, когда этого требует операция АЛУ.","Младшие 16 бит положительных чисел обычно сохраняются."]},"part":"code","files":[["src/rpaoias/cpu/word.py","u16"],["src/rpaoias/cpu/word.py","signed"],["src/rpaoias/cpu/word.py","join_words"],["src/rpaoias/cpu/memory.py","check"],["src/rpaoias/cpu/memory.py","read_word"]]},{"id":"code-isa","title":"instruction.py и codec.py: один договор","kicker":"Код · 3","goal":"Связать описание команды, проверки, машинное слово и обратное декодирование.","body":"<p><code>Mode<\/code> и <code>Opcode<\/code> задают допустимые значения полей. <code>Instruction<\/code> хранит уже разобранные поля: операцию, регистр, режим и операнд.<\/p>\n<p><code>validate()<\/code> проверяет сочетания. Например, R16 запрещён; MUL требует чётный первый регистр; арифметика не принимает память; адрес перехода должен указывать на выровненную инструкцию.<\/p>\n<p>После этого encode сдвигает поля на места и объединяет через OR. Decode делает обратное: сдвигает и маскирует, затем снова вызывает ту же проверку.<\/p>","widget":"code","after":"<p>Ограничение результата АЛУ маской допустимо: оно моделирует разрядность. <b>Обрезать неверный номер регистра маской нельзя<\/b>: R16 незаметно превратился бы в R0, а ошибочная программа начала бы менять другой регистр.<\/p>\n<p>Резервные биты 17–16 должны быть нулевыми. Их порча не игнорируется. Дизассемблирование через <code>assembly()<\/code> восстанавливает текст, но не исходное имя метки: в машинном коде остался только адрес.<\/p>","refs":[{"kind":"project","path":"src/rpaoias/isa/instruction.py"},{"kind":"project","path":"src/rpaoias/isa/codec.py"}],"quiz":{"q":"Почему validate вызывается и при сборке, и при декодировании?","options":["Чтобы поймать ошибки и в исходнике, и в реально прочитанных байтах","Чтобы инструкция исполнилась дважды","Потому что все проверки случайные"],"correct":0,"why":["Да. Код памяти мог измениться после сборки.","Проверка не исполняет команду.","У обеих проверок одна спецификация."]},"part":"code","files":[["src/rpaoias/isa/instruction.py","Mode"],["src/rpaoias/isa/instruction.py","Opcode"],["src/rpaoias/isa/instruction.py","validate"],["src/rpaoias/isa/codec.py","encode"],["src/rpaoias/isa/codec.py","decode"]]},{"id":"code-alu","title":"alu.py: считаем результат и четыре ответа","kicker":"Код · 4","goal":"Разобрать ADD, ADC, SUB, SAR и MUL без GUI и циклов массива.","body":"<p>АЛУ реализовано чистыми функциями: входные числа → результат и флаги. Функции не двигают PC и не знают, откуда пришли числа.<\/p>\n<p>В add сначала получают полную беззнаковую сумму, затем ограниченный результат. Отдельно считают математическую сумму при знаковой интерпретации. Первая нужна для CF, вторая — для OF.<\/p>\n<p>ADC использует ту же функцию add, но передаёт входящий CF. SUB и CMP тоже используют одну функцию sub; различие «сохранить разность или нет» позже определит CPU.<\/p>","widget":"code","after":"<p>SAR вызывает signed перед сдвигом, чтобы Python продолжил знак отрицательного значения. Затем результат снова ограничивается до 16 бит.<\/p>\n<p>MUL вычисляет одно 16×16 произведение и немедленно разбивает его на low/high. Использование Python для одной операции допустимо: оно реализует АЛУ. Недопустимо было бы вместо программы цикла спрятать здесь всю сумму массива.<\/p>","refs":[{"kind":"project","path":"src/rpaoias/cpu/alu.py"},{"kind":"project","path":"tests/test_alu.py"}],"quiz":{"q":"Почему одна alu.sub подходит SUB и CMP?","options":["Обеим нужны одинаковые разность и флаги; сохранение результата решает CPU","CMP всегда означает ADD","Потому что CMP вообще не работает"],"correct":0,"why":["Да. Повторять арифметическую формулу не требуется.","CMP основан на вычитании.","CMP меняет флаги, но сохраняет операнды."]},"part":"code","files":[["src/rpaoias/cpu/alu.py","Flags"],["src/rpaoias/cpu/alu.py","add"],["src/rpaoias/cpu/alu.py","sub"],["src/rpaoias/cpu/alu.py","sar"],["src/rpaoias/cpu/alu.py","multiply"]]},{"id":"code-step","title":"processor.py: одна команда под микроскопом","kicker":"Код · 5","goal":"Проследить реальный шаг CPU от байтов до изменения состояния.","body":"<p>Теперь центральный метод <code>CPU.step()<\/code>. Он читает четыре байта по PC, декодирует инструкцию, получает операнды, рассчитывает изменения и сохраняет их.<\/p>\n<p>В лаборатории ниже состояния получены <b>запуском настоящего Python-ядра из архива<\/b>. Браузер воспроизводит запись и объясняет фазы. Это не запуск Python внутри браузера и не модель электрических тактов.<\/p>\n<p>Выбери опыт «Перенос», затем проходи фазы: чтение → декодирование → вычисление → сохранение. На последней фазе увидишь изменения архитектурного состояния.<\/p>","widget":"replay","after":"<p>Во время вычисления новые регистры, флаги и записи памяти хранятся временно. Если проверка адреса или инструкции выдаёт CPUFault, сохранение не начинается. Это свойство нашего эмулятора: ошибочный шаг не оставляет половину изменений.<\/p>\n<p>В коде <code>word<\/code> — локальный буфер прочитанной команды. IR обновляется только при успешном сохранении. Поэтому анимация не подменяет реальную семантику IR ранним обновлением на фазе чтения.<\/p>","refs":[{"kind":"project","path":"src/rpaoias/cpu/processor.py"}],"quiz":{"q":"Что читает FETCH?","options":["Готовый объект из Program.listing","Байты ОЗУ по адресу PC","Текст редактора GUI"],"correct":1,"why":["Листинг нужен человеку, а не CPU.","Да. Поэтому изменение байтов программы влияет на последующее исполнение.","Текст должен сначала пройти сборку."]},"part":"code","trace":"carry"},{"id":"code-assembler","title":"От букв к Program.image","kicker":"Код · 6","goal":"Пройти настоящий лексер, парсер и два прохода сборки.","body":"<p>В lexer регулярное выражение распознаёт всю строку. Комментарии и пробелы не превращаются в команды. Координаты токенов сохраняются, чтобы ошибка указывала на конкретное место.<\/p>\n<p>Parser выделяет метку, операцию и группы токенов операндов. Это структура ParsedLine, а не ещё одна виртуальная машина. Конкретную допустимость MOV или MUL проверяют следующие функции.<\/p>\n<p>В assemble первый проход вычисляет адреса меток и размещение строк. Второй разрешает выражения, кодирует команды и заполняет единый образ памяти.<\/p>","widget":"code","after":"<p>Program содержит <b>image<\/b>, <b>entry<\/b>, <b>symbols<\/b>, <b>listing<\/b>. CPU получает только образ и точку входа. Таблица символов и листинг нужны для объяснения и интерфейса.<\/p>\n<p>Числовые выражения вроде RESULT+2 разбираются собственной маленькой грамматикой. Здесь нет eval: текст ассемблера не должен становиться произвольным Python-кодом.<\/p>","refs":[{"kind":"project","path":"src/rpaoias/assembler/lexer.py"},{"kind":"project","path":"src/rpaoias/assembler/parser.py"},{"kind":"project","path":"src/rpaoias/assembler/assembler.py"}],"quiz":{"q":"Какая структура действительно содержит исполняемые байты?","options":["Program.image","Program.symbols","Список комментариев"],"correct":0,"why":["Да. CPU создаёт память из этого образа.","Здесь имена и адреса, не байты исполнения.","Комментарии не исполняются."]},"part":"code","files":[["src/rpaoias/assembler/lexer.py","tokenize"],["src/rpaoias/assembler/parser.py","parse"],["src/rpaoias/assembler/assembler.py","_operand"],["src/rpaoias/assembler/assembler.py","_instruction"],["src/rpaoias/assembler/assembler.py","assemble"]]},{"id":"code-sum","title":"sum.asm: сначала одна итерация","kicker":"Код · 7","goal":"Связать теорию адресации, счётчика, знака и переноса в первой задаче.","body":"<p>В R2:R1:R0 накапливается сумма. R3 — указатель, R5 — оставшееся количество, R6 — текущий элемент, R7 — его знаковое расширение. R15 — статус программы, не аппаратный флаг.<\/p>\n<p>Сначала программа обнуляет накопитель, получает адрес ARRAY, читает длину и пропускает заголовок. Она принимает длины 0…15 для граничных проверок; сдаваемый пример содержит 10 элементов.<\/p>\n<p>Нажми «К первому loop», затем пройди одну итерацию. Сначала наблюдай только R3/R5/R6, затем повтори и добавь внимание к R0/R1/R2 и CF. Не нужно следить сразу за всеми 16 регистрами.<\/p>","widget":"replay","after":"<p>Команды ADD/ADC/ADC прибавляют знаково расширенный элемент. После них указатель увеличивается на 2, счётчик уменьшается на 1, JNZ решает, повторять ли тело.<\/p>\n<p>Три завершающие MOV сохраняют результат в RESULT, RESULT+2, RESULT+4. Встроенные данные дают <b>65459<\/b>. Это больше максимального signed 16, поэтому колонка signed только младшего слова не равна всему ответу.<\/p>","refs":[{"kind":"project","path":"src/rpaoias/programs/sum.asm"},{"kind":"project","path":"tests/test_programs.py"}],"quiz":{"q":"Почему младшее слово результата можно видеть как отрицательное, хотя общая сумма положительна?","options":["Каждое слово — только часть длинного числа; signed 16 не равен signed 48","Процессор всегда ошибается на положительных числах","Потому что RESULT хранит текст"],"correct":0,"why":["Верно. Нужно учитывать старшие части и выбранную общую ширину.","В этом примере ожидаемый результат проверен.","RESULT состоит из трёх слов данных."]},"part":"code","trace":"sum"},{"id":"code-dot","title":"dot_product.asm: читаем, умножаем, накапливаем","kicker":"Код · 8","goal":"Проследить полное исполнение второй программы варианта 2.","body":"<p>Теперь два указателя: R3 на A, R4 на B. Программа читает оба заголовка, проверяет равенство длин и верхнюю границу 10. При неправильном заголовке ставит R15=1 и останавливается.<\/p>\n<p>В основной итерации MOV загружает A[i] и B[i]. MUL R6,R7 заменяет R7:R6 полным произведением. Затем копия старшего слова проходит SAR на 15: R8 становится знаковым расширением.<\/p>\n<p>Нажми «К MUL», посмотри источники <b>до<\/b> выполнения, затем результат <b>после<\/b>. R7 изменится — прежний множитель уже прочитан и больше не нужен этой итерации.<\/p>","widget":"replay","after":"<p>ADD/ADC/ADC прибавляют произведение к трёхсловному накопителю. Только после сохранения цепочки переносов программа сдвигает оба указателя и уменьшает счётчик.<\/p>\n<p>Для встроенных данных итог — <b>2947418113<\/b>, статус R15=0. Эту сумму можно получить просмотром записи исполнения до HALT. Предельные данные проверяются отдельно в tests/test_programs.py.<\/p>","refs":[{"kind":"project","path":"src/rpaoias/programs/dot_product.asm"},{"kind":"project","path":"tests/test_programs.py"}],"quiz":{"q":"Зачем копировать R7 в R8 после MUL?","options":["Чтобы получить знак старшей половины произведения для расширения","Чтобы восстановить второй массив","Чтобы отменить умножение"],"correct":0,"why":["Да. SAR R8,15 создаёт третье слово 0000 или FFFF.","Массивы остаются в ОЗУ; указатели на них в R3/R4.","Произведение сохраняется в R7:R6."]},"part":"code","trace":"dot_product"},{"id":"code-ui","title":"Как кнопки окна связаны с ядром","kicker":"Код · 9","goal":"Понимать интерфейс как отладчик, а не как второй процессор.","body":"<p>Выпадающий список только выбирает имя примера. Кнопка <b>«Загрузить пример»<\/b> вызывает load_example: текст заменяется, затем <b>автоматически вызывается assemble_source<\/b>. Отдельно собирать после этой кнопки не обязательно. После ручной правки текста — обязательно.<\/p>\n<p>«Шаг» вызывает CPU.step один раз. «Пуск» запускает QTimer, который повторно вызывает тот же путь исполнения. «Пауза» останавливает таймер, но не сбрасывает CPU.<\/p>\n<p>Нажимай области модели окна ниже. Подсказка объяснит, что ты видишь и откуда это берётся в коде.<\/p>","widget":"ui","after":"<p>Reset создаёт CPU из последнего собранного образа. Восстанавливаются и регистры, и память. Поля результата — это наблюдение; они не подменяют команды вычисления.<\/p>\n<p>Если текст отличается от assembled_source, запуск блокируется. Это не даёт смотреть на новую программу, пока процессор исполняет старые байты.<\/p><aside class=\"warn\">Здесь исправлено прежнее объяснение в чате: загрузка примера в текущем window.py уже включает сборку. Читаем фактический код, а не прежний пересказ.<\/aside>","refs":[{"kind":"project","path":"src/rpaoias/ui/window.py"},{"kind":"external","key":"Q"}],"quiz":{"q":"После ручного изменения .asm перед запуском нужно…","options":["Только нажать Пауза","Нажать Собрать","Переименовать R0"],"correct":1,"why":["Пауза останавливает таймер, но не создаёт новый образ.","Да. Исходный текст сам по себе не заменяет байты памяти.","Имена регистров здесь не причина."]},"part":"code"},{"id":"code-tests","title":"Как отличить работающую модель от красивой картинки","kicker":"Код · 10","goal":"Разделить ошибки сборки, ошибки CPU и ошибки данных, а также понять границы тестов.","body":"<p>Правильный ответ на одном массиве ещё не доказывает корректность процессора. Нужно проверять отдельные правила: перенос, переполнение, адресацию, запрещённые инструкции и восстановление состояния после ошибки.<\/p>\n<p>В проекте отдельно тестируются АЛУ, ISA, ассемблер, CPU, программы, CLI и GUI. При подготовке страницы повторно прошли <b>397 тестов<\/b>; модуль GUI пропущен из-за отсутствия PySide6 в среде. Это не выдаётся за запуск окна на твоей Windows.<\/p>\n<p>В опыте показаны сообщения <b>настоящего ассемблера<\/b> для нескольких ошибочных строк. Выбирай ошибку и посмотри, на каком уровне она возникает.<\/p>","widget":"errors","after":"<p><b>AssemblyError:<\/b> не удалось собрать текст. <b>CPUFault:<\/b> CPU прочитал недопустимую инструкцию или обратился по неверному адресу. <b>R15=1:<\/b> сама корректно исполняемая программа обнаружила плохой заголовок массива.<\/p>\n<p>Тест самоменяющегося кода проверяет, что FETCH действительно читает ОЗУ. Тест атомарности шага проверяет отсутствие частичных изменений при CPUFault. Эти свойства сильнее, чем просто наличие нарисованных регистров.<\/p>","refs":[{"kind":"project","path":"src/rpaoias/errors.py"},{"kind":"project","path":"tests/test_cpu.py"},{"kind":"project","path":"tests/test_programs.py"}],"quiz":{"q":"R15=1 после HALT в программе свёртки обязательно означает поломку CPU?","options":["Да","Нет: это может быть предусмотренный ответ на неверные длины массивов","Да, потому что регистры должны быть нулевыми"],"correct":1,"why":["Корректная программа может сообщить об ошибочных входных данных.","Верно. Статус программы и исключение CPUFault — разные уровни.","Регистры имеют значения, которые им записала программа."]},"part":"code"},{"id":"own-experiment","title":"Теперь меняем одно условие и предсказываем","kicker":"Код · 11","goal":"Провести управляемый эксперимент, не пытаясь удерживать весь проект сразу.","body":"<p>Для первого своего изменения не нужно переписывать ISA. Возьми sum.asm и замени один элемент. До запуска запиши ожидаемую разницу результата, затем собери и проверь.<\/p>\n<p>Например, замена 7 на −7 должна уменьшить сумму на 14. Мы меняем только входные данные, поэтому формат инструкции, ассемблер и CPU должны остаться прежними.<\/p>\n<p>После этого проверь одно объяснение: почему у массива шаг указателя 2; почему JNZ относится к счётчику; почему перед ADC нельзя портить CF. Каждый ответ свяжи с конкретной строкой программы.<\/p>","widget":"practice","after":"<p>В «Моей схеме» можно нарисовать путь <b>адрес → память → регистр<\/b> или перенос <b>R0 → CF → R1<\/b>. Стрелка должна отвечать на вопрос «что именно передаётся?» — адрес, биты команды, значение или флаг.<\/p>\n<p>Кнопка «Исходники» открывает весь код архива. Кнопка «Словарь» возвращает определение без потери текущей темы. Отметки и текущий эпизод сохраняются локально в браузере, когда он разрешает localStorage; экспорт заметок служит переносимой копией.<\/p>","refs":[{"kind":"project","path":"src/rpaoias/programs/sum.asm"},{"kind":"project","path":"docs/theory.md"}],"quiz":{"q":"Вместо 7 записали −7. Что станет с суммой 65459?","options":["65452","65445","65466"],"correct":1,"why":["Вычитание только 7 не учитывает добавление нового −7.","Да: 65459−7−7=65445.","Это увеличение на 7, а не замена знака."]},"part":"code"}],"glossary":[["Бит","Один двоичный разряд: 0 либо 1.","bits"],["Байт","Восемь битов. В нашей ОЗУ один адрес обозначает один байт.","bits"],["Машинное слово","Группа битов выбранной ширины. Слово данных нашего проекта — 16 бит, инструкция — 32 бита.","signed"],["Разрядность","Количество битов, выделенных под величину или обычную операцию.","signed"],["HEX","Шестнадцатеричная запись. Одна цифра соответствует четырём битам.","bases"],["Дополнительный код","Знаковое целочисленное представление; старший бит имеет отрицательный вес.","signed"],["ОЗУ","Оперативная память. У нас единая байтовая область для команд и данных.","memory"],["Адрес","Номер адресуемой ячейки, а не её содержимое.","memory"],["Указатель","Значение, которое программа использует как адрес.","memory"],["Little-endian","Младший байт многобайтового значения хранится по меньшему адресу.","endian"],["Выравнивание","Требование к кратности начального адреса обращения. В проекте слово /2, инструкция /4.","endian"],["РОН","Регистр общего назначения. В проекте R0…R15 по 16 бит.","registers"],["АЛУ","Арифметико-логическое устройство: вычисляет результат операции и флаги.","registers"],["Аккумулятор","Место накопления результата. В программах проекта — R2:R1:R0.","registers"],["Фон Нейман","Общая память команд и данных в рассматриваемой модели.","architectures"],["Гарвардская архитектура","Отдельные памяти команд и данных.","architectures"],["PC","Счётчик команд. Перед шагом указывает на исполняемую инструкцию.","pcir"],["IR","Регистр команды. В нашем интерфейсе последняя успешно исполненная инструкция.","pcir"],["Мнемоника","Текстовое имя операции, например MOV.","semantics"],["Opcode","Числовой код операции внутри инструкции.","semantics"],["Операнд","Данные или указание, откуда взять данные для команды.","semantics"],["Синтаксис","Правила записи исходного текста.","semantics"],["Семантика","Точный смысл: что инструкция читает и изменяет.","semantics"],["ISA","Договор о системе команд и видимой программной модели процессора.","semantics"],["Адресация","Правило получения операнда: значение, регистр, память и т. д.","addressing"],["Адресность","Количество явно задаваемых операндов в рассматриваемой схеме арифметических команд.","arity"],["Непосредственная адресация","Число находится в самой инструкции.","addressing"],["Прямая адресация","Поле инструкции содержит адрес слова ОЗУ.","addressing"],["Косвенно-регистровая адресация","Поле содержит номер регистра, в регистре адрес, по адресу слово.","addressing"],["Маска","Набор битов для выбора или изменения определённых позиций.","masks"],["ZF","Флаг нулевого результата операции. Не проверяет постоянно все регистры.","flags"],["SF","Знаковый бит результата операции.","flags"],["CF","Перенос; в SUB/CMP нашей ISA — заём.","flags"],["OF","Выход знакового математического результата за диапазон.","flags"],["CMP","Вычитание ради флагов без записи разности в операнд.","branch"],["JNZ","В нашей ISA переход при ZF=0.","branch"],["ADC","Сложение двух операндов и входящего CF.","adc"],["SAR","Арифметический сдвиг вправо с повторением знакового бита.","shifts"],["Знаковое расширение","Увеличение ширины с повторением знакового бита; значение сохраняется.","extension"],["Длинная арифметика","Вычисления с числами шире одной обычной операции, например через несколько слов.","adc"],["Стек","Хранилище с порядком LIFO: последнее добавленное извлекается первым.","stack"],["SP","Указатель стека; точное соглашение о вершине зависит от модели.","stack"],["Ассемблер","Здесь программа-переводчик из языка ассемблера в машинный код.","assembler-theory"],["Директива","Указание сборщику, а не исполняемая машинная инструкция.","assembler-theory"],["Метка","Символическое имя адреса. Сама не занимает место как инструкция.","assembler-theory"],["Лексер","Выделяет токены из символов.","assembler-theory"],["Парсер","Собирает синтаксическую структуру из токенов.","assembler-theory"],["Токен","Распознанный элемент текста с типом, значением и координатами.","assembler-theory"],["Образ памяти","Набор байтов для загрузки в эмулируемую ОЗУ.","code-assembler"],["Листинг","Соответствие адресов, машинных слов и исходных команд для человека.","code-assembler"],["Fetch","Чтение инструкции из памяти.","code-step"],["Decode","Разбор машинного слова на поля и проверка допустимости.","code-step"],["Execute","Вычисление эффектов инструкции.","code-step"],["Commit","Сохранение рассчитанных изменений в нашей модели шага.","code-step"],["QTimer","Таймер Qt, который организует повторные шаги в GUI. Не частота эмулируемого CPU.","code-ui"],["CPUFault","Ошибка исполнения или недопустимого обращения CPU.","code-tests"],["R15","Обычный РОН; встроенные программы используют его как статус 0/1.","code-tests"]]}</script><script type="application/json" id="project-data">{"projectVersion":"0.1.0","zipSha256":"f21b1d50feea1403cc2b92cdb1c67dce0f1be6796fc0f8d3a731b91d0d4ef3a0","sources":{"docs/assembler.md":{"text":"# Ассемблер\n\nИсходник – UTF-8, без зависимости от регистра букв в именах и командах. Идентификаторы: латинские буквы, цифры и `_`, первый символ не цифра. Комментарии могут быть на русском.\n\n## Запись\n\n```asm\n.entry start\n.org 0\nstart:\n    MOV R1, ARRAY\n    MOV R2, [R1]\n    ADD R1, 2\n    JNZ start\n    HALT\n\n.org 0x0400\nARRAY:\n    .word 2, -1, 7\n```\n\nЭто пример синтаксиса, не алгоритм обработки массива: JNZ здесь увидит флаги ADD указателя. Рабочие алгоритмы находятся в `src/rpaoias/programs/`.\n\nМетка пишется как `name:`. Она может занимать отдельную строку либо предшествовать команде или `.word`. Метка не генерирует байты. Регистр нельзя использовать как имя метки. Дубликаты меток запрещены.\n\nКомментарии начинаются с `;` или `//` и продолжаются до конца строки. Операнды разделяются запятыми.\n\n| Запись | Значение |\n|---|---|\n| `12`, `-12`, `+12` | Десятичное число |\n| `0xFF00` | Шестнадцатеричное число |\n| `0b1010` | Двоичное число |\n| `ARRAY` | Адрес метки |\n| `RESULT+2` | Адрес со смещением в байтах |\n| `[ARRAY]` | Слово ОЗУ по адресу метки |\n| `[R3]` | Слово ОЗУ по адресу из регистра R3 |\n\nПоддерживаются выражения с `+` и `-`, например `RESULT+2` и `12-4`. Умножения, скобочных арифметических выражений, макросов и вызовов Python нет. `[R3+2]` тоже не поддерживается: для косвенно-регистровой адресации внутри скобок должен быть ровно регистр. Смещение можно предварительно прибавить к самому регистру.\n\nЛитералы и `.word` принимают -32768..65535. Отрицательная десятичная запись преобразуется в дополнительный код. Прямые адреса не могут быть отрицательными, должны быть четными и помещаться в ОЗУ. Адрес перехода кратен четырем.\n\n## Директивы\n\n`.org number` устанавливает текущий байтовый адрес размещения. Разрешено только числовое выражение без меток. Следующая инструкция должна оказаться на адресе, кратном 4; данные `.word` – на четном. Метка на одной строке с `.org` запрещена, чтобы ее адрес не зависел от неочевидного порядка действий. Размести ее следующей строкой.\n\n`.word value, ...` записывает одно или несколько 16-битных слов в little-endian. Каждое значение занимает 2 байта.\n\n`.entry expression` задает стартовый PC. Встречается не более одного раза. По умолчанию вход – адрес 0. На адресе входа должна быть собранная инструкция.\n\n## Почему два прохода\n\nНа первом проходе известен размер каждой строки: инструкция 4 байта, `.word` – по 2 байта на значение. Поэтому можно вычислить адрес каждой метки, не зная машинного кода инструкции.\n\nНа втором проходе разрешаются ссылки на метки и кодируются инструкции. Переход вперед уже имеет известный адрес. Ошибки обнаруживаются до выдачи `Program`, поэтому не существует наружного состояния «половина программы успешно собрана».\n\nМетодичка, стр. 54, показывает разрешение будущих ссылок через таблицу неразрешенных мест. Два прохода в нашем проекте – другой конкретный способ решить ту же задачу.\n\n## Листинг и ОЗУ\n\n`Program.image` – готовые 4096 байт памяти. `Program.entry` – стартовый адрес. `symbols` и `listing` нужны человеку, а не исполнителю.\n\nCPU получает image/entry и заново декодирует машинный код при каждом fetch. Он не берет готовую команду из `listing`. Поэтому запись в кодовую часть ОЗУ действительно влияет на дальнейшее исполнение.\n","html":["# Ассемблер","","Исходник – UTF-8, без зависимости от регистра букв в именах и командах. Идентификаторы: латинские буквы, цифры и `_`, первый символ не цифра. Комментарии могут быть на русском.","","## Запись","","```asm",".entry start",".org 0","start:","    MOV R1, ARRAY","    MOV R2, [R1]","    ADD R1, 2","    JNZ start","    HALT","",".org 0x0400","ARRAY:","    .word 2, -1, 7","```","","Это пример синтаксиса, не алгоритм обработки массива: JNZ здесь увидит флаги ADD указателя. Рабочие алгоритмы находятся в `src/rpaoias/programs/`.","","Метка пишется как `name:`. Она может занимать отдельную строку либо предшествовать команде или `.word`. Метка не генерирует байты. Регистр нельзя использовать как имя метки. Дубликаты меток запрещены.","","Комментарии начинаются с `;` или `//` и продолжаются до конца строки. Операнды разделяются запятыми.","","| Запись | Значение |","|---|---|","| `12`, `-12`, `+12` | Десятичное число |","| `0xFF00` | Шестнадцатеричное число |","| `0b1010` | Двоичное число |","| `ARRAY` | Адрес метки |","| `RESULT+2` | Адрес со смещением в байтах |","| `[ARRAY]` | Слово ОЗУ по адресу метки |","| `[R3]` | Слово ОЗУ по адресу из регистра R3 |","","Поддерживаются выражения с `+` и `-`, например `RESULT+2` и `12-4`. Умножения, скобочных арифметических выражений, макросов и вызовов Python нет. `[R3+2]` тоже не поддерживается: для косвенно-регистровой адресации внутри скобок должен быть ровно регистр. Смещение можно предварительно прибавить к самому регистру.","","Литералы и `.word` принимают -32768..65535. Отрицательная десятичная запись преобразуется в дополнительный код. Прямые адреса не могут быть отрица
