urrent<\/span><span class=\"p\">:<\/span> <span class=\"nb\">list<\/span><span class=\"p\">[<\/span><span class=\"n\">Token<\/span><span class=\"p\">]<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[]<\/span>","        <span class=\"n\">depth<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">0<\/span>","        <span class=\"k\">for<\/span> <span class=\"n\">token<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">tokens<\/span><span class=\"p\">:<\/span>","            <span class=\"k\">if<\/span> <span class=\"n\">token<\/span><span class=\"o\">.<\/span><span class=\"n\">text<\/span> <span class=\"o\">==<\/span> <span class=\"s2\">&quot;[&quot;<\/span><span class=\"p\">:<\/span>","                <span class=\"n\">depth<\/span> <span class=\"o\">+=<\/span> <span class=\"mi\">1<\/span>","                <span class=\"k\">if<\/span> <span class=\"n\">depth<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">1<\/span><span class=\"p\">:<\/span>","                    <span class=\"k\">raise<\/span> <span class=\"n\">AssemblyError<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;Вложенные скобки не поддерживаются&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">number<\/span><span class=\"p\">,<\/span> <span class=\"n\">token<\/span><span class=\"o\">.<\/span><span class=\"n\">column<\/span><span class=\"p\">)<\/span>","            <span class=\"k\">elif<\/span> <span class=\"n\">token<\/span><span class=\"o\">.<\/span><span class=\"n\">text<\/span> <span class=\"o\">==<\/span> <span class=\"s2\">&quot;]&quot;<\/span><span class=\"p\">:<\/span>","                <span class=\"n\">depth<\/span> <span class=\"o\">-=<\/span> <span class=\"mi\">1<\/span>","                <span class=\"k\">if<\/span> <span class=\"n\">depth<\/span> <span class=\"o\">&lt;<\/span> <span class=\"mi\">0<\/span><span class=\"p\">:<\/span>","                    <span class=\"k\">raise<\/span> <span class=\"n\">AssemblyError<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;Лишняя закрывающая скобка&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">number<\/span><span class=\"p\">,<\/span> <span class=\"n\">token<\/span><span class=\"o\">.<\/span><span class=\"n\">column<\/span><span class=\"p\">)<\/span>","            <span class=\"k\">if<\/span> <span class=\"n\">token<\/span><span class=\"o\">.<\/span><span class=\"n\">text<\/span> <span class=\"o\">==<\/span> <span class=\"s2\">&quot;,&quot;<\/span> <span class=\"ow\">and<\/span> <span class=\"n\">depth<\/span> <span class=\"o\">==<\/span> <span class=\"mi\">0<\/span><span class=\"p\">:<\/span>","                <span class=\"k\">if<\/span> <span class=\"ow\">not<\/span> <span class=\"n\">current<\/span><span class=\"p\">:<\/span>","                    <span class=\"k\">raise<\/span> <span class=\"n\">AssemblyError<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;Пустой операнд перед запятой&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">number<\/span><span class=\"p\">,<\/span> <span class=\"n\">token<\/span><span class=\"o\">.<\/span><span class=\"n\">column<\/span><span class=\"p\">)<\/span>","                <span class=\"n\">groups<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"nb\">tuple<\/span><span class=\"p\">(<\/span><span class=\"n\">current<\/span><span class=\"p\">))<\/span>","                <span class=\"n\">current<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[]<\/span>","            <span class=\"k\">else<\/span><span class=\"p\">:<\/span>","                <span class=\"n\">current<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">token<\/span><span class=\"p\">)<\/span>","        <span class=\"k\">if<\/span> <span class=\"n\">depth<\/span><span class=\"p\">:<\/span>","            <span class=\"k\">raise<\/span> <span class=\"n\">AssemblyError<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;Не закрыта квадратная скобка&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">number<\/span><span class=\"p\">,<\/span> <span class=\"n\">first<\/span><span class=\"o\">.<\/span><span class=\"n\">column<\/span><span class=\"p\">)<\/span>","        <span class=\"k\">if<\/span> <span class=\"n\">tokens<\/span> <span class=\"ow\">and<\/span> <span class=\"ow\">not<\/span> <span class=\"n\">current<\/span><span class=\"p\">:<\/span>","            <span class=\"k\">raise<\/span> <span class=\"n\">AssemblyError<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;После запятой отсутствует операнд&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">number<\/span><span class=\"p\">,<\/span> <span class=\"n\">tokens<\/span><span class=\"p\">[<\/span><span class=\"o\">-<\/span><span class=\"mi\">1<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">column<\/span><span class=\"p\">)<\/span>","        <span class=\"k\">if<\/span> <span class=\"n\">current<\/span><span class=\"p\">:<\/span>","            <span class=\"n\">groups<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"nb\">tuple<\/span><span class=\"p\">(<\/span><span class=\"n\">current<\/span><span class=\"p\">))<\/span>","        <span class=\"n\">result<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">ParsedLine<\/span><span class=\"p\">(<\/span><span class=\"n\">number<\/span><span class=\"p\">,<\/span> <span class=\"n\">original<\/span><span class=\"p\">,<\/span> <span class=\"n\">label<\/span><span class=\"p\">,<\/span> <span class=\"n\">first<\/span><span class=\"o\">.<\/span><span class=\"n\">text<\/span><span class=\"o\">.<\/span><span class=\"n\">upper<\/span><span class=\"p\">(),<\/span> <span class=\"nb\">tuple<\/span><span class=\"p\">(<\/span><span class=\"n\">groups<\/span><span class=\"p\">)))<\/span>","    <span class=\"k\">return<\/span> <span class=\"nb\">tuple<\/span><span class=\"p\">(<\/span><span class=\"n\">result<\/span><span class=\"p\">)<\/span>"],"symbols":{"ParsedLine":[15,20],"parse":[23,68]},"sha256":"f1cda1fe7ef9c242495566438572d211051da3832228d2bbd90ef599b8980324"},"src/rpaoias/cli.py":{"text":"\"\"\"CLI позволяет изучать и проверять CPU без установки графики.\n\nЛистинг – результат трансляции, трасса – результат реального исполнения.\nОни не одно и то же: цикл появляется в листинге один раз, а в трассе\nповторяется столько раз, сколько его выполнил процессор.\n\"\"\"\n\nimport argparse\nimport sys\nfrom pathlib import Path\n\nfrom rpaoias.assembler.assembler import Program, assemble\nfrom rpaoias.cpu.processor import CPU, StepResult\nfrom rpaoias.cpu.word import join_words, signed\nfrom rpaoias.errors import EmulatorError, ExecutionLimit\nfrom rpaoias.examples import EXAMPLES, read_source\n\n\ndef trace_line(step: StepResult) -> str:\n    changes = [f\"R{i}: {old:04X}->{new:04X}\"\n               for i, (old, new) in enumerate(zip(step.before.registers, step.after.registers, strict=True))\n               if old != new]\n    changes.extend(f\"[{addr:04X}]: {old:04X}->{new:04X}\"\n                   for addr, old, new in step.memory_writes)\n    flags = step.after.flags\n    return (f\"{step.address:04X}  {step.instruction.assembly():26} \"\n            f\"PC->{step.after.pc:04X}  \"\n            f\"Z{int(flags.zf)} S{int(flags.sf)} C{int(flags.cf)} O{int(flags.of)}  \"\n            + \"; \".join(changes))\n\n\ndef _result(cpu: CPU, program: Program, symbol: str | None, words: int) -> None:\n    if symbol is None:\n        symbol = \"RESULT\" if \"RESULT\" in program.symbols else None\n    if symbol is not None:\n        name = symbol.upper()\n        if name not in program.symbols:\n            raise ValueError(f\"В программе нет метки {symbol}\")\n        address = program.symbols[name]\n        parts = [cpu.memory.read_word(address + 2 * i) for i in range(words)]\n        print(f\"{name} ({words * 16} бит, signed): {join_words(parts)}\")\n        print(\"Слова low -> high:\", \" \".join(f\"{word:04X}\" for word in parts))\n\n\ndef main(argv: list[str] | None = None) -> int:\n    parser = argparse.ArgumentParser(description=\"Учебный CPU РПАО ИАС, вариант 2\")\n    commands = parser.add_subparsers(dest=\"command\", required=True)\n    commands.add_parser(\"gui\", help=\"Оконный отладчик; требуется extra gui\")\n    runner = commands.add_parser(\"run\", help=\"Исполнить встроенный пример или .asm-файл\")\n    runner.add_argument(\"source\", help=f\"Путь или пример: {', '.join(EXAMPLES)}\")\n    runner.add_argument(\"--trace\", action=\"store_true\", help=\"Показывать каждый исполненный шаг\")\n    runner.add_argument(\"--max-steps\", type=int, default=100_000)\n    runner.add_argument(\"--result\", help=\"Метка результата; по умолчанию RESULT, если она существует\")\n    runner.add_argument(\"--words\", type=int, default=3, help=\"Число 16-битных слов результата, low first\")\n    compiler = commands.add_parser(\"assemble\", help=\"Напечатать листинг и при необходимости сохранить ОЗУ\")\n    compiler.add_argument(\"source\")\n    compiler.add_argument(\"-o\", \"--output\", type=Path, help=\"Файл полного образа ОЗУ на 4096 байт\")\n    arguments = parser.parse_args(argv)\n    try:\n        if arguments.command == \"gui\":\n            try:\n                from rpaoias.ui.window import launch\n            except ModuleNotFoundError as exc:\n                if exc.name and exc.name.startswith(\"PySide6\"):\n                    print(\"Не установлен PySide6. Запуск: uv run --extra gui rpaoias gui\", file=sys.stderr)\n                    return 2\n                raise\n            return launch()\n        program = assemble(read_source(arguments.source))\n        if arguments.command == \"assemble\":\n            print(f\"Точка входа: 0x{program.entry:04X}\")\n            print(\"ADDR  WORD      SOURCE\")\n            for row in program.listing:\n                print(f\"{row.address:04X}  {row.word:08X}  {row.source.strip()}\")\n            if arguments.output:\n                arguments.output.write_bytes(program.image)\n                print(f\"Образ ОЗУ: {arguments.output} (точка входа не хранится в .bin)\")\n            return 0\n        if arguments.max_steps <= 0 or not 1 <= arguments.words <= 128:\n            raise ValueError(\"Нужен положительный лимит шагов и число слов от 1 до 128\")\n        cpu = CPU(program.image, program.entry)\n        if arguments.trace:\n            for _ in range(arguments.max_steps):\n                if cpu.halted:\n                    break\n                print(trace_line(cpu.step()))\n            if not cpu.halted:\n                raise ExecutionLimit(\"Лимит шагов исчерпан; HALT не достигнут\")\n        else:\n            cpu.run(arguments.max_steps)\n        print(f\"HALT; исполнено инструкций: {cpu.steps}; PC=0x{cpu.pc:04X}; IR=0x{cpu.ir:08X}\")\n        print(f\"ZF={int(cpu.flags.zf)} SF={int(cpu.flags.sf)} CF={int(cpu.flags.cf)} OF={int(cpu.flags.of)}\")\n        for index, value in enumerate(cpu.registers):\n            print(f\"R{index:<2} 0x{value:04X}  signed={signed(value):>7}  unsigned={value:>5}\")\n        _result(cpu, program, arguments.result, arguments.words)\n        # Соглашение R15=статус относится только к двум встроенным заданиям.\n        if arguments.source in (\"sum\", \"dot_product\") and cpu.registers[15]:\n            print(\"Программа обнаружила неверные заголовки массивов (R15 != 0)\", file=sys.stderr)\n            return 3\n        return 0\n    except (EmulatorError, ValueError, OSError) as exc:\n        print(f\"Ошибка: {exc}\", file=sys.stderr)\n        return 2\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n","html":["<span class=\"sd\">&quot;&quot;&quot;CLI позволяет изучать и проверять CPU без установки графики.<\/span>","","<span class=\"sd\">Листинг – результат трансляции, трасса – р l, overflow: bool) -> Flags:\n    \"\"\"ZF и SF относятся к сохраненным 16 битам, а не к Python int до маски.\"\"\"\n    return Flags(value == 0, bool(value & 0x8000), carry, overflow)\n\n\ndef add(left: int, right: int, carry_in: int = 0) -> ALUResult:\n    \"\"\"ADD при carry_in=0; ADC прибавляет входящий CF как третий бит-слагаемое.\"\"\"\n    if carry_in not in (0, 1):\n        raise ValueError(\"Входящий перенос может быть только 0 или 1\")\n    left, right = u16(left), u16(right)\n    full = left + right + carry_in\n    result = u16(full)\n    # Отдельно считаем знаковую сумму. Тот же битовый ответ может быть\n    # корректным беззнаковым числом и переполненным знаковым числом.\n    mathematical = signed(left) + signed(right) + carry_in\n    return ALUResult(\n        result,\n        _flags(result, carry=full > WORD_MASK,\n               overflow=not SIGNED_MIN <= mathematical <= SIGNED_MAX),\n    )\n\n\ndef sub(left: int, right: int) -> ALUResult:\n    \"\"\"SUB и CMP используют одно вычитание; CMP только не сохраняет result.\n\n    В нашей ISA CF=1 означает заем: unsigned left < unsigned right.\n    Это выбранное соглашение, а не универсальное правило всех процессоров.\n    \"\"\"\n    left, right = u16(left), u16(right)\n    result = u16(left - right)\n    mathematical = signed(left) - signed(right)\n    return ALUResult(\n        result,\n        _flags(result, carry=left < right,\n               overflow=not SIGNED_MIN <= mathematical <= SIGNED_MAX),\n    )\n\n\ndef sar(value: int, count: int, previous: Flags) -> ALUResult:\n    \"\"\"Арифметический сдвиг вправо размножает знаковый бит.\n\n    SAR x,15 превращает 16-битное x в 0x0000 или 0xFFFF. Это позволяет\n    программно подготовить старшее слово при знаковом расширении.\n    Для count=0 сохраняем все флаги; для 1..15 OF=0 по нашей спецификации.\n    \"\"\"\n    if not 0 <= count < 16:\n        raise ValueError(\"SAR допускает число сдвигов от 0 до 15\")\n    value = u16(value)\n    if count == 0:\n        return ALUResult(value, previous)\n    result = u16(signed(value) >> count)\n    last_shifted_bit = bool((value >> (count - 1)) & 1)\n    return ALUResult(result, _flags(result, carry=last_shifted_bit, overflow=False))\n\n\ndef multiply(left: int, right: int) -> tuple[int, int, Flags]:\n    \"\"\"Знаковое 16x16 -> два 16-битных слова: low, high, flags.\n\n    Одна машинная инструкция может иметь расширенный результат. Это\n    не делает всю машину 32-битной: каждое следующее ADD остается 16-битным.\n    CF=OF показывают, помещается ли произведение в ОДНО знаковое слово.\n    Полные 32 бита произведения сохраняются независимо от этих флагов.\n    \"\"\"\n    product = signed(left) * signed(right)\n    low, high = u16(product), u16(product >> 16)\n    does_not_fit_word = not SIGNED_MIN <= product <= SIGNED_MAX\n    flags = Flags(product == 0, product < 0, does_not_fit_word, does_not_fit_word)\n    return low, high, flags\n","html":["<span class=\"sd\">&quot;&quot;&quot;АЛУ: результат одной операции и флаги этой операции.<\/span>","","<span class=\"sd\">Методичка: 2.2, 2.3 и 3.1–3.2. Точная семантика флагов нашей ISA:<\/span>","<span class=\"sd\">ZF – результат нулевой; SF – старший бит; CF – беззнаковый перенос/заем;<\/span>","<span class=\"sd\">OF – выход математического знакового результата за диапазон 16 бит.<\/span>","","<span class=\"sd\">CF и OF нельзя подменять друг другом. Например, 32767 + 1 дает OF=1,<\/span>","<span class=\"sd\">CF=0, а 65535 + 1 дает CF=1, OF=0 при знаковой интерпретации -1 + 1.<\/span>","<span class=\"sd\">Функции чистые: они не меняют память или регистры и тестируются отдельно.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dataclasses<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">dataclass<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.word<\/span .<\/span>","<span class=\"sd\">    Полные 32 бита произведения сохраняются независимо от этих флагов.<\/span>","<span class=\"sd\">    &quot;&quot;&quot;<\/span>","    <span class=\"n\">product<\/span> <span class=\"o\">=<\/span> <span class=\"n\">signed<\/span><span class=\"p\">(<\/span><span class=\"n\">left<\/span><span class=\"p\">)<\/span> <span class=\"o\">*<\/span> <span class=\"n\">signed<\/span><span class=\"p\">(<\/span><span class=\"n\">right<\/span><span class=\"p\">)<\/span>","    <span class=\"n\">low<\/span><span class=\"p\">,<\/span> <span class=\"n\">high<\/span> <span class=\"o\">=<\/span> <span class=\"n\">u16<\/span><span class=\"p\">(<\/span><span class=\"n\">product<\/span><span class=\"p\">),<\/span> <span class=\"n\">u16<\/span><span class=\"p\">(<\/span><span class=\"n\">product<\/span> <span class=\"o\">&gt;&gt;<\/span> <span class=\"mi\">16<\/span><span class=\"p\">)<\/span>","    <span class=\"n\">does_not_fit_word<\/span> <span class=\"o\">=<\/span> <span class=\"ow\">not<\/span> <span class=\"n\">SIGNED_MIN<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"n\">product<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"n\">SIGNED_MAX<\/span>","    <span class=\"n\">flags<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Flags<\/span><span class=\"p\">(<\/span><span class=\"n\">product<\/span> <span class=\"o\">==<\/span> <span class=\"mi\">0<\/span><span class=\"p\">,<\/span> <span class=\"n\">product<\/span> <span class=\"o\">&lt;<\/span> <span class=\"mi\">0<\/span><span class=\"p\">,<\/span> <span class=\"n\">does_not_fit_word<\/span><span class=\"p\">,<\/span> <span class=\"n\">does_not_fit_word<\/span><span class=\"p\">)<\/span>","    <span class=\"k\">return<\/span> <span class=\"n\">low<\/span><span class=\"p\">,<\/span> <span class=\"n\">high<\/span><span class=\"p\">,<\/span> <span class=\"n\">flags<\/span>"],"symbols":{"Flags":[18,24],"ALUResult":[28,30],"_flags":[33,35],"add":[38,52],"sub":[55,68],"sar":[71,85],"multiply":[88,100]},"sha256":"c39256fb42514b2ffbaf86dc9ad689895f314e52af3cdbed66826b139f2ded5f"},"src/rpaoias/cpu/memory.py":{"text":"\"\"\"Единая байтовая память: программная модель архитектуры фон Неймана.\n\nМетодичка: 1.1, стр. 5–8; выбор архитектуры: табл. 4.1, стр. 38.\nКоманды и данные лежат в ОДНОМ bytearray. Никакого скрытого списка готовых\nPython-команд для исполнения нет: fetch каждый раз читает байты из ОЗУ.\n\nНаши решения: 4096 байт, little-endian, выравнивание слов на 2 байта,\nинструкций на 4. Поэтому переход к следующему элементу массива – +2,\nа не +1. Разрядность данных и размер адресуемой ячейки – разные понятия.\n\"\"\"\n\nfrom rpaoias.cpu.word import MEMORY_BYTES, u16\nfrom rpaoias.errors import CPUFault\n\n\nclass Memory:\n    def __init__(self, image: bytes | None = None) -> None:\n        if image is not None and len(image) != MEMORY_BYTES:\n            raise ValueError(f\"Образ памяти должен содержать {MEMORY_BYTES} байт\")\n        self._data = bytearray(image if image is not None else bytes(MEMORY_BYTES))\n\n    @staticmethod\n    def check(address: int, width: int, alignment: int) -> None:\n        \"\"\"Проверяем весь диапазон, не только первый байт обращения.\n\n        Отрицательные индексы Python означают доступ с конца массива.\n        В модели процессора это было бы скрытой ошибкой, поэтому запрещаем.\n        \"\"\"\n        if address < 0 or address + width > MEMORY_BYTES:\n            raise CPUFault(f\"Выход за ОЗУ: адрес {address}, размер доступа {width} байт\")\n        if address % alignment:\n            raise CPUFault(f\"Адрес 0x{address:04X} не выровнен на {alignment} байт\")\n\n    def read_word(self, address: int) -> int:\n        self.check(address, 2, 2)\n        # Младший байт расположен по меньшему адресу: little-endian.\n        return int.from_bytes(self._data[address:address + 2], \"little\")\n\n    def write_word(self, address: int, value: int) -> None:\n        self.check(address, 2, 2)\n        self._data[address:address + 2] = u16(value).to_bytes(2, \"little\")\n\n    def read_instruction(self, address: int) -> int:\n        self.check(address, 4, 4)\n        return int.from_bytes(self._data[address:address + 4], \"little\")\n\n    def image(self) -> bytes:\n        \"\"\"Неизменяемая копия для reset/тестов; не открываем bytearray интерфейсу.\"\"\"\n        return bytes(self._data)\n","html":["<span class=\"sd\">&quot;&quot;&quot;Единая байтовая память: программная модель архитектуры фон Неймана.<\/span>","","<span class=\"sd\">Методичка: 1.1, стр. 5–8; выбор архитектуры: табл. 4.1, стр. 38.<\/span>","<span class=\"sd\">Команды и данные лежат в ОДНОМ bytearray. Никакого скрытого списка готовых<\/span>","<span class=\"sd\">Python-команд для исполнения нет: fetch каждый раз читает байты из ОЗУ.<\/span>","","<span class=\"sd\">Наши решения: 4096 байт, little-endian, выравнивание слов на 2 байта,<\/span>","<span class=\"sd\">инструкций на 4. Поэтому переход к следующему элементу массива – +2,<\/span>","<span class=\"sd\">а не +1. Разрядность данных и размер адресуемой ячейки – разные понятия.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.word<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">MEMORY_BYTES<\/span><span class=\"p\">,<\/span> <span class=\"n\">u16<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.errors<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CPUFault<\/span>","","","<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">Memory<\/span><span class=\"p\">:<\/span>","    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"fm\">__init__<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">,<\/span> <span class=\"n\">image<\/span><span class=\"p\">:<\/span> <span class=\"n an class=\"mi\">4<\/span><span class=\"p\">],<\/span> <span class=\"s2\">&quot;little&quot;<\/span><span class=\"p\">)<\/span>","","    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">image<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">bytes<\/span><span class=\"p\">:<\/span>","<span class=\"w\">        <\/span><span class=\"sd\">&quot;&quot;&quot;Неизменяемая копия для reset/тестов; не открываем bytearray интерфейсу.&quot;&quot;&quot;<\/span>","        <span class=\"k\">return<\/span> <span class=\"nb\">bytes<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">_data<\/span><span class=\"p\">)<\/span>"],"symbols":{"Memory":[16,49],"__init__":[17,20],"check":[23,32],"read_word":[34,37],"write_word":[39,41],"read_instruction":[43,45],"image":[47,49]},"sha256":"4e29db79b84d0cd47aeb1ee959a24851b293f14e325b223d2edee7376871e1b9"},"src/rpaoias/cpu/processor.py":{"text":"\"\"\"Покомандная модель CPU: fetch -> decode -> execute -> commit.\n\nОснова: методичка, 4.1 и 4.3. Не моделируем такты, электрические шины,\nкеши или конвейер. Один step() – одна завершенная машинная инструкция.\nЧтение команды идет из той же памяти, в которую MOV записывает данные.\n\nПравило PC нашей модели: перед step он указывает на исполняемую команду,\nпосле успешного step – на следующую. IR хранит последнюю исполненную\nинструкцию, поэтому UI явно различает IR и команду по новому PC.\n\"\"\"\n\nfrom dataclasses import dataclass\n\nfrom rpaoias.cpu import alu\nfrom rpaoias.cpu.alu import Flags\nfrom rpaoias.cpu.memory import Memory\nfrom rpaoias.cpu.word import INSTRUCTION_BYTES, REGISTER_COUNT\nfrom rpaoias.errors import CPUFault, ExecutionLimit\nfrom rpaoias.isa.codec import decode\nfrom rpaoias.isa.instruction import JUMPS, Instruction, Mode, Opcode\n\n\n@dataclass(frozen=True, slots=True)\nclass Snapshot:\n    registers: tuple[int, ...]\n    pc: int\n    ir: int\n    flags: Flags\n    halted: bool\n    steps: int\n\n\n@dataclass(frozen=True, slots=True)\nclass StepResult:\n    \"\"\"Результат шага для UI/CLI: они не должны заново исполнять команду.\"\"\"\n\n    address: int\n    instruction: Instruction\n    before: Snapshot\n    after: Snapshot\n    # Тройки: адрес слова, прежнее значение, новое значение.\n    memory_writes: tuple[tuple[int, int, int], ...] = ()\n\n\nclass CPU:\n    def __init__(self, image: bytes | None = None, entry: int = 0) -> None:\n        Memory.check(entry, INSTRUCTION_BYTES, INSTRUCTION_BYTES)\n        self.memory = Memory(image)\n        self.registers = [0] * REGISTER_COUNT\n        self.pc = entry\n        self.ir = 0\n        self.flags = Flags()\n        self.halted = False\n        self.steps = 0\n\n    def snapshot(self) -> Snapshot:\n        \"\"\"Копия регистров не позволяет интерфейсу изменить CPU через снимок.\"\"\"\n        return Snapshot(tuple(self.registers), self.pc, self.ir,\n                        self.flags, self.halted, self.steps)\n\n    def _operand(self, instruction: Instruction) -> int:\n        \"\"\"Один и тот же operand может быть числом, номером регистра или адресом.\n\n        Непосредственно 12 -> число 12. R12 -> значение регистра R12.\n        [12] -> слово памяти по адресу 12. [R12] -> сначала адрес из R12,\n        затем слово памяти по этому адресу. Эти случаи нельзя смешивать.\n        \"\"\"\n        match instruction.mode:\n            case Mode.IMMEDIATE:\n                return instruction.operand\n            case Mode.REGISTER:\n                return self.registers[instruction.operand]\n            case Mode.DIRECT:\n                return self.memory.read_word(instruction.operand)\n            case Mode.INDIRECT:\n                return self.memory.read_word(self.registers[instruction.operand])\n        raise CPUFault(\"Неподдерживаемая адресация\")\n\n    def step(self) -> StepResult:\n        \"\"\"Выполнить одну команду. При CPUFault архитектурное состояние неизменно.\n\n        Сначала вычисляем изменения во временных переменных и проверяем\n        адреса. Только затем публикуем их. Это упрощает отладку: неверная\n        инструкция не успеет наполовину испортить регистры или память.\n        Это удобное свойство нашего эмулятора, не требование методички.\n        \"\"\"\n        if self.halted:\n            raise CPUFault(\"Процессор остановлен HALT; перед новым запуском нужен сброс\")\n        before = self.snapshot()\n        word = self.memory.read_instruction(self.pc)  # FETCH: настоящие байты ОЗУ.\n        instruction = decode(word)                  # DECODE: поля, режимы, ограничения.\n        op = instruction.opcode\n        registers = self.registers.copy()\n        flags = self.flags\n        halted = False\n        next_pc = self.pc + INSTRUCTION_BYTES\n        writes: list[tuple[int, int, int]] = []\n\n        # EXECUTE. Никаких специальных веток \"посчитать сумму массива\" здесь\n        # нет: цикл и длинная арифметика целиком находятся в .asm-программе.\n        if op == Opcode.HALT:\n            halted = True\n        elif op == Opcode.NOP:\n            pass\n        elif op in JUMPS:\n            take = {\n                Opcode.JMP: True,\n                Opcode.JZ: flags.zf,\n                Opcode.JNZ: not flags.zf,\n                Opcode.JC: flags.cf,\n                Opcode.JNC: not flags.cf,\n                Opcode.JO: flags.of,\n                Opcode.JNO: not flags.of,\n            }[op]\n            if take:\n                next_pc = instruction.operand\n        elif op == Opcode.STORE:\n            address = (instruction.operand if instruction.mode == Mode.DIRECT\n                       else self.registers[instruction.operand])\n            # Проверка и чтение прежнего значения выполняются до commit.\n            previous = self.memory.read_word(address)\n            writes.append((address, previous, self.registers[instruction.register]))\n        else:\n            left = self.registers[instruction.register]\n            right = self._operand(instruction)\n            if op == Opcode.MOV:\n                # MOV сохраняет флаги. Это позволяет переносить части числа\n                # между регистрами, не уничтожая CF между ADD и ADC.\n                registers[instruction.register] = right\n            elif op == Opcode.MUL:\n                low, high, flags = alu.multiply(left, right)\n                # Приемник MUL четный; старшая половина идет в следующий РОН.\n                # Оба исходных значения уже прочитаны, поэтому MUL R6,R7\n                # корректен, хотя R7 затем перезаписывается старшей половиной.\n                registers[instruction.register] = low\n                registers[instruction.register + 1] = high\n            else:\n                if op == Opcode.ADD:\n                    result = alu.add(left, right)\n                elif op == Opcode.ADC:\n                    result = alu.add(left, right, int(flags.cf))\n                elif op in (Opcode.SUB, Opcode.CMP):\n                    result = alu.sub(left, right)\n                elif op == Opcode.SAR:\n                    if not 0 <= right <= 15:\n                        raise CPUFault(\"SAR допускает число сдвигов от 0 до 15\")\n                    result = alu.sar(left, right, flags)\n                else:\n                    raise CPUFault(f\"Не реализован opcode {op.name}\")\n                flags = result.flags\n                if op != Opcode.CMP:\n                    registers[instruction.register] = result.value\n\n        # COMMIT: здесь все потенциально ошибочные обращения уже проверены.\n        for address, _previous, value in writes:\n            self.memory.write_word(address, value)\n        self.registers = registers\n        self.flags = flags\n        self.pc = next_pc\n        self.ir = word\n        self.halted = halted\n        self.steps += 1\n        return StepResult(before.pc, instruction, before, self.snapshot(), tuple(writes))\n\n    def run(self, max_steps: int = 100_000) -> Snapshot:\n        \"\"\"Пакетный запуск для CLI/тестов. UI вызывает step через QTimer.\n\n        Лимит относится к этому вызову run и спасает от бесконечного JMP.\n        Исчерпание лимита не ставит HALT: программу можно продолжить пошагово.\n        \"\"\"\n        if max_steps <= 0:\n            raise ValueError(\"Лимит должен быть положительным\")\n        for _ in range(max_steps):\n            if self.halted:\n                return self.snapshot()\n            self.step()\n        if not self.halted:\n            raise ExecutionLimit(f\"Выполнено {max_steps} команд без HALT; запуск приостановлен\")\n        return self.snapshot()\n","html":["<span class=\"sd\">&quot;&quot;&quot;Покомандная модель CPU: fetch -&gt; decode -&gt; execute -&gt; commit.<\/span>","","<span class=\"sd\">Основа: методичка, 4.1 и 4.3. Не моделируем такты, электрические шины,<\/span>","<span class=\"sd\">кеши или конвейер. Один step() – одна завершенная машинная инструкция.<\/span>","<span class=\"sd\">Чтение команды идет из той же памяти, в которую MOV записывает данные.<\/span>","","<span class=\"sd\">Правило PC нашей модели: перед step он указывает на исполняемую команду,<\/span>","<span class=\"sd\">после успешного step – на следующую. IR хранит последнюю исполненную<\/span>","<span class=\"sd\">инструкцию, поэтому UI явно различает IR и команду по новому PC.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dataclasses<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">dataclass<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">alu<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.alu<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Flags<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.memory<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Memory<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.word<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">INSTRUCTION_BYTES<\/span><span class=\"p\">,<\/span> <span class=\"n\">REGISTER_COUNT<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.errors<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CPUFault<\/span><span class=\"p\">,<\/span> <span class=\"n\">ExecutionLimit<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.isa.codec<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">decode<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.isa.instruction<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">JUMPS<\/span><span class=\"p\">,<\/span> <span class=\"n\">Instruction<\/span><span class=\"p\">,<\/span> <span class=\"n\">Mode<\/span><span class=\"p\">,<\/span> <span class=\"n\">Opcode<\/span>","","","<span class=\"nd\">@dataclass<\/span><span class=\"p\">(<\/span><span class=\"n\">frozen<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">,<\/span> <span class=\"n\">slots<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">)<\/span>","<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">Snapshot<\/span><span class=\"p\">:<\/span>","    <span class=\"n\">registers<\/span><span class=\"p\">:<\/span> <span class=\"nb\">tuple<\/span><span class=\"p\">[<\/span><span class=\"nb\">in 9,163],"run":[165,179]},"sha256":"c9fa30a5aa6477c1e6194ee9769202fb8b427cff24f31494fa19472c1972393a"},"src/rpaoias/cpu/word.py":{"text":"\"\"\"Разрядная сетка и дополнительный код.\n\nОснова задания: методичка, разделы 3.1–3.2, печатные стр. 29–34.\nКонкретная ширина 16 бит – проектное решение, а не требование варианта.\n\nPython int не ограничен 16 битами. Поэтому модель сама отбрасывает разряды,\nкоторые физически не поместились бы в регистр. При этом 0xFFFF хранится\nодинаково и для unsigned 65535, и для signed -1: различается интерпретация.\n\"\"\"\n\nWORD_BITS = 16\nWORD_BYTES = WORD_BITS // 8\nWORD_MASK = (1 << WORD_BITS) - 1\nSIGN_BIT = 1 << (WORD_BITS - 1)\nSIGNED_MIN = -SIGN_BIT\nSIGNED_MAX = SIGN_BIT - 1\nREGISTER_COUNT = 16\nMEMORY_BYTES = 4096\nINSTRUCTION_BYTES = 4\n\n\ndef u16(value: int) -> int:\n    \"\"\"Оставить младшие 16 бит: арифметика по модулю 2**16.\"\"\"\n    return value & WORD_MASK\n\n\ndef signed(value: int, bits: int = WORD_BITS) -> int:\n    \"\"\"Прочитать битовый вектор как целое в дополнительном коде.\n\n    Старший бит имеет вес -(2**(bits-1)), а не +(2**(bits-1)).\n    Вычитание 2**bits меняет интерпретацию, но не набор хранимых битов.\n    \"\"\"\n    if bits <= 0:\n        raise ValueError(\"Разрядность должна быть положительной\")\n    value &= (1 << bits) - 1\n    return value - (1 << bits) if value & (1 << (bits - 1)) else value\n\n\ndef join_words(words: tuple[int, ...] | list[int], *, signed_result: bool = True) -> int:\n    \"\"\"Собрать число для отображения; первым передается МЛАДШЕЕ слово.\n\n    CPU не использует эту функцию для накопления суммы. Сложение длинного\n    числа выполняет программа через ADD/ADC; склейка нужна только UI,\n    CLI и тестам, чтобы показать человеку итог в десятичном виде.\n    \"\"\"\n    if not words:\n        raise ValueError(\"Нужно хотя бы одно слово\")\n    value = sum(u16(word) << (WORD_BITS * index) for index, word in enumerate(words))\n    return signed(value, WORD_BITS * len(words)) if signed_result else value\n","html":["<span class=\"sd\">&quot;&quot;&quot;Разрядная сетка и дополнительный код.<\/span>","","<span class=\"sd\">Основа задания: методичка, разделы 3.1–3.2, печатные стр. 29–34.<\/span>","<span class=\"sd\">Конкретная ширина 16 бит – проектное решение, а не требование варианта.<\/span>","","<span class=\"sd\">Python int не ограничен 16 битами. Поэтому модель сама отбрасывает разряды,<\/span>","<span class=\"sd\">которые физически не поместились бы в регистр. При этом 0xFFFF хранится<\/span>","<span class=\"sd\">одинаково и для unsigned 65535, и для signed -1: различается интерпретация.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"n\">WORD_BITS<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">16<\/span>","<span class=\"n\">WORD_BYTES<\/span> <span class=\"o\">=<\/span> <span class=\"n\">WORD_BITS<\/span> <span class=\"o\">//<\/span> <span class=\"mi\">8<\/span>","<span class=\"n\">WORD_MASK<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span><span class=\"mi\">1<\/span> <span class=\"o\">&lt;&lt;<\/span> <span class=\"n\">WORD_BITS<\/span><span class=\"p\">)<\/span> <span class=\"o\">-<\/span> <span class=\"mi\">1<\/span>","<span class=\"n\">SIGN_BIT<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">1<\/span> <span class=\"o\">&lt;&lt;<\/span> <span class=\"p\">(<\/span><span class=\"n\">WORD_BITS<\/span> <span class=\"o\">-<\/span> <span class=\"mi\">1<\/span><span class=\"p\">)<\/span>","<span class=\"n\">SIGNED_MIN<\/span> <span class=\"o\">=<\/span> <span class=\"o\">-<\/span><span class=\"n\">SIGN_BIT<\/span>","<span class=\"n\">SIGNED_MAX<\/span> <span class=\"o\">=<\/span> <span class=\"n\">SIGN_BIT<\/span> <span class=\"o\">-<\/span> <span class=\"mi\">1<\/span>","<span class=\"n\">REGISTER_COUNT<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">16<\/span>","<span class=\"n\">MEMORY_BYTES<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">4096<\/span>","<span class=\"n\">INSTRUCTION_BYTES<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">4<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">u16<\/span><span class=\"p\">(<\/span><span class=\"n\">value<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">int<\/span><span class=\"p\">:<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Оставить младшие 16 бит: арифметика по модулю 2**16.&quot;&quot;&quot;<\/span>","    <span class=\"k\">return<\/span> <span class=\"n\">value<\/span> <span class=\"o\">&amp;<\/span> <span class=\"n\">WORD_MASK<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">signed<\/span><span class=\"p\">(<\/span><span class=\"n\">value<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span><span class=\"p\">,<\/span> <span class=\"n\">bits<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span> <span class=\"o\">=<\/span> <span class=\"n\">WORD_BITS<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">int<\/span><span class=\"p\">:<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Прочитать битовый вектор как целое в дополнительном коде.<\/span>","","<span class=\"sd\">    Старший бит имеет вес -(2**(bits-1)), а не +(2**(bits-1)).<\/span>","<span class=\"sd\">    Вычитание 2**bits меняет интерпретацию, но не набор хранимых битов.<\/span>","<span class=\"sd\">    &quot;&quot;&quot;<\/span>","    <span class=\"k\">if<\/span> <span class=\"n\">bits<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"mi\">0<\/span><span class=\"p\">:<\/span>","        <span class=\"k\">raise<\/span> <span class=\"ne\">ValueError<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;Разрядность должна быть положительной&quot;<\/span><span class=\"p\">)<\/span>","    <span class=\"n\">value<\/span> <span class=\"o\">&amp;=<\/span> <span class=\"p\">(<\/span><span class=\"mi\">1<\/span> <span class=\"o\">&lt;&lt;<\/span> <span class=\"n\">bits<\/span><span class=\"p\">)<\/span> <span class=\"o\">-<\/span> <span class=\"mi\">1<\/span>","    <span class=\"k\">return<\/span> <span class=\"n\">value<\/span> <span class=\"o\">-<\/span> <span class=\"p\">(<\/span><span class=\"mi\">1<\/span> <span class=\"o\">&lt;&lt;<\/span> <span class=\"n\">bits<\/span><span class=\"p\">)<\/span> <span class=\"k\">if<\/span> <span class=\"n\">value<\/span> <span class=\"o\">&amp;<\/span> <span class=\"p\">(<\/span><span class=\"mi\">1<\/span> <span class=\"o\">&lt;&lt;<\/span> <span class=\"p\">(<\/span><span class=\"n\">bits<\/span> <span class=\"o\">-<\/span> <span class=\"mi\">1<\/span><span class=\"p\">))<\/span> <span class=\"k\">else<\/span> <span class=\"n\">value<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">join_words<\/span><span class=\"p\">(<\/span><span class=\"n\">words<\/span><span class=\"p\">:<\/span> <span class=\"nb\">tuple<\/span><span class=\"p\">[<\/span><span class=\"nb\">int<\/span><span class=\"p\">,<\/span> <span class=\"o\">...<\/span><span class=\"p\">]<\/span> <span class=\"o\">|<\/span> <span class=\"nb\">list<\/span><span class=\"p\">[<\/span><span class=\"nb\">int<\/span><span class=\"p\">],<\/span> <span class=\"o\">*<\/span><span class=\"p\">,<\/span> <span class=\"n\">signed_result<\/span><span class=\"p\">:<\/span> <span class=\"nb\">bool<\/span> <span class=\"o\">=<\/span> <span class=\"kc\">True<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">int<\/span><span class=\"p\">:<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Собрать число для отображения; первым передается МЛАДШЕЕ слово.<\/span>","","<span class=\"sd\">    CPU не использует эту функцию для накопления суммы. Сложение длинного<\/span>","<span class=\"sd\">    числа выполняет программа через ADD/ADC; склейка нужна только UI,<\/span>","<span class=\"sd\">    CLI и тестам, чтобы показать человеку итог в десятичном виде.<\/span>","<span class=\"sd\">    &quot;&quot;&quot;<\/span>","    <span class=\"k\">if<\/span> <span class=\"ow\">not<\/span> <span class=\"n\">words<\/span><span class=\"p\">:<\/span>","        <span class=\"k\">raise<\/span> <span class=\"ne\">ValueError<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;Нужно хотя бы одно слово&quot;<\/span><span class=\"p\">)<\/span>","    <span class=\"n\">value<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">sum<\/span><span class=\"p\">(<\/span><span class=\"n\">u16<\/span><span class=\"p\">(<\/span><span class=\"n\">word<\/span><span class=\"p\">)<\/span> <span class=\"o\">&lt;&lt;<\/span> <span class=\"p\">(<\/span><span class=\"n\">WORD_BITS<\/span> <span class=\"o\">*<\/span> <span class=\"n\">index<\/span><span class=\"p\">)<\/span> <span class=\"k\">for<\/span> <span class=\"n\">index<\/span><span class=\"p\">,<\/span> <span class=\"n\">word<\/span> <span class=\"ow\">in<\/span> <span class=\"nb\">enumerate<\/span><span class=\"p\">(<\/span><span class=\"n\">words<\/span><span class=\"p\">))<\/span>","    <span class=\"k\">return<\/span> <span class=\"n\">signed<\/span><span class=\"p\">(<\/span><span class=\"n\">value<\/span><span class=\"p\">,<\/span> <span class=\"n\">WORD_BITS<\/span> <span class=\"o\">*<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">words<\/span><span class=\"p\">))<\/span> <span class=\"k\">if<\/span> <span class=\"n\">signed_result<\/span> <span class=\"k\">else<\/span> <span class=\"n\">value<\/span>"],"symbols":{"u16":[22,24],"signed":[27,36],"join_words":[39,49]},"sha256":"a79564a09ef4ffb45076855aa9fbe9278a3896505d606ee3eca062eeef95c7c8"},"src/rpaoias/errors.py":{"text":"\"\"\"Ошибки инструментов отделены от ошибок исполняемой программы.\n\nАссемблер отвергает некорректный исходный текст до загрузки в CPU.\nНо машинный код можно повредить уже в памяти, поэтому CPU тоже обязан\nпроверять инструкции. Доверять только парсеру было бы недостаточно.\n\"\"\"\n\n\nclass EmulatorError(Exception):\n    \"\"\"Ожидаемая ошибка пользователя, которую CLI и UI показывают без traceback.\"\"\"\n\n\nclass AssemblyError(EmulatorError):\n    \"\"\"Диагностика исходного текста с координатами, начиная с единицы.\"\"\"\n\n    def __init__(self, message: str, line: int = 1, column: int = 1) -> None:\n        self.line = line\n        self.column = column\n        self.message = message\n        super().__init__(f\"Строка {line}, столбец {column}: {message}\")\n\n\nclass CPUFault(EmulatorError):\n    \"\"\"Модельная авария: неверный opcode, адрес, выравнивание или операнд.\"\"\"\n\n\nclass ExecutionLimit(EmulatorError):\n    \"\"\"Ограничение отладчика, а не аппаратная команда и не флаг процессора.\"\"\"\n","html":["<span class=\"sd\">&quot;&quot;&quot;Ошибки инструментов отделены от ошибок исполняемой программы.<\/span>","","<span class=\"sd\">Ассемблер отвергает некорректный исходный текст до загрузки в CPU.<\/span>","<span class=\"sd\">Но машинный код можно повредить уже в памяти, поэтому CPU тоже обязан<\/span>","<span class=\"sd\">проверять инструкции. Доверять только парсеру было бы недостаточно.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","","<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">EmulatorError<\/span><span class=\"p\">(<\/span><span class=\"ne\">Exception<\/span><span class=\"p\">):<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Ожидаемая ошибка пользователя, которую CLI и UI показывают без traceback.&quot;&quot;&quot;<\/span>","","","<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">AssemblyError<\/span><span class=\"p\">(<\/span><span class=\"n\">EmulatorError<\/span><span class=\"p\">):<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Диагностика исходного текста с координатами, начиная с единицы.&quot;&quot;&quot;<\/span>","","    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"fm\">__init__<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">,<\/span> <span class=\"n\">message<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span><span class=\"p\">,<\/span> <span class=\"n\">line<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">1<\/span><span class=\"p\">,<\/span> <span class=\"n\">column<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">1<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"kc\">None<\/span><span class=\"p\">:<\/span>","        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">line<\/span> <span class=\"o\">=<\/span> <span class=\"n\">line<\/span>","        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">column<\/span> <span class=\"o\">=<\/span> <span class=\"n\">column<\/span>","        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">message<\/span> <span class=\"o\">=<\/span> <span class=\"n\">message<\/span>","        <span class=\"nb\">super<\/span><span class=\"p\">()<\/span><span class=\"o\">.<\/span><span class=\"fm\">__init__<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">&quot;Строка <\/span><span class=\"si\">{<\/span><span class=\"n\">line<\/span><span class=\"si\">}<\/span><span class=\"s2\">, столбец <\/span><span class=\"si\">{<\/span><span class=\"n\">column<\/span><span class=\"si\">}<\/span><span class=\"s2\">: <\/span><span class=\"si\">{<\/span><span class=\"n\">message<\/span><span class=\"si\">}<\/span><span class=\"s2\">&quot;<\/span><span class=\"p\">)<\/span>","","","<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">CPUFault<\/span><span class=\"p\">(<\/span><span class=\"n\">EmulatorError<\/span><span class=\"p\">):<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Модельная авария: неверный opcode, адрес, выравнивание или операнд.&quot;&quot;&quot;<\/span>","","","<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">ExecutionLimit<\/span><span class=\"p\">(<\/span><span class=\"n\">EmulatorError<\/span><span class=\"p\">):<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Ограничение отладчика, а не аппаратная команда и не флаг процессора.&quot;&quot;&quot;<\/span>"],"symbols":{"EmulatorError":[9,10],"AssemblyError":[13,20],"CPUFault":[23,24],"ExecutionLimit":[27,28],"__init__":[16,20]},"sha256":"0718d7a8e2bc028d0e3ce4d6844cd0f674a8fd0eecb8c12ffee5701855c5d57f"},"src/rpaoias/examples.py":{"text":"\"\"\"Один набор исходников .asm используется в UI, CLI и интеграционных тестах.\n\nПрограммы входят в пакет как ресурсы, поэтому работают после установки\nwheel и не зависят от текущего каталога. Второй копии исходников нет.\n\"\"\"\n\nfrom importlib.resources import files\nfrom pathlib import Path\n\nEXAMPLES = {\n    \"sum\": \"Сумма массива\",\n    \"dot_product\": \"Свертка двух массивов\",\n    \"carry\": \"Перенос ADD/ADC\",\n    \"overflow\": \"Различие CF и OF\",\n}\n\n\ndef example_source(name: str) -> str:\n    if name not in EXAMPLES:\n        raise ValueError(f\"Неизвестный пример: {name}\")\n    return files(\"rpaoias.programs\").joinpath(f\"{name}.asm\").read_text(encoding=\"utf-8\")\n\n\ndef read_source(name_or_path: str) -> str:\n    \"\"\"Имя встроенного примера либо путь к пользовательскому UTF-8 исходнику.\"\"\"\n    if name_or_path in EXAMPLES:\n        return example_source(name_or_path)\n    return Path(name_or_path).read_text(encoding=\"utf-8-sig\")\n","html":["<span class=\"sd\">&quot;&quot;&quot;Один набор исходников .asm используется в UI, CLI и интеграционных тестах.<\/span>","","<span class=\"sd\">Программы входят в пакет как ресурсы, поэтому работают после установки<\/span>","<span class=\"sd\">wheel и не зависят от текущего каталога. Второй копии исходников нет.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">importlib.resources<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">files<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">pathlib<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Path<\/span>","","<span class=\"n\">EXAMPLES<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span>","    <span class=\"s2\">&quot;sum&quot;<\/span><span class=\"p\">:<\/span> <span class=\"s2\">&quot;Сумма массива&quot;<\/span><span class=\"p\">,<\/span>","    <span class=\"s2\">&quot;dot_product&quot;<\/span><span class=\"p\">:<\/span> <span class=\"s2\">&quot;Свертка двух массивов&quot;<\/span><span class=\"p\">,<\/span>","    <span class=\"s2\">&quot;carry&quot;<\/span><span class=\"p\">:<\/span> <span class=\"s2\">&quot;Перенос ADD/ADC&quot;<\/span><span class=\"p\">,<\/span>","    <span class=\"s2\">&quot;overflow&quot;<\/span><span class=\"p\">:<\/span> <span class=\"s2\">&quot;Различие CF и OF&quot;<\/span><span class=\"p\">,<\/span>","<span class=\"p\">}<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">example_source<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">str<\/span><span class=\"p\">:<\/span>","    <span class=\"k\">if<\/span> <span class=\"n\">name<\/span> <span class=\"ow\">not<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">EXAMPLES<\/span><span class=\"p\">:<\/span>","        <span class=\"k\">raise<\/span> <span class=\"ne\">ValueError<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">&quot;Неизвестный пример: <\/span><span class=\"si\">{<\/span><span class=\"n\">name<\/span><span class=\"si\">}<\/span><span class=\"s2\">&quot;<\/span><span class=\"p\">)<\/span>","    <span class=\"k\">return<\/span> <span class=\"n\">files<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;rpaoias.programs&quot;<\/span><span class=\"p\">)<\/span><span class=\"o\">.<\/span><span class=\"n\">joinpath<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">&quot;<\/span><span class=\"si\">{<\/span><span class=\"n\">name<\/span><span class=\"si\">}<\/span><span class=\"s2\">.asm&quot;<\/span><span class=\"p\">)<\/span><span class=\"o\">.<\/span><span class=\"n\">read_text<\/span><span class=\"p\">(<\/span><span class=\"n\">encoding<\/span><span class=\"o\">=<\/span><span class=\"s2\">&quot;utf-8&quot;<\/span><span class=\"p\">)<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">read_source<\/span><span class=\"p\">(<\/span><span class=\"n\">name_or_path<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">str<\/span><span class=\"p\">:<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Имя встроенного примера либо путь к пользовательскому UTF-8 исходнику.&quot;&quot;&quot;<\/span>","    <span class=\"k\">if<\/span> <span class=\"n\">name_or_path<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">EXAMPLES<\/span><span class=\"p\">:<\/span>","        <span class=\"k\">return<\/span> <span class=\"n\">example_source<\/span><span class=\"p\">(<\/span><span class=\"n\">name_or_path<\/span><span class=\"p\">)<\/span>","    <span class=\"k\">return<\/span> <span class=\"n\">Path<\/span><span class=\"p\">(<\/span><span class=\"n\">name_or_path<\/span><span class=\"p\">)<\/span><span class=\"o\">.<\/span><span class=\"n\">read_text<\/span><span class=\"p\">(<\/span><span class=\"n\">encoding<\/span><span class=\"o\">=<\/span><span class=\"s2\">&quot;utf-8-sig&quot;<\/span><span class=\"p\">)<\/span>"],"symbols":{"example_source":[18,21],"read_source":[24,28]},"sha256":"96f31e32480bf314d3ff8832d3149b3c0fdf58ed7d2c0d86948ff5fe8dec37b3"},"src/rpaoias/isa/__init__.py":{"text":"\"\"\"Компонент учебного эмулятора; подробности находятся в соседних модулях.\"\"\"\n","html":["<span class=\"sd\">&quot;&quot;&quot;Компонент учебного эмулятора; подробности находятся в соседних модулях.&quot;&quot;&quot;<\/span>"],"symbols":{},"sha256":"31ec514d9a56a45b2f10e4106f07da09ac352eab883de883da9ef0bd8e98db84"},"src/rpaoias/isa/codec.py":{"text":"\"\"\"Машинная инструкция всегда занимает 32 бита / 4 байта.\n\n  31             24 23      20 19    18 17    16 15                 0\n +----------------+----------+--------+--------+--------------------+\n | opcode: 8      | reg: 4   | mode:2 | zero:2 | operand: 16        |\n +----------------+----------+--------+--------+--------------------+\n\nМетодичка, 4.3: выделение полей через сдвиг и маску. Здесь формат свой.\nПоля не обязаны быть одинакового смысла: у STORE reg – источник, у ADD –\nпервый операнд/приемник. Число operand трактуется согласно mode.\n\nЕдиный 32-битный формат помещается потому, что хотя бы один операнд MOV\nявляется регистром. MOV [address], [address] сознательно не поддерживается.\n\"\"\"\n\nfrom rpaoias.errors import CPUFault\nfrom rpaoias.isa.instruction import Instruction, Mode, Opcode\n\n\ndef encode(instruction: Instruction) -> int:\n    \"\"\"Сдвигаем поля на их места и объединяем непересекающиеся биты через OR.\"\"\"\n    instruction.validate()\n    return (int(instruction.opcode) << 24\n            | instruction.register << 20\n            | int(instruction.mode) << 18\n            | instruction.operand)\n\n\ndef decode(word: int) -> Instruction:\n    \"\"\"Обратная операция: сдвиг убирает младшие поля, маска отсекает старшие.\"\"\"\n    if not 0 <= word <= 0xFFFFFFFF:\n        raise CPUFault(\"Машинная инструкция должна содержать ровно до 32 значащих бит\")\n    # Резервные биты не игнорируем: случайная порча кода не должна\n    # незаметно трактоваться как корректная каноническая инструкция.\n    if word & 0x00030000:\n        raise CPUFault(\"Ненулевые резервные биты 17..16\")\n    try:\n        instruction = Instruction(\n            opcode=Opcode((word >> 24) & 0xFF),\n            register=(word >> 20) & 0xF,\n            mode=Mode((word >> 18) & 0x3),\n            operand=word & 0xFFFF,\n        )\n    except ValueError as exc:\n        raise CPUFault(f\"Неизвестный opcode: 0x{(word >> 24) & 0xFF:02X}\") from exc\n    instruction.validate()\n    return instruction\n","html":["<span class=\"sd\">&quot;&quot;&quot;Машинная инструкция всегда занимает 32 бита / 4 байта.<\/span>","","<span class=\"sd\">  31             24 23      20 19    18 17    16 15                 0<\/span>","<span class=\"sd\"> +----------------+----------+--------+--------+--------------------+<\/span>","<span class=\"sd\"> | opcode: 8      | reg: 4   | mode:2 | zero:2 | operand: 16        |<\/span>","<span class=\"sd\"> +----------------+----------+--------+--------+--------------------+<\/span>","","<span class=\"sd\">Методичка, 4.3: выделение полей через сдвиг и маску. Здесь формат свой.<\/span>","<span class=\"sd\">Поля не обязаны быть одинакового смысла: у STORE reg – источник, у ADD –<\/span>","<span class=\"sd\">первый операнд/приемник. Число operand трактуется согласно mode.<\/span>","","<span class=\"sd\">Единый 32-битный формат помещается потому, что хотя бы один операнд MOV<\/span>","<span class=\"sd\">является регистром. MOV [address], [address] сознательно не поддерживается.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.errors<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CPUFault<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.isa.instruction<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Instruction<\/span><span class=\"p\">,<\/span> <span class=\"n\">Mode<\/span><span class=\"p\">,<\/span> <span class=\"n\">Opcode<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">encode<\/span><span class=\"p\">(<\/span><span class=\"n\">instruction<\/span><span class=\"p\">:<\/span> <span class=\"n\">Instruction<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">int<\/span><span class=\"p\">:<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Сдвигаем поля на их места и объединяем непересекающиеся биты через OR.&quot;&quot;&quot;<\/span>","    <span class=\"n\">instruction<\/span><span class=\"o\">.<\/span><span class=\"n\">validate<\/span><span class=\"p\">()<\/span>","    <span class=\"k\">return<\/span> <span class=\"p\">(<\/span><span class=\"nb\">int<\/span><span class=\"p\">(<\/span><span class=\"n\">instruction<\/span><span class=\"o\">.<\/span><span class=\"n\">opcode<\/span><span class=\"p\">)<\/span> <span class=\"o\">&lt;&lt;<\/span> <span class=\"mi\">24<\/span>","            <span class=\"o\">|<\/span> <span class=\"n\">instruction<\/span><span class=\"o\">.<\/span><span class=\"n\">register<\/span> <span class=\"o\">&lt;&lt;<\/span> <span class=\"mi\">20<\/span>","            <span class=\"o\">|<\/span> <span class=\"nb\">int<\/span><span class=\"p\">(<\/span><span class=\"n\">instruction<\/span><span class=\"o\">.<\/span><span class=\"n\">mode<\/span><span class=\"p\">)<\/span> <span class=\"o\">&lt;&lt;<\/span> <span class=\"mi\">18<\/span>","            <span class=\"o\">|<\/span> <span class=\"n\">instruction<\/span><span class=\"o\">.<\/span><span class=\"n\">operand<\/span><span class=\"p\">)<\/span>","","","<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">decode<\/span><span class=\"p\">(<\/span><span class=\"n\">word<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"n\">Instruction<\/span><span class=\"p\">:<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Обратная операция: сдвиг убирает младшие поля, маска отсекает старшие.&quot;&quot;&quot;<\/span>","    <span class=\"k\">if<\/span> <span class=\"ow\">not<\/span> <span class=\"mi\">0<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"n\">word<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"mh\">0xFFFFFFFF<\/span><span class=\"p\">:<\/span>","        <span class=\"k\">raise<\/span> <span class=\"n\">CPUFault<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;Машинная инструкция должна содержать ровно до 32 значащих бит&quot;<\/span><span class=\"p\">)<\/span>","    <span class=\"c1\"># Резервные биты не игнорируем: случайная порча кода не должна<\/span>","    <span class=\"c1\"># незаметно трактоваться как корректная каноническая инструкция.<\/span>","    <span class=\"k\">if<\/span> <span class=\"n\">word<\/span> <span class=\"o\">&amp;<\/span> <span class=\"mh\">0x00030000<\/span><span class=\"p\">:<\/span>","        <span class=\"k\">raise<\/span> <span class=\"n\">CPUFault<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;Ненулевые резервные биты 17..16&quot;<\/span><span class=\"p\">)<\/span>","    <span class=\"k\">try<\/span><span class=\"p\">:<\/span>","        <span class=\"n\">instruction<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Instruction<\/span><span class=\"p\">(<\/span>","            <span class=\"n\">opcode<\/span><span class=\"o\">=<\/span><span class=\"n\">Opcode<\/span><span class=\"p\">((<\/span><span class=\"n\">word<\/span> <span class=\"o\">&gt;&gt;<\/span> <span class=\"mi\">24<\/span><span class=\"p\">)<\/span> <span class=\"o\">&amp;<\/span> <span class=\"mh\">0xFF<\/span><span class=\"p\">),<\/span>","            <span class=\"n\">register<\/span><span class=\"o\">=<\/span><span class=\"p\">(<\/span><span class=\"n\">word<\/span> <span class=\"o\">&gt;&gt;<\/span> <span class=\"mi\">20<\/span><span class=\"p\">)<\/span> <span class=\"o\">&amp;<\/span> <span class=\"mh\">0xF<\/span><span class=\"p\">,<\/span>","            <span class=\"n\">mode<\/span><span class=\"o\">=<\/span><span class=\"n\">Mode<\/span><span class=\"p\">((<\/span><span class=\"n\">word<\/span> <span class=\"o\">&gt;&gt;<\/span> <span class=\"mi\">18<\/span><span class=\"p\">)<\/span> <span class=\"o\">&amp;<\/span> <span class=\"mh\">0x3<\/span><span class=\"p\">),<\/span>","            <span class=\"n\">operand<\/span><span class=\"o\">=<\/span><span class=\"n\">word<\/span> <span class=\"o\">&amp;<\/span> <span class=\"mh\">0xFFFF<\/span><span class=\"p\">,<\/span>","        <span class=\"p\">)<\/span>","    <span class=\"k\">except<\/span> <span class=\"ne\">ValueError<\/span> <span class=\"k\">as<\/span> <span class=\"n\">exc<\/span><span class=\"p\">:<\/span>","        <span class=\"k\">raise<\/span> <span class=\"n\">CPUFault<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">&quot;Неизвестный opcode: 0x<\/span><span class=\"si\">{<\/span><span class=\"p\">(<\/span><span class=\"n\">word<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;&gt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">24<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">&amp;<\/span><span class=\"w\"> <\/span><span class=\"mh\">0xFF<\/span><span class=\"si\">:<\/span><span class=\"s2\">02X<\/span><span class=\"si\">}<\/span><span class=\"s2\">&quot;<\/span><span class=\"p\">)<\/span> <span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">exc<\/span>","    <span class=\"n\">instruction<\/span><span class=\"o\">.<\/span><span class=\"n\">validate<\/span><span class=\"p\">()<\/span>","    <span class=\"k\">return<\/span> <span class=\"n\">instruction<\/span>"],"symbols":{"encode":[20,26],"decode":[29,47]},"sha256":"ea38c1f80ec6990ca1caeccd12fc1a5626d5d87e6973128c365fbd79efa3ed2e"},"src/rpaoias/isa/instruction.py":{"text":"\"\"\"Система команд: договор между ассемблером, декодером и CPU.\n\nМетодичка: разделы 2.1–2.3 и 4.1. Номера opcode, разрядности полей,\nправила MUL и ограничение сочетаний операндов выбраны в нашем проекте.\nЭто не кодировка NASM, x86 или RISC-V.\n\nДвухадресность означает, что арифметика явно называет два операнда;\nпервый также является приемником результата. Она не означает, что каждая\nинструкция обязана иметь два текстовых аргумента: HALT обходится без них.\n\"\"\"\n\nfrom dataclasses import dataclass\nfrom enum import IntEnum\n\nfrom rpaoias.cpu.word import MEMORY_BYTES, REGISTER_COUNT, WORD_MASK\nfrom rpaoias.errors import CPUFault\n\n\nclass Mode(IntEnum):\n    \"\"\"Два бита задают интерпретацию 16-битного поля operand.\"\"\"\n\n    REGISTER = 0       # operand – номер регистра, а не его значение.\n    IMMEDIATE = 1      # operand – само число.\n    DIRECT = 2         # operand – байтовый адрес слова в ОЗУ.\n    INDIRECT = 3       # operand – номер регистра, в котором находится адрес.\n\n\nclass Opcode(IntEnum):\n    NOP = 0x00\n    MOV = 0x01         # Чтение в регистр: из регистра, литерала или памяти.\n    STORE = 0x02       # Запись регистра в память; в ассемблере тоже MOV.\n    ADD = 0x10\n    ADC = 0x11\n    SUB = 0x12\n    MUL = 0x13\n    CMP = 0x14\n    SAR = 0x15\n    JMP = 0x20\n    JZ = 0x21\n    JNZ = 0x22\n    JC = 0x23\n    JNC = 0x24\n    JO = 0x25\n    JNO = 0x26\n    HALT = 0xFF\n\n\nARITHMETIC = frozenset({Opcode.ADD, Opcode.ADC, Opcode.SUB, Opcode.MUL,\n                        Opcode.CMP, Opcode.SAR})\nJUMPS = frozenset({Opcode.JMP, Opcode.JZ, Opcode.JNZ, Opcode.JC,\n                   Opcode.JNC, Opcode.JO, Opcode.JNO})\nNO_OPERANDS = frozenset({Opcode.NOP, Opcode.HALT})\n\n\n@dataclass(frozen=True, slots=True)\nclass Instruction:\n    \"\"\"Декодированные поля, а не отдельное хранилище исполняемой программы.\"\"\"\n\n    opcode: Opcode\n    register: int = 0\n    mode: Mode = Mode.REGISTER\n    operand: int = 0\n\n    def validate(self) -> None:\n        \"\"\"Одна проверка используется и перед кодированием, и после декодирования.\n\n        Недопустимые сочетания нельзя молча обрезать маской: так R16 мог бы\n        незаметно превратиться в R0. Маски допустимы для результата АЛУ,\n        но не вместо проверки формата машинной инструкции.\n        \"\"\"\n        if not isinstance(self.opcode, Opcode) or not isinstance(self.mode, Mode):\n            raise CPUFault(\"Неизвестный opcode или режим адресации\")\n        if not 0 <= self.register < REGISTER_COUNT or not 0 <= self.operand <= WORD_MASK:\n            raise CPUFault(\"Поле инструкции выходит за допустимый диапазон\")\n        if self.opcode in NO_OPERANDS:\n            if self.register or self.operand or self.mode != Mode.REGISTER:\n                raise CPUFault(\"У NOP/HALT все неиспользуемые поля должны быть нулевыми\")\n            return\n        if self.opcode in JUMPS:\n            if self.register != 0 or self.mode != Mode.IMMEDIATE:\n                raise CPUFault(\"Переход кодируется абсолютным адресом и register=0\")\n            if self.operand % 4 or not 0 <= self.operand <= MEMORY_BYTES - 4:\n                raise CPUFault(\"Адрес перехода должен указывать на выровненную инструкцию в ОЗУ\")\n            return\n        if self.mode in (Mode.REGISTER, Mode.INDIRECT) and self.operand >= REGISTER_COUNT:\n            raise CPUFault(\"В поле операнда должен быть номер R0..R15\")\n        if self.mode == Mode.DIRECT:\n            if self.operand % 2 or self.operand > MEMORY_BYTES - 2:\n                raise CPUFault(\"Прямой адрес должен указывать на выровненное слово в ОЗУ\")\n        if self.opcode == Opcode.STORE and self.mode not in (Mode.DIRECT, Mode.INDIRECT):\n            raise CPUFault(\"Запись в ОЗУ требует прямой или косвенно-регистровой адресации\")\n        if self.opcode in ARITHMETIC and self.mode not in (Mode.REGISTER, Mode.IMMEDIATE):\n            raise CPUFault(\"Арифметика работает с регистрами/литералами, но не напрямую с ОЗУ\")\n        if self.opcode == Opcode.MUL and self.register % 2:\n            raise CPUFault(\"MUL требует четный приемник: R0, R2, ..., R14\")\n        if self.opcode == Opcode.SAR and self.mode == Mode.IMMEDIATE and self.operand > 15:\n            raise CPUFault(\"SAR допускает число сдвигов от 0 до 15\")\n\n    def assembly(self) -> str:\n        \"\"\"Обратное текстовое представление. Имена меток в машинном коде утрачены.\"\"\"\n        if self.opcode in NO_OPERANDS:\n            return self.opcode.name\n        if self.opcode in JUMPS:\n            return f\"{self.opcode.name} 0x{self.operand:04X}\"\n        other = {\n            Mode.REGISTER: f\"R{self.operand}\",\n            Mode.IMMEDIATE: f\"0x{self.operand:04X}\",\n            Mode.DIRECT: f\"[0x{self.operand:04X}]\",\n            Mode.INDIRECT: f\"[R{self.operand}]\",\n        }[self.mode]\n        if self.opcode == Opcode.STORE:\n            return f\"MOV {other}, R{self.register}\"\n        return f\"{self.opcode.name} R{self.register}, {other}\"\n","html":["<span class=\"sd\">&quot;&quot;&quot;Система команд: договор между ассемблером, декодером и CPU.<\/span>","","<span class=\"sd\">Методичка: разделы 2.1–2.3 и 4.1. Номера opcode, разрядности полей,<\/span>","<span class=\"sd\">правила MUL и ограничение сочетаний операндов выбраны в нашем проекте.<\/span>","<span class=\"sd\">Это не кодировка NASM, x86 или RISC-V.<\/span>","","<span class=\"sd\">Двухадресность означает, что арифметика явно называет два операнда;<\/span>","<span class=\"sd\">первый также является приемником результата. Она не означает, что каждая<\/span>","<span class=\"sd\">инструкция обязана иметь два текстовых аргумента: HALT обходится без них.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dataclasses<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">dataclass<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">enum<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">IntEnum<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.word<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">MEMORY_BYTES<\/span><span class=\"p\">,<\/span> <span class=\"n\">REGISTER_COUNT<\/span><span class=\"p\">,<\/span> <span class=\"n\">WORD_MASK<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.errors<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CPUFault<\/span>","","","<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">Mode<\/span><span class=\"p\">(<\/span><span class=\"n\">IntEnum<\/span><span class=\"p\">):<\/span>","<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Два бита задают интерпретацию 16-битного поля operand.&quot;&quot;&quot;<\/span>","","    <span class=\"n\">REGISTER<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">0<\/span>       <span class=\"c1\"># operand – номер регистра, а не его значение.<\/span>","    <span class=\"n\">IMMEDIATE<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">1<\/span>      <span class=\"c1\"># operand – само число.<\/span>","    <span class=\"n\">DIRECT<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">2<\/span>         <span class=\"c1\"># operand – байтовый адрес слова в ОЗУ.<\/span>","    <span class=\"n\">INDIRECT<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">3<\/span>       <span class=\"c1\"># operand – номер регист
