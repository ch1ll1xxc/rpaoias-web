тельными, должны быть четными и помещаться в ОЗУ. Адрес перехода кратен четырем.","","## Директивы","","`.org number` устанавливает текущий байтовый адрес размещения. Разрешено только числовое выражение без меток. Следующая инструкция должна оказаться на адресе, кратном 4; данные `.word` – на четном. Метка на одной строке с `.org` запрещена, чтобы ее адрес не зависел от неочевидного порядка действий. Размести ее следующей строкой.","","`.word value, ...` записывает одно или несколько 16-битных слов в little-endian. Каждое значение занимает 2 байта.","","`.entry expression` задает стартовый PC. Встречается не более одного раза. По умолчанию вход – адрес 0. На адресе входа должна быть собранная инструкция.","","## Почему два прохода","","На первом проходе известен размер каждой строки: инструкция 4 байта, `.word` – по 2 байта на значение. Поэтому можно вычислить адрес каждой метки, не зная машинного кода инструкции.","","На втором проходе разрешаются ссылки на метки и кодируются инструкции. Переход вперед уже имеет известный адрес. Ошибки обнаруживаются до выдачи `Program`, поэтому не существует наружного состояния «половина программы успешно собрана».","","Методичка, стр. 54, показывает разрешение будущих ссылок через таблицу неразрешенных мест. Два прохода в нашем проекте – другой конкретный способ решить ту же задачу.","","## Листинг и ОЗУ","","`Program.image` – готовые 4096 байт памяти. `Program.entry` – стартовый адрес. `symbols` и `listing` нужны человеку, а не исполнителю.","","CPU получает image/entry и заново декодирует машинный код при каждом fetch. Он не берет готовую команду из `listing`. Поэтому запись в кодовую часть ОЗУ действительно влияет на дальнейшее исполнение."],"symbols":{},"sha256":"d63117e9ffb91f9e7025e907d7e74df0ab12cc3f6b548910cccfb122e5f502ff"},"docs/cpu.md":{"text":"# Программная модель CPU\n\nВерсия спецификации: 0.1.0. Собственная архитектура учебного процессора.\n\n## Что задано, а что выбрано\n\nВариант 2 в таблице 4.1, печатная стр. 38 методички: двухадресная система, архитектура фон Неймана, сумма массива, затем «свертка» двух массивов по 10 знаковых элементов. Раздел 4.1 требует фиксированную длину инструкций, доступ к данным ОЗУ через пересылки, четыре вида адресации, ассемблерный ввод и отображение состояния.\n\nРазрядности, количество регистров, little-endian, кодировки и все приведенные ниже точные правила – **решения нашего проекта**. Они не приписываются методичке.\n\n## Состояние\n\n| Компонент | Размер | Назначение |\n|---|---:|---|\n| R0..R15 | 16 × 16 бит | Регистры общего назначения. R0 не закреплен за нулем |\n| PC | 16 бит | Байтовый адрес следующей исполняемой инструкции |\n| IR | 32 бита | Последняя успешно исполненная машинная инструкция |\n| ZF, SF, CF, OF | 4 бита | Результат предыдущей операции, которая изменяет флаги |\n| ОЗУ | 4096 × 8 бит | Единая память кода и данных |\n| HALTED | Состояние управления | Запрещает исполнение после HALT до сброса |\n\n`steps`, исходные строки, таблица меток, трасса и лимит исполнения принадлежат эмулятору/отладчику. Это не доступные программе аппаратные регистры.\n\nПри сбросе РОН, IR и флаги обнуляются, `HALTED=False`, PC получает точку входа. ZF после сброса равен 0, хотя все РОН нулевые: флаг не является постоянной проверкой содержимого всех регистров. Он относится к результату операции.\n\n## ОЗУ\n\nОдин адрес обозначает один байт. Поэтому 16-битное слово занимает два адреса, а 32-битная инструкция – четыре. Слово `0x1234` хранится как байты `34 12` по возрастающим адресам. Слово читается только с четного адреса, инструкция – с адреса, кратного четырем.\n\n`Memory` содержит один `bytearray`. Процессор читает команды и данные из него. Доступ `MOV` к будущей инструкции может изменить ее; тест сам модифицирует NOP в HALT и проверяет, что fetch видит изменение. Это намеренная проверка единой памяти, не рекомендация писать самоменяющийся прикладной код.\n\nАссемблер запрещает случайное перекрытие областей при сборке. Аппаратной защиты кода в самой машине нет. Разделение `.org 0` для кода и `.org 0x400` для данных – соглашение программ, не два отдельных устройства памяти.\n\n## Двухадресные операции\n\n`ADD R1,R2` читает оба регистра и записывает сумму в R1. R2 сохраняется. Источником может быть литерал, но не слово ОЗУ: `ADD R1,[R2]` отвергается. Сначала нужно загрузить значение через `MOV`.\n\nОсобенность `MUL Rn,src`: n четный, результат занимает пару `R(n+1):Rn`. Первым явным операндом является младший регистр этой пары. Второй регистр результата определяется неявно. Например, `MUL R6,R7` читает прежние R6 и R7, затем заменяет оба на low/high результата. Адресность определяется явными операндами, а не количеством фактически измененных регистров.\n\nОтдельного физического аккумулятора нет. В демонстрационных программах роль длинного аккумулятора выполняет R2:R1:R0; счетчик цикла – R5. Это объясняет назначение этих регистров при демонстрации, но не ограничивает остальные программы.\n\n## Шаг\n\n1. Fetch читает четыре байта по PC из единой памяти.\n2. Decode выделяет поля и проверяет их допустимость.\n3. Execute читает операнды и рассчитывает изменения.\n4. Commit записывает результат и новое значение PC.\n\nПо умолчанию `PC_next = PC + 4`; выполненный переход заменяет его абсолютным адресом. HALT также увеличивает PC на 4, затем устанавливает HALTED. IR сохраняет именно HALT. Поэтому не следует интерпретировать память по новому PC как последнюю исполненную команду.\n\nПри ошибке инструкции, адреса или выравнивания step выбрасывает `CPUFault`, не изменяя регистры, флаги, PC, IR и ОЗУ. Это свойство данной модели. После последнего допустимого NOP PC может стать 4096; следующая выборка завершится ошибкой выхода за ОЗУ. Оборачивания адреса к нулю нет.\n\n## Длинная арифметика\n\nЗнаковые операнды лежат в диапазоне -32768..32767. Их произведение помещается в 32 бита. Но сумма десяти произведений имеет границы:\n\n```text\nминимум: 10 × (-32768 × 32767)  = -10737090560\nмаксимум: 10 × (-32768 × -32768) = 10737418240\n```\n\n34 знаковых бит недостаточно: максимум равен `2^33-1 = 8589934591`. 35 бит уже достаточно. Для целого числа 16-битных частей выбираем 48 бит.\n\nОтрицательное 32-битное произведение расширяется до 48 бит старшим словом FFFF, положительное – словом 0000. Программа получает его через `SAR R8,15` от копии старшего слова произведения. Затем:\n\n```asm\nADD R0, R6\nADC R1, R7\nADC R2, R8\n```\n\n`ADC` использует текущий перенос и формирует следующий. Между этими командами нельзя вставлять операции, меняющие CF, например шаг указателя. В CPU отсутствует операция «посчитать сумму массива» и отсутствует скрытый 48-битный аккумулятор, заменяющий эти три команды.\n\nСклейка слов в Python int используется только для отображения и проверки результата. При реализации одной команды MUL Python умножает два значения; затем результат немедленно разбивается на два 16-битных регистра.\n","html":["# Программная модель CPU","","Версия спецификации: 0.1.0. Собственная архитектура учебного процессора.","","## Что задано, а что выбрано","","Вариант 2 в таблице 4.1, печатная стр. 38 методички: двухадресная система, архитектура фон Неймана, сумма массива, затем «свертка» двух массивов по 10 знаковых элементов. Раздел 4.1 требует фиксированную длину инструкций, доступ к данным ОЗУ через пересылки, четыре вида адресации, ассемблерный ввод и отображение состояния.","","Разрядности, количество регистров, little-endian, кодировки и все приведенные ниже точные правила – **решения нашего проекта**. Они не приписываются методичке.","","## Состояние","","| Компонент | Размер | Назначение |","|---|---:|---|","| R0..R15 | 16 × 16 бит | Регистры общего назначения. R0 не закреплен за нулем |","| PC | 16 бит | Байтовый адрес следующей исполняемой инструкции |","| IR | 32 бита | Последняя успешно исполненная машинная инструкция |","| ZF, SF, CF, OF | 4 бита | Результат предыдущей операции, которая изменяет флаги |","| ОЗУ | 4096 × 8 бит | Единая память кода и данных |","| HALTED | Состояние управления | Запрещает исполнение после HALT до сброса |","","`steps`, исходные строки, таблица меток, трасса и лимит исполнения принадлежат эмулятору/отладчику. Это не доступные программе аппаратные регистры.","","При сбросе РОН, IR и флаги обнуляются, `HALTED=False`, PC получает точку входа. ZF после сброса равен 0, хотя все РОН нулевые: флаг не является постоянной проверкой содержимого всех регистров. Он относится к результату операции.","","## ОЗУ","","Один адрес обозначает один байт. Поэтому 16-битное слово занимает два адреса, а 32-битная инструкция – четыре. Слово `0x1234` хранится как байты `34 12` по возрастающим адресам. Слово читается только с четного адреса, инструкция – с адреса, кратного четырем.","","`Memory` содержит один `bytearray`. Процессор читает команды и данные из него. Доступ `MOV` к будущей инструкции может изменить ее; тест сам модифицирует NOP в HALT и проверяет, что fetch видит изменение. Это намеренная проверка единой памяти, не рекомендация писать самоменяющийся прикладной код.","","Ассемблер запрещает случайное перекрытие областей при сборке. Аппаратной защиты кода в самой машине нет. Разделение `.org 0` для кода и `.org 0x400` для данных – соглашение программ, не два отдельных устройства памяти.","","## Двухадресные операции","","`ADD R1,R2` читает оба регистра и записывает сумму в R1. R2 сохраняется. Источником может быть литерал, но не слово ОЗУ: `ADD R1,[R2]` отвергается. Сначала нужно загрузить значение через `MOV`.","","Особенность `MUL Rn,src`: n четный, результат занимает пару `R(n+1):Rn`. Первым явным операндом является младший регистр этой пары. Второй регистр результата определяется неявно. Например, `MUL R6,R7` читает прежние R6 и R7, затем заменяет оба на low/high результата. Адресность определяется явными операндами, а не количеством фактически измененных регистров.","","Отдельного физического аккумулятора нет. В демонстрационных программах роль длинного аккумулятора выполняет R2:R1:R0; счетчик цикла – R5. Это объясняет назначение этих регистров при демонстрации, но не ограничивает остальные программы.","","## Шаг","","1. Fetch читает четыре байта по PC из единой памяти.","2. Decode выделяет поля и проверяет их допустимость.","3. Execute читает операнды и рассчитывает изменения.","4. Commit записывает результат и новое значение PC.","","По умолчанию `PC_next = PC + 4`; выполненный переход заменяет его абсолютным адресом. HALT также увеличивает PC на 4, затем устанавливает HALTED. IR сохраняет именно HALT. Поэтому не следует интерпретировать память по новому PC как последнюю исполненную команду.","","При ошибке инструкции, адреса или выравнивания step выбрасывает `CPUFault`, не изменяя регистры, флаги, PC, IR и ОЗУ. Это свойство данной модели. После последнего допустимого NOP PC может стать 4096; следующая выборка завершится ошибкой выхода за ОЗУ. Оборачивания адреса к нулю нет.","","## Длинная арифметика","","Знаковые операнды лежат в диапазоне -32768..32767. Их произведение помещается в 32 бита. Но сумма десяти произведений имеет границы:","","```text","минимум: 10 × (-32768 × 32767)  = -10737090560","максимум: 10 × (-32768 × -32768) = 10737418240","```","","34 знаковых бит недостаточно: максимум равен `2^33-1 = 8589934591`. 35 бит уже достаточно. Для целого числа 16-битных частей выбираем 48 бит.","","Отрицательное 32-битное произведение расширяется до 48 бит старшим словом FFFF, положительное – словом 0000. Программа получает его через `SAR R8,15` от копии старшего слова произведения. Затем:","","```asm","ADD R0, R6","ADC R1, R7","ADC R2, R8","```","","`ADC` использует текущий перенос и формирует следующий. Между этими командами нельзя вставлять операции, меняющие CF, например шаг указателя. В CPU отсутствует операция «посчитать сумму массива» и отсутствует скрытый 48-битный аккумулятор, заменяющий эти три команды.","","Склейка слов в Python int используется только для отображения и проверки результата. При реализации одной команды MUL Python умножает два значения; затем результат немедленно разбивается на два 16-битных регистра."],"symbols":{},"sha256":"9cf0e1e658663aa34e60967beb0bd30301fc9cd5b591a315ab00393f2ab04fc7"},"docs/isa.md":{"text":"# Система команд и машинная кодировка\n\nВерсия 0.1.0. Все точные правила в этом документе задают собственную учебную ISA.\n\n## Формат инструкции\n\n```text\n31          24 23     20 19 18 17 16 15                     0\n+-------------+---------+-----+-----+------------------------+\n| opcode (8)  | reg (4) |mode | 00  | operand (16)           |\n+-------------+---------+-----+-----+------------------------+\n```\n\n`reg` – номер регистра. `operand` – значение, адрес или номер регистра в зависимости от `mode`. Резервные биты обязательно нулевые; неправильная инструкция вызывает ошибку.\n\n| mode | Смысл operand | Пример |\n|---|---|---|\n| 00 | Номер регистра 0..15 | `MOV R1,R2` |\n| 01 | Непосредственные 16 бит | `MOV R1,12` |\n| 10 | Байтовый адрес 16-битного слова | `MOV R1,[1024]` |\n| 11 | Номер регистра с адресом слова | `MOV R1,[R2]` |\n\nПример: `MOV R2,12` кодируется как `0x0124000C`. В памяти little-endian находятся байты `0C 00 24 01`. Код другого учебного процессора из методички для этой же строки может отличаться: кодировка здесь своя.\n\n## Команды\n\n| ASM | opcode HEX | Действие | Флаги |\n|---|---|---|---|\n| `NOP` | 00 | Только PC += 4 | Сохраняются |\n| `MOV Rn,src` | 01 | Копия src в Rn | Сохраняются |\n| `MOV mem,Rn` | 02 | Копия Rn в слово ОЗУ | Сохраняются |\n| `ADD Rn,src` | 10 | Rn = Rn + src, младшие 16 бит | Все |\n| `ADC Rn,src` | 11 | Rn = Rn + src + входящий CF | Все |\n| `SUB Rn,src` | 12 | Rn = Rn - src, младшие 16 бит | Все |\n| `MUL Rn,src` | 13 | signed 16×16 -> R(n+1):Rn, n четный | По правилам MUL ниже |\n| `CMP Rn,src` | 14 | Вычитание без записи результата | Все |\n| `SAR Rn,count` | 15 | Арифметический сдвиг вправо | По правилам SAR ниже |\n| `JMP addr` | 20 | PC = addr | Сохраняются |\n| `JZ addr` | 21 | Переход при ZF=1 | Сохраняются |\n| `JNZ addr` | 22 | Переход при ZF=0 | Сохраняются |\n| `JC addr` | 23 | Переход при CF=1 | Сохраняются |\n| `JNC addr` | 24 | Переход при CF=0 | Сохраняются |\n| `JO addr` | 25 | Переход при OF=1 | Сохраняются |\n| `JNO addr` | 26 | Переход при OF=0 | Сохраняются |\n| `HALT` | FF | PC += 4; HALTED = True | Сохраняются |\n\nOpcode 02 называется `STORE` в Python, но пользователь пишет обычный `MOV`. Поле `reg` у него содержит регистр-источник, `operand/mode` – приемник в ОЗУ. Это позволяет сохранить единый формат и 16-битное поле адреса без второй полной адресной части. Мнемоника `STORE` в исходном ассемблере не разрешена.\n\nДля арифметики `src` допускает только регистр или непосредственное значение. Для чтения MOV – все четыре режима. Для записи MOV приемник – прямая или косвенно-регистровая память, источник – регистр. Пересылки память-память и литерал-память запрещены: используй промежуточный регистр.\n\nВ NOP/HALT `reg=0`, `mode=00`, `operand=0`. В переходах `reg=0`, `mode=01`, `operand` – абсолютный адрес в пределах ОЗУ, кратный четырем. Невыполненный условный переход оставляет обычный `PC+4`.\n\n## Флаги ADD, ADC, SUB, CMP\n\nZF равен 1, когда сохраненные младшие 16 бит нулевые. SF равен их старшему биту.\n\nДля ADD/ADC CF равен 1, когда беззнаковая сумма с входящим переносом превышает 65535. Для SUB/CMP CF равен 1 при беззнаковом `left < right`: потребовался заем. Это выбранная семантика CF.\n\nOF равен 1, когда математический результат при знаковой интерпретации исходных 16-битных операндов не принадлежит -32768..32767. Для ADC входящий CF тоже входит в математический результат.\n\n| Операция | Сохраненные биты | signed | CF | OF |\n|---|---|---:|---:|---:|\n| 32767 + 1 | 8000 | -32768 | 0 | 1 |\n| FFFF + 1 | 0000 | 0 | 1 | 0 |\n| 0 - 1 | FFFF | -1 | 1 | 0 |\n| 8000 - 1 | 7FFF | 32767 | 0 | 1 |\n\nФлаг ZF после последнего ADC относится к его 16-битному результату, **не ко всему 48-битному числу**. Нулевое значение длинного числа нужно проверять по всем частям. В демонстрационных циклах JNZ проверяет флаг последнего SUB счетчика.\n\n## MUL\n\nОба источника сначала читаются как signed 16. Их произведение записывается полностью: младшие биты в Rn, старшие – в R(n+1). Поэтому разрешены только R0, R2, ..., R14 как первый операнд.\n\nZF у MUL относится ко всему произведению; SF – к его знаку. CF и OF одинаковы и показывают, что полное произведение не помещается в одно знаковое 16-битное слово. Никакие биты произведения при этом не теряются.\n\n## SAR\n\n`count` – значение 0..15, непосредственное либо прочитанное из регистра. При 0 регистр и флаги сохраняются. При 1..15 слева повторяется знаковый бит, CF получает последний вытесненный справа бит, OF=0, ZF/SF относятся к результату.\n\nВ частности, `SAR Rn,15` превращает исходное число в 0000 или FFFF и используется для знакового расширения. Это не циклический сдвиг и не перенос CF обратно в слово.\n","html":["# Система команд и машинная кодировка","","Версия 0.1.0. Все точные правила в этом документе задают собственную учебную ISA.","","## Формат инструкции","","```text","31          24 23     20 19 18 17 16 15                     0","+-------------+---------+-----+-----+------------------------+","| opcode (8)  | reg (4) |mode | 00  | operand (16)           |","+-------------+---------+-----+-----+------------------------+","```","","`reg` – номер регистра. `operand` – значение, адрес или номер регистра в зависимости от `mode`. Резервные биты обязательно нулевые; неправильная инструкция вызывает ошибку.","","| mode | Смысл operand | Пример |","|---|---|---|","| 00 | Номер регистра 0..15 | `MOV R1,R2` |","| 01 | Непосредственные 16 бит | `MOV R1,12` |","| 10 | Байтовый адрес 16-битного слова | `MOV R1,[1024]` |","| 11 | Номер регистра с адресом слова | `MOV R1,[R2]` |","","Пример: `MOV R2,12` кодируется как `0x0124000C`. В памяти little-endian находятся байты `0C 00 24 01`. Код другого учебного процессора из методички для этой же строки может отличаться: кодировка здесь своя.","","## Команды","","| ASM | opcode HEX | Действие | Флаги |","|---|---|---|---|","| `NOP` | 00 | Только PC += 4 | Сохраняются |","| `MOV Rn,src` | 01 | Копия src в Rn | Сохраняются |","| `MOV mem,Rn` | 02 | Копия Rn в слово ОЗУ | Сохраняются |","| `ADD Rn,src` | 10 | Rn = Rn + src, младшие 16 бит | Все |","| `ADC Rn,src` | 11 | Rn = Rn + src + входящий CF | Все |","| `SUB Rn,src` | 12 | Rn = Rn - src, младшие 16 бит | Все |","| `MUL Rn,src` | 13 | signed 16×16 -&gt; R(n+1):Rn, n четный | По правилам MUL ниже |","| `CMP Rn,src` | 14 | Вычитание без записи результата | Все |","| `SAR Rn,count` | 15 | Арифметический сдвиг вправо | По правилам SAR ниже |","| `JMP addr` | 20 | PC = addr | Сохраняются |","| `JZ addr` | 21 | Переход при ZF=1 | Сохраняются |","| `JNZ addr` | 22 | Переход при ZF=0 | Сохраняются |","| `JC addr` | 23 | Переход при CF=1 | Сохраняются |","| `JNC addr` | 24 | Переход при CF=0 | Сохраняются |","| `JO addr` | 25 | Переход при OF=1 | Сохраняются |","| `JNO addr` | 26 | Переход при OF=0 | Сохраняются |","| `HALT` | FF | PC += 4; HALTED = True | Сохраняются |","","Opcode 02 называется `STORE` в Python, но пользователь пишет обычный `MOV`. Поле `reg` у него содержит регистр-источник, `operand/mode` – приемник в ОЗУ. Это позволяет сохранить единый формат и 16-битное поле адреса без второй полной адресной части. Мнемоника `STORE` в исходном ассемблере не разрешена.","","Для арифметики `src` допускает только регистр или непосредственное значение. Для чтения MOV – все четыре режима. Для записи MOV приемник – прямая или косвенно-регистровая память, источник – регистр. Пересылки память-память и литерал-память запрещены: используй промежуточный регистр.","","В NOP/HALT `reg=0`, `mode=00`, `operand=0`. В переходах `reg=0`, `mode=01`, `operand` – абсолютный адрес в пределах ОЗУ, кратный четырем. Невыполненный условный переход оставляет обычный `PC+4`.","","## Флаги ADD, ADC, SUB, CMP","","ZF равен 1, когда сохраненные младшие 16 бит нулевые. SF равен их старшему биту.","","Для ADD/ADC CF равен 1, когда беззнаковая сумма с входящим переносом превышает 65535. Для SUB/CMP CF равен 1 при беззнаковом `left &lt; right`: потребовался заем. Это выбранная семантика CF.","","OF равен 1, когда математический результат при знаковой интерпретации исходных 16-битных операндов не принадлежит -32768..32767. Для ADC входящий CF тоже входит в математический результат.","","| Операция | Сохраненные биты | signed | CF | OF |","|---|---|---:|---:|---:|","| 32767 + 1 | 8000 | -32768 | 0 | 1 |","| FFFF + 1 | 0000 | 0 | 1 | 0 |","| 0 - 1 | FFFF | -1 | 1 | 0 |","| 8000 - 1 | 7FFF | 32767 | 0 | 1 |","","Флаг ZF после последнего ADC относится к его 16-битному результату, **не ко всему 48-битному числу**. Нулевое значение длинного числа нужно проверять по всем частям. В демонстрационных циклах JNZ проверяет флаг последнего SUB счетчика.","","## MUL","","Оба источника сначала читаются как signed 16. Их произведение записывается полностью: младшие биты в Rn, старшие – в R(n+1). Поэтому разрешены только R0, R2, ..., R14 как первый операнд.","","ZF у MUL относится ко всему произведению; SF – к его знаку. CF и OF одинаковы и показывают, что полное произведение не помещается в одно знаковое 16-битное слово. Никакие биты произведения при этом не теряются.","","## SAR","","`count` – значение 0..15, непосредственное либо прочитанное из регистра. При 0 регистр и флаги сохраняются. При 1..15 слева повторяется знаковый бит, CF получает последний вытесненный справа бит, OF=0, ZF/SF относятся к результату.","","В частности, `SAR Rn,15` превращает исходное число в 0000 или FFFF и используется для знакового расширения. Это не циклический сдвиг и не перенос CF обратно в слово."],"symbols":{},"sha256":"8f406df35c4944ec817495f1a42039d58ac625a5894dc1db16ec0538581e2523"},"docs/method-notes.md":{"text":"# О методичке и прежних набросках\n\nЗдесь явно отделены исходные формулировки от решений проекта. Номера страниц – печатные.\n\n**Таблица MOV, стр. 15–16.** В тексте результат `MOV R2,12` равен 000C, но в таблице 2.1 указан 0007. В нашей спецификации и тестах непосредственная пересылка 12 дает 000C. Конкретная кодировка этой команды выбрана отдельно и не копируется из таблицы.\n\n**Заголовок массива, стр. 35 и 37.** На стр. 35 сказано «Первым элементом массива идет его номер», а на стр. 37 – что это размер массива, количество оставшихся элементов. В проекте выбран второй, более конкретный формат из описания заданий: первое слово – длина. Это явное разрешение противоречия, а не утверждение, что исходный текст везде одинаков.\n\n**Двоичное сложение, стр. 29.** В перечислении указано `1+0=0`. Наше АЛУ использует арифметику, в которой `1+0=1`; это фиксируется вычислениями и тестами, а не переносится из опечатки.\n\n**JNZ в стековой части, стр. 25 и 28.** Описание перехода по нулю противоречит имени и позднему комментарию к JNZ. Для собственной, не стековой ISA правило зафиксировано однозначно: JNZ выполняет переход при ZF=0. Forth-раздел не является спецификацией нашей машины.\n\n**Сдвиги, стр. 19 и 34.** Описания смешивают обычные, циклические сдвиги и использование CF. В проекте нет попытки реализовать их все по этим абзацам: определена одна собственная команда SAR с точными правилами в isa.md и тестами. Ее назначение – сохранение знака и получение знакового расширения.\n\n**Формула «свертки», стр. 37.** Термин методички сохраняется в названии задания. Реализуется ровно формула (4.1), сумма попарных произведений элементов двух массивов. Никакой дополнительный алгоритм сдвига одного массива относительно другого в задание не подставляется.\n\n**Раннее предложение в переписке.** Для суммы десяти полных 16-битных знаковых произведений пара 16-битных регистров недостаточна. В реализации накопитель заменен на три слова, 48 бит; вывод диапазона есть в cpu.md.\n\n**Ранний псевдоассемблер.** В наброске длина массива была константой, а указатель сдвигался на 1. В реализации длина читается из первого слова массива, а указатель сдвигается на 2, поскольку выбрана байтовая адресация и 16-битные элементы. Именно выбор размера ячейки определяет шаг указателя.\n\nАрхитектурные правила этого проекта не выдаются за правила всех RISC-процессоров. Фиксированная длина здесь обязательна из-за формулировки задания, а наша ISA не является реализацией RISC-V.\n","html":["# О методичке и прежних набросках","","Здесь явно отделены исходные формулировки от решений проекта. Номера страниц – печатные.","","**Таблица MOV, стр. 15–16.** В тексте результат `MOV R2,12` равен 000C, но в таблице 2.1 указан 0007. В нашей спецификации и тестах непосредственная пересылка 12 дает 000C. Конкретная кодировка этой команды выбрана отдельно и не копируется из таблицы.","","**Заголовок массива, стр. 35 и 37.** На стр. 35 сказано «Первым элементом массива идет его номер», а на стр. 37 – что это размер массива, количество оставшихся элементов. В проекте выбран второй, более конкретный формат из описания заданий: первое слово – длина. Это явное разрешение противоречия, а не утверждение, что исходный текст везде одинаков.","","**Двоичное сложение, стр. 29.** В перечислении указано `1+0=0`. Наше АЛУ использует арифметику, в которой `1+0=1`; это фиксируется вычислениями и тестами, а не переносится из опечатки.","","**JNZ в стековой части, стр. 25 и 28.** Описание перехода по нулю противоречит имени и позднему комментарию к JNZ. Для собственной, не стековой ISA правило зафиксировано однозначно: JNZ выполняет переход при ZF=0. Forth-раздел не является спецификацией нашей машины.","","**Сдвиги, стр. 19 и 34.** Описания смешивают обычные, циклические сдвиги и использование CF. В проекте нет попытки реализовать их все по этим абзацам: определена одна собственная команда SAR с точными правилами в isa.md и тестами. Ее назначение – сохранение знака и получение знакового расширения.","","**Формула «свертки», стр. 37.** Термин методички сохраняется в названии задания. Реализуется ровно формула (4.1), сумма попарных произведений элементов двух массивов. Никакой дополнительный алгоритм сдвига одного массива относительно другого в задание не подставляется.","","**Раннее предложение в переписке.** Для суммы десяти полных 16-битных знаковых произведений пара 16-битных регистров недостаточна. В реализации накопитель заменен на три слова, 48 бит; вывод диапазона есть в cpu.md.","","**Ранний псевдоассемблер.** В наброске длина массива была константой, а указатель сдвигался на 1. В реализации длина читается из первого слова массива, а указатель сдвигается на 2, поскольку выбрана байтовая адресация и 16-битные элементы. Именно выбор размера ячейки определяет шаг указателя.","","Архитектурные правила этого проекта не выдаются за правила всех RISC-процессоров. Фиксированная длина здесь обязательна из-за формулировки задания, а наша ISA не является реализацией RISC-V."],"symbols":{},"sha256":"cab6a089fe80b8a06f7331cc0f0df772a3cdbaa90d679d2381fc6d026cbe76f8"},"docs/requirements.md":{"text":"# Связь с заданием\n\nИсточник требований: «уч-мет пособие РПАО ИАС практика.pdf», раздел 4.1, **печатные** стр. 35–38. Этот документ не заменяет актуальные указания преподавателя. Допустимую команду до трех человек сообщил преподаватель в обсуждении пользователя; текст методички содержит старое ограничение один-два человека.\n\n## Требования и реализация\n\n| Требование | Место в методичке | Реализация |\n|---|---|---|\n| Вариант 2: двухадресная машина фон Неймана | Таблица 4.1, стр. 38 | `isa/instruction.py`, `cpu/memory.py` |\n| Скаляры, фиксированная длина инструкций | Стр. 35–36 | 16-битные операции, 4-байтовый машинный формат |\n| ОЗУ для кода и данных | Стр. 35, архитектура по варианту | Один bytearray; fetch читает его же |\n| Только пересылки работают с данными ОЗУ | Стр. 36 | MOV load/store; арифметика не принимает память |\n| Непосредственная, прямая, регистровая, косвенно-регистровая адресация | Стр. 36 | Четыре значения Mode; все проверены тестами |\n| РОН, PC, IR, флаги, поля команды на экране | Стр. 35 | `ui/window.py`; запуск GUI еще требует проверки |\n| Изменение состояния после каждой команды | Стр. 35 | CPU.step, снимки before/after, трасса |\n| Ввод ассемблера и перевод в машинный код | Стр. 36 | Двухпроходный ассемблер; ввод в GUI и через файл |\n| Обработка массивов в цикле, длина первым элементом | Стр. 37 | Обе программы читают заголовок и выполняют JNZ |\n| Сумма массива | Таблица 4.1 | `programs/sum.asm` |\n| «Свертка» двух массивов по 10 знаковых элементов | Таблица 4.1, формула (4.1) | `programs/dot_product.asm` |\n| Длинная арифметика во втором задании | Стр. 37 | MUL в пару РОН; 48-битная цепочка ADD/ADC/ADC |\n| Две программы в машинном коде и на ассемблере | Стр. 37 | Исходники + CLI assemble; листинг в GUI |\n| Отчет: компоненты, команды, поля, заключение, титул и задание | Стр. 36–37 | Спецификации и примеры готовы как материал; окончательный отчет не собран |\n\n## Решения, которых методичка не задает точно\n\nВыбраны 16 РОН по 16 бит, 4096 байт памяти, 32-битная инструкция, little-endian, абсолютные переходы, четная пара результата MUL и трехсловный накопитель. Эти решения можно менять, но одновременно должны меняться спецификация, ассемблер, CPU и тесты.\n\nВстроенные программы дополнительно принимают пустые массивы и отвергают неверные длины. Это защита примеров и граничные тесты, не изменение задания на демонстрацию: обычный второй пример содержит по 10 элементов.\n\nПоддерживаются только необходимые инструкции и несколько наблюдательных условных переходов. Полные наборы x86/RISC-V, деление, стек, CALL/RET, кеш и конвейер не реализуются. Дополнительная архитектура PIC18 из раздела 4.2 в базовую версию не включена.\n\n## До защиты\n\nНужно фактически запустить GUI на целевом ПК, согласовать собственную ISA с преподавателем и собрать итоговый отчет. Никаких отметок о принятии преподавателем или гарантированной оценке здесь нет.\n","html":["# Связь с заданием","","Источник требований: «уч-мет пособие РПАО ИАС практика.pdf», раздел 4.1, **печатные** стр. 35–38. Этот документ не заменяет актуальные указания преподавателя. Допустимую команду до трех человек сообщил преподаватель в обсуждении пользователя; текст методички содержит старое ограничение один-два человека.","","## Требования и реализация","","| Требование | Место в методичке | Реализация |","|---|---|---|","| Вариант 2: двухадресная машина фон Неймана | Таблица 4.1, стр. 38 | `isa/instruction.py`, `cpu/memory.py` |","| Скаляры, фиксированная длина инструкций | Стр. 35–36 | 16-битные операции, 4-байтовый машинный формат |","| ОЗУ для кода и данных | Стр. 35, архитектура по варианту | Один bytearray; fetch читает его же |","| Только пересылки работают с данными ОЗУ | Стр. 36 | MOV load/store; арифметика не принимает память |","| Непосредственная, прямая, регистровая, косвенно-регистровая адресация | Стр. 36 | Четыре значения Mode; все проверены тестами |","| РОН, PC, IR, флаги, поля команды на экране | Стр. 35 | `ui/window.py`; запуск GUI еще требует проверки |","| Изменение состояния после каждой команды | Стр. 35 | CPU.step, снимки before/after, трасса |","| Ввод ассемблера и перевод в машинный код | Стр. 36 | Двухпроходный ассемблер; ввод в GUI и через файл |","| Обработка массивов в цикле, длина первым элементом | Стр. 37 | Обе программы читают заголовок и выполняют JNZ |","| Сумма массива | Таблица 4.1 | `programs/sum.asm` |","| «Свертка» двух массивов по 10 знаковых элементов | Таблица 4.1, формула (4.1) | `programs/dot_product.asm` |","| Длинная арифметика во втором задании | Стр. 37 | MUL в пару РОН; 48-битная цепочка ADD/ADC/ADC |","| Две программы в машинном коде и на ассемблере | Стр. 37 | Исходники + CLI assemble; листинг в GUI |","| Отчет: компоненты, команды, поля, заключение, титул и задание | Стр. 36–37 | Спецификации и примеры готовы как материал; окончательный отчет не собран |","","## Решения, которых методичка не задает точно","","Выбраны 16 РОН по 16 бит, 4096 байт памяти, 32-битная инструкция, little-endian, абсолютные переходы, четная пара результата MUL и трехсловный накопитель. Эти решения можно менять, но одновременно должны меняться спецификация, ассемблер, CPU и тесты.","","Встроенные программы дополнительно принимают пустые массивы и отвергают неверные длины. Это защита примеров и граничные тесты, не изменение задания на демонстрацию: обычный второй пример содержит по 10 элементов.","","Поддерживаются только необходимые инструкции и несколько наблюдательных условных переходов. Полные наборы x86/RISC-V, деление, стек, CALL/RET, кеш и конвейер не реализуются. Дополнительная архитектура PIC18 из раздела 4.2 в базовую версию не включена.","","## До защиты","","Нужно фактически запустить GUI на целевом ПК, согласовать собственную ISA с преподавателем и собрать итоговый отчет. Никаких отметок о принятии преподавателем или гарантированной оценке здесь нет."],"symbols":{},"sha256":"138157f515258f606196031f3b38623827b99b16b59d2efe829bb27de18946c1"},"docs/sources.md":{"text":"# Источники и границы заимствования\n\n## Материалы задания\n\n«уч-мет пособие РПАО ИАС практика.pdf», Скрябин Ю. М., Данилович Е. С. Использован предоставленный в разговоре файл, 55 страниц PDF; печатная нумерация 3–57.\n\nДля проекта важны 1.1–1.2 (память и регистры), 2.1–2.3 (адресация, адресность, переходы), 3.1–3.2 (знаковые числа и длинная арифметика), 4.1 (требования), 4.3–4.4 (эмуляция и ассемблер). Таблица 4.1 прочитана по изображению страницы с объединенными ячейками.\n\nГотовые листинги пособия в проект не переносились. Наша ISA, кодирование, программы и исходники спроектированы отдельно. Ошибки и различия явно перечислены в method-notes.md.\n\n## Документация инструментов\n\nПри подготовке проверены официальные материалы:\n\n| Материал | Для чего использован | Адрес |\n|---|---|---|\n| Python 3.13, Built-in Types | Представление int и побитовые операции; модель сама ограничивает разрядность | `https://docs.python.org/3.13/library/stdtypes.html` |\n| Qt for Python, QTimer | Запуск шагов через цикл событий, а не блокирующий while | `https://doc.qt.io/qtforpython-6/PySide6/QtCore/QTimer.html` |\n| pytest, Parametrize | Параметризованные тесты границ и комбинаций | `https://docs.pytest.org/en/stable/how-to/parametrize.html` |\n| uv, Locking and syncing | uv run, отдельный extra gui, создание окружения и lock-файла | `https://docs.astral.sh/uv/concepts/projects/sync/` |\n| uv, Managing dependencies | Разделение runtime, optional gui и dev-зависимостей | `https://docs.astral.sh/uv/concepts/projects/dependencies/` |\n\nПроверка документации API не является выполнением GUI-тестов. Фактические запуски и ограничения среды перечислены отдельно в verification.md.\n","html":["# Источники и границы заимствования","","## Материалы задания","","«уч-мет пособие РПАО ИАС практика.pdf», Скрябин Ю. М., Данилович Е. С. Использован предоставленный в разговоре файл, 55 страниц PDF; печатная нумерация 3–57.","","Для проекта важны 1.1–1.2 (память и регистры), 2.1–2.3 (адресация, адресность, переходы), 3.1–3.2 (знаковые числа и длинная арифметика), 4.1 (требования), 4.3–4.4 (эмуляция и ассемблер). Таблица 4.1 прочитана по изображению страницы с объединенными ячейками.","","Готовые листинги пособия в проект не переносились. Наша ISA, кодирование, программы и исходники спроектированы отдельно. Ошибки и различия явно перечислены в method-notes.md.","","## Документация инструментов","","При подготовке проверены официальные материалы:","","| Материал | Для чего использован | Адрес |","|---|---|---|","| Python 3.13, Built-in Types | Представление int и побитовые операции; модель сама ограничивает разрядность | `https://docs.python.org/3.13/library/stdtypes.html` |","| Qt for Python, QTimer | Запуск шагов через цикл событий, а не блокирующий while | `https://doc.qt.io/qtforpython-6/PySide6/QtCore/QTimer.html` |","| pytest, Parametrize | Параметризованные тесты границ и комбинаций | `https://docs.pytest.org/en/stable/how-to/parametrize.html` |","| uv, Locking and syncing | uv run, отдельный extra gui, создание окружения и lock-файла | `https://docs.astral.sh/uv/concepts/projects/sync/` |","| uv, Managing dependencies | Разделение runtime, optional gui и dev-зависимостей | `https://docs.astral.sh/uv/concepts/projects/dependencies/` |","","Проверка документации API не является выполнением GUI-тестов. Фактические запуски и ограничения среды перечислены отдельно в verification.md."],"symbols":{},"sha256":"4616f26ee6a82e42e3aba070a23c55bab773ef6d7bf8ed24d79149844fc121b6"},"docs/theory.md":{"text":"# Первый разбор проекта\n\nЗдесь не нужно запоминать весь набор команд. Цель первого прохода – проследить одну команду от текста до изменения регистра, затем понять перенос между частями числа.\n\n## 1. Почему -1 и 65535 имеют одинаковые биты\n\nОткрой `cpu/word.py`. `u16(-1)` дает FFFF, а `signed(0xFFFF)` дает -1. В регистре хранится набор из 16 бит, не Python-объект с отдельным признаком signed.\n\nПрочитай тест `test_same_bits_different_signed_interpretation`. Он показывает, что знак появляется при интерпретации старшего бита. Проверь себя: `8000` означает unsigned 32768 или signed -32768. Это не две разные записи в памяти.\n\n## 2. Почему нельзя просто сохранить left + right\n\nОткрой `alu.add`. Сумма FFFF + 1 математически равна 65536. В регистр попадет только 0000, а информация о лишнем разряде окажется в CF. Именно поэтому рядом с `u16` сначала считается полная сумма.\n\nOF отвечает на другой вопрос. В опыте `overflow.asm` складываются 32767 и 1. Переноса за 16 бит нет, но положительный результат больше максимального знакового числа. Поэтому CF=0, OF=1.\n\nКонтрольный вопрос: может ли быть CF=1 и OF=0? Да, FFFF+1 при знаковой интерпретации означает -1+1=0, то есть знакового переполнения нет.\n\n## 3. Как текст MOV R2,12 превращается в состояние\n\nВ `assembler/lexer.py` строка становится токенами. В `parser.py` выделяются мнемоника и два операнда. В `assembler.py` они превращаются в `Instruction(MOV, register=2, mode=IMMEDIATE, operand=12)`.\n\n`isa/codec.py` собирает слово 0124000C. Ассемблер записывает байты 0C 00 24 01 в единую ОЗУ.\n\nТеперь открой `CPU.step()`. Fetch читает эти четыре байта по PC. Decode восстанавливает поля. `_operand()` видит IMMEDIATE и возвращает число 12. Execute готовит R2=12. Commit сохраняет новое состояние, IR и PC+4.\n\nКонтрольный вопрос: где CPU читает строку `MOV R2,12`? Нигде. Он исполняет только код из ОЗУ. Текстовая форма восстанавливается для интерфейса.\n\n## 4. Чем число отличается от адреса\n\nВ `_operand()` сопоставь четыре ветви:\n\n```asm\nMOV R1, 12\nMOV R1, R2\nMOV R1, [12]\nMOV R1, [R2]\n```\n\nПервая берет 12, вторая значение R2, третья слово по адресу 12, четвертая сначала берет адрес из R2 и только затем читает память. При одинаковых цифрах в поле инструкции результаты могут быть разными, потому что различается mode.\n\nПроверь себя: если R2=1024, а по адресу 1024 лежит 7, `MOV R1,R2` запишет 1024, а `MOV R1,[R2]` – 7.\n\n## 5. Почему в цикле прибавляется 2, а у PC – 4\n\nВ нашей машине адресуется один байт. Элемент массива занимает 16 бит, то есть 2 байта. Инструкция занимает 32 бита, то есть 4 байта. Поэтому адрес следующего элемента и адрес следующей команды считаются по-разному.\n\nПервое слово массива – длина. Указатель сначала загружается адресом заголовка, из него читается счетчик, затем прибавляется 2. Это исправляет ошибку раннего наброска из обсуждения, где число элементов задавалось константой и заголовок не учитывался.\n\n## 6. Зачем ADD, затем ADC\n\nЗапусти `carry --trace` и открой `programs/carry.asm`. После младшего сложения CF содержит перенос. ADC прибавляет его к старшему слову. Если заменить ADC обычным ADD, получится 0 вместо 65536.\n\nВ `dot_product.asm` частей три. После первого ADC сформирован новый CF для второго ADC. Поэтому между ними нет обновления указателя или счетчика: такие операции уничтожили бы нужный перенос.\n\n## 7. Почему нужна третья часть\n\nПроизведение минимальных знаковых чисел равно `(-32768)*(-32768)=1073741824`. Десять таких произведений дают 10737418240. Это не помещается ни в signed 32, ни в unsigned 32.\n\nВ `test_dot_product_extremes_need_more_than_32_bits` есть именно такой тест. Студенту на защите важно объяснить не только сам факт «мы взяли три регистра», но и почему двух недостаточно для полного входного диапазона.\n\n## 8. Зачем знаковое расширение перед сложением\n\nУ отрицательного 32-битного произведения в старшем бите стоит 1. При расширении до 48 бит добавляется FFFF, не 0000. Иначе те же младшие 32 бита стали бы большим положительным 48-битным числом.\n\n`MOV R8,R7` берет старшую половину произведения, `SAR R8,15` размножает ее знак. После этого R8:R7:R6 является корректной 48-битной записью того же произведения.\n\n## 9. Что отличает тест эмулятора от картинки с регистрами\n\nОткрой `test_program_can_modify_future_instruction_in_unified_memory`. Программа меняет будущую команду в ОЗУ. Исполнитель должен заметить изменение при следующей выборке. Эмулятор, который просто перебирает заранее созданные объекты команд, этот тест не пройдет.\n\nЗатем прочитай `test_fault_does_not_partially_commit`: после неверного адреса состояние не меняется. Окно может показать ошибку, но не должно выдавать частично выполненную команду за завершенный шаг.\n\n## Для первого самостоятельного изменения\n\nИзмени два значения в `sum.asm`, заранее посчитай ожидаемую сумму, собери и запусти. Затем повтори с отрицательным итогом. Проверь отдельно десятичный RESULT, слова low/middle/high и код перехода JNZ в листинге. ISA при этом менять не требуется.\n","html":["# Первый разбор проекта","","Здесь не нужно запоминать весь набор команд. Цель первого прохода – проследить одну команду от текста до изменения регистра, затем понять перенос между частями числа.","","## 1. Почему -1 и 65535 имеют одинаковые биты","","Открой `cpu/word.py`. `u16(-1)` дает FFFF, а `signed(0xFFFF)` дает -1. В регистре хранится набор из 16 бит, не Python-объект с отдельным признаком signed.","","Прочитай тест `test_same_bits_different_signed_interpretation`. Он показывает, что знак появляется при интерпретации старшего бита. Проверь себя: `8000` означает unsigned 32768 или signed -32768. Это не две разные записи в памяти.","","## 2. Почему нельзя просто сохранить left + right","","Открой `alu.add`. Сумма FFFF + 1 математически равна 65536. В регистр попадет только 0000, а информация о лишнем разряде окажется в CF. Именно поэтому рядом с `u16` сначала считается полная сумма.","","OF отвечает на другой вопрос. В опыте `overflow.asm` складываются 32767 и 1. Переноса за 16 бит нет, но положительный результат больше максимального знакового числа. Поэтому CF=0, OF=1.","","Контрольный вопрос: может ли быть CF=1 и OF=0? Да, FFFF+1 при знаковой интерпретации означает -1+1=0, то есть знакового переполнения нет.","","## 3. Как текст MOV R2,12 превращается в состояние","","В `assembler/lexer.py` строка становится токенами. В `parser.py` выделяются мнемоника и два операнда. В `assembler.py` они превращаются в `Instruction(MOV, register=2, mode=IMMEDIATE, operand=12)`.","","`isa/codec.py` собирает слово 0124000C. Ассемблер записывает байты 0C 00 24 01 в единую ОЗУ.","","Теперь открой `CPU.step()`. Fetch читает эти четыре байта по PC. Decode восстанавливает поля. `_operand()` видит IMMEDIATE и возвращает число 12. Execute готовит R2=12. Commit сохраняет новое состояние, IR и PC+4.","","Контрольный вопрос: где CPU читает строку `MOV R2,12`? Нигде. Он исполняет только код из ОЗУ. Текстовая форма восстанавливается для интерфейса.","","## 4. Чем число отличается от адреса","","В `_operand()` сопоставь четыре ветви:","","```asm","MOV R1, 12","MOV R1, R2","MOV R1, [12]","MOV R1, [R2]","```","","Первая берет 12, вторая значение R2, третья слово по адресу 12, четвертая сначала берет адрес из R2 и только затем читает память. При одинаковых цифрах в поле инструкции результаты могут быть разными, потому что различается mode.","","Проверь себя: если R2=1024, а по адресу 1024 лежит 7, `MOV R1,R2` запишет 1024, а `MOV R1,[R2]` – 7.","","## 5. Почему в цикле прибавляется 2, а у PC – 4","","В нашей машине адресуется один байт. Элемент массива занимает 16 бит, то есть 2 байта. Инструкция занимает 32 бита, то есть 4 байта. Поэтому адрес следующего элемента и адрес следующей команды считаются по-разному.","","Первое слово массива – длина. Указатель сначала загружается адресом заголовка, из него читается счетчик, затем прибавляется 2. Это исправляет ошибку раннего наброска из обсуждения, где число элементов задавалось константой и заголовок не учитывался.","","## 6. Зачем ADD, затем ADC","","Запусти `carry --trace` и открой `programs/carry.asm`. После младшего сложения CF содержит перенос. ADC прибавляет его к старшему слову. Если заменить ADC обычным ADD, получится 0 вместо 65536.","","В `dot_product.asm` частей три. После первого ADC сформирован новый CF для второго ADC. Поэтому между ними нет обновления указателя или счетчика: такие операции уничтожили бы нужный перенос.","","## 7. Почему нужна третья часть","","Произведение минимальных знаковых чисел равно `(-32768)*(-32768)=1073741824`. Десять таких произведений дают 10737418240. Это не помещается ни в signed 32, ни в unsigned 32.","","В `test_dot_product_extremes_need_more_than_32_bits` есть именно такой тест. Студенту на защите важно объяснить не только сам факт «мы взяли три регистра», но и почему двух недостаточно для полного входного диапазона.","","## 8. Зачем знаковое расширение перед сложением","","У отрицательного 32-битного произведения в старшем бите стоит 1. При расширении до 48 бит добавляется FFFF, не 0000. Иначе те же младшие 32 бита стали бы большим положительным 48-битным числом.","","`MOV R8,R7` берет старшую половину произведения, `SAR R8,15` размножает ее знак. После этого R8:R7:R6 является корректной 48-битной записью того же произведения.","","## 9. Что отличает тест эмулятора от картинки с регистрами","","Открой `test_program_can_modify_future_instruction_in_unified_memory`. Программа меняет будущую команду в ОЗУ. Исполнитель должен заметить изменение при следующей выборке. Эмулятор, который просто перебирает заранее созданные объекты команд, этот тест не пройдет.","","Затем прочитай `test_fault_does_not_partially_commit`: после неверного адреса состояние не меняется. Окно может показать ошибку, но не должно выдавать частично выполненную команду за завершенный шаг.","","## Для первого самостоятельного изменения","","Измени два значения в `sum.asm`, заранее посчитай ожидаемую сумму, собери и запусти. Затем повтори с отрицательным итогом. Проверь отдельно десятичный RESULT, слова low/middle/high и код перехода JNZ в листинге. ISA при этом менять не требуется."],"symbols":{},"sha256":"ae4cfb098bbf8bbaabc7acbd30d95c7cec1d5801dc6e2aa7a182d971a1a94f43"},"docs/verification.md":{"text":"# Проверка версии 0.1.0\n\nДата подготовки: 2 октября 2026 года.\n\n## Что фактически выполнено\n\nСреда: Linux, Python 3.13.5, pytest 9.0.2.\n\n```text\n........................................................................ [ 18%]\n........................................................................ [ 36%]\n........................................................................ [ 54%]\n........................................................................ [ 72%]\n........................................................................ [ 90%]\n.....................................                                    [100%]\n=========================== short test summary info ============================\nSKIPPED [1] tests/test_ui.py:12: Для проверки GUI установи extra gui\n397 passed, 1 skipped in 0.61s\n```\n\nЭто 397 успешно прошедших параметризованных/обычных тестовых случаев. Один пропуск относится к модулю GUI: PySide6 в среде отсутствовал, поэтому пять находящихся в нем smoke-тестов окна не запускались. Пропуск не считается успешной проверкой GUI.\n\nДополнительно выполнена компиляция всех Python-файлов, включая GUI, через `python -m compileall -q src tests`. Она проверяет синтаксис, но не наличие API Qt и не работу окна.\n\nПроверены четыре режима адресации, машинные кодировки, прямые/косвенные пересылки, переходы по обеим веткам, CF/OF, MUL с перекрытием исходного регистра и пары результата, знаковое расширение, ошибки входного текста, ошибки доступа к памяти, остановка HALT и лимит исполнения.\n\nВ наборе есть 120 воспроизводимых случайных пар запусков: сумма массива длиной 6..15 и сумма произведений массивов длиной 10. Внутри отдельного теста АЛУ выполнены 3000 случайных сравнений ADD/ADC/SUB с математическими определениями.\n\nТест единой памяти изменяет будущую инструкцию с NOP на HALT и проверяет, что процессор исполняет измененные байты, а не старый объект из листинга. Тесты аварий проверяют, что ошибочный шаг не меняет архитектурное состояние.\n\n## Численные результаты\n\n| Сценарий | Результат |\n|---|---:|\n| `sum`, исходные данные из поставки | 65459 |\n| `dot_product`, исходные данные из поставки | 2947418113 |\n| `carry` | 65536 |\n| 10 произведений (-32768) × (-32768) | 10737418240 |\n\nДля последнего случая слова результата low/middle/high равны `0000 8000 0002`. Ненулевая третья часть показывает, почему 32-битного накопителя недостаточно.\n\n## Упаковка\n\nПакет собран локально в wheel через setuptools. Wheel установлен без зависимостей в отдельное окружение; встроенный `dot_product` запущен из `/tmp`, вне каталога исходников. Результат 2947418113 подтверждает, что `.asm`-ресурсы попадают в пакет и не зависят от рабочего каталога.\n\n## Что не подтверждено\n\n`uv sync --all-extras` не завершился: среда не разрешила DNS-имя сервера пакетов. Поэтому не проверены автоматическая установка зависимостей, PySide6, работа окна, QTimer и ручное взаимодействие с интерфейсом. Lock-файл не сгенерирован и не подменен вручную.\n\nRuff сконфигурирован, но не запускался: пакет отсутствовал и не был загружен. Проверка на Windows не проводилась. Работоспособность GUI нельзя выводить из успешных тестов ядра.\n\n## Повторная проверка на целевом ПК\n\n```powershell\nuv run pytest -q\nuv run --extra gui pytest -q\nuv run ruff check .\nuv run --extra gui rpaoias gui\n```\n\nПри установленном PySide6 нужно получить успешные GUI-тесты без пропуска этого модуля, а затем вручную проверить открытие окна, выбор примера, сборку, несколько шагов, пуск/паузу, сброс и сохранение исходника. Тесты и документация не являются подтверждением приемки преподавателем.\n","html":["# Проверка версии 0.1.0","","Дата подготовки: 2 октября 2026 года.","","## Что фактически выполнено","","Среда: Linux, Python 3.13.5, pytest 9.0.2.","","```text","........................................................................ [ 18%]","........................................................................ [ 36%]","........................................................................ [ 54%]","........................................................................ [ 72%]","........................................................................ [ 90%]",".....................................                                    [100%]","=========================== short test summary info ============================","SKIPPED [1] tests/test_ui.py:12: Для проверки GUI установи extra gui","397 passed, 1 skipped in 0.61s","```","","Это 397 успешно прошедших параметризованных/обычных тестовых случаев. Один пропуск относится к модулю GUI: PySide6 в среде отсутствовал, поэтому пять находящихся в нем smoke-тестов окна не запускались. Пропуск не считается успешной проверкой GUI.","","Дополнительно выполнена компиляция всех Python-файлов, включая GUI, через `python -m compileall -q src tests`. Она проверяет синтаксис, но не наличие API Qt и не работу окна.","","Проверены четыре режима адресации, машинные кодировки, прямые/косвенные пересылки, переходы по обеим веткам, CF/OF, MUL с перекрытием исходного регистра и пары результата, знаковое расширение, ошибки входного текста, ошибки доступа к памяти, остановка HALT и лимит исполнения.","","В наборе есть 120 воспроизводимых случайных пар запусков: сумма массива длиной 6..15 и сумма произведений массивов длиной 10. Внутри отдельного теста АЛУ выполнены 3000 случайных сравнений ADD/ADC/SUB с математическими определениями.","","Тест единой памяти изменяет будущую инструкцию с NOP на HALT и проверяет, что процессор исполняет измененные байты, а не старый объект из листинга. Тесты аварий проверяют, что ошибочный шаг не меняет архитектурное состояние.","","## Численные результаты","","| Сценарий | Результат |","|---|---:|","| `sum`, исходные данные из поставки | 65459 |","| `dot_product`, исходные данные из поставки | 2947418113 |","| `carry` | 65536 |","| 10 произведений (-32768) × (-32768) | 10737418240 |","","Для последнего случая слова результата low/middle/high равны `0000 8000 0002`. Ненулевая третья часть показывает, почему 32-битного накопителя недостаточно.","","## Упаковка","","Пакет собран локально в wheel через setuptools. Wheel установлен без зависимостей в отдельное окружение; встроенный `dot_product` запущен из `/tmp`, вне каталога исходников. Результат 2947418113 подтверждает, что `.asm`-ресурсы попадают в пакет и не зависят от рабочего каталога.","","## Что не подтверждено","","`uv sync --all-extras` не завершился: среда не разрешила DNS-имя сервера пакетов. Поэтому не проверены автоматическая установка зависимостей, PySide6, работа окна, QTimer и ручное взаимодействие с интерфейсом. Lock-файл не сгенерирован и не подменен вручную.","","Ruff сконфигурирован, но не запускался: пакет отсутствовал и не был загружен. Проверка на Windows не проводилась. Работоспособность GUI нельзя выводить из успешных тестов ядра.","","## Повторная проверка на целевом ПК","","```powershell","uv run pytest -q","uv run --extra gui pytest -q","uv run ruff check .","uv run --extra gui rpaoias gui","```","","При установленном PySide6 нужно получить успешные GUI-тесты без пропуска этого модуля, а затем вручную проверить открытие окна, выбор примера, сборку, несколько шагов, пуск/паузу, сброс и сохранение исходника. Тесты и документация не являются подтверждением приемки преподавателем."],"symbols":{},"sha256":"a99a122402c2b658132314112bbe73a8c12d728c0cd30a4a72155b92b95e1999"},"src/rpaoias/__init__.py":{"text":"\"\"\"РПАО ИАС: учебный процессор, а не совместимая реализация x86 или RISC-V.\n\nРазрядности и правила команд заданы нами в docs/cpu.md и docs/isa.md.\nМетодичка определяет задание; там, где она оставляет выбор, спецификация\nпроекта явно фиксирует выбранный вариант.\n\"\"\"\n\n__version__ = \"0.1.0\"\n","html":["<span class=\"sd\">&quot;&quot;&quot;РПАО ИАС: учебный процессор, а не совместимая реализация x86 или RISC-V.<\/span>","","<span class=\"sd\">Разрядности и правила команд заданы нами в docs/cpu.md и docs/isa.md.<\/span>","<span class=\"sd\">Методичка определяет задание; там, где она оставляет выбор, спецификация<\/span>","<span class=\"sd\">проекта явно фиксирует выбранный вариант.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"n\">__version__<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">&quot;0.1.0&quot;<\/span>"],"symbols":{},"sha256":"110e091ca1ee32616e4bacd54d08cd12bab8a89a676b58160c45b0fd82a5690b"},"src/rpaoias/__main__.py":{"text":"\"\"\"python -m rpaoias запускает тот же CLI, что и команда rpaoias.\"\"\"\n\nfrom rpaoias.cli import main\n\nraise SystemExit(main())\n","html":["<span class=\"sd\">&quot;&quot;&quot;python -m rpaoias запускает тот же CLI, что и команда rpaoias.&quot;&quot;&quot;<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cli<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">main<\/span>","","<span class=\"k\">raise<\/span> <span class=\"ne\">SystemExit<\/span><span class=\"p\">(<\/span><span class=\"n\">main<\/span><span class=\"p\">())<\/span>"],"symbols":{},"sha256":"b029152d550205079c7624f77543ddf6ea5eb7c0831d1da0a8144f6897ef84cf"},"src/rpaoias/assembler/__init__.py":{"text":"\"\"\"Компонент учебного эмулятора; подробности находятся в соседних модулях.\"\"\"\n","html":["<span class=\"sd\">&quot;&quot;&quot;Компонент учебного эмулятора; подробности находятся в соседних модулях.&quot;&quot;&quot;<\/span>"],"symbols":{},"sha256":"31ec514d9a56a45b2f10e4106f07da09ac352eab883de883da9ef0bd8e98db84"},"src/rpaoias/assembler/assembler.py":{"text":"\"\"\"Двухпроходный ассемблер: сначала адреса, затем машинные инструкции.\n\nМетодичка, стр. 54, описывает таблицу меток и неразрешенные ссылки.\nМы выбираем другой конкретный алгоритм: первый проход узнает адреса ВСЕХ\nметок, второй подставляет их значения. Поэтому JMP вперед не отличается\nпо сложности от JMP назад. Это наше проектное решение.\n\n.org и .word – директивы сборщика, а не команды процессора. В частности,\nметка не занимает четыре байта и не сдвигает PC сама по себе.\n\"\"\"\n\nimport re\nfrom dataclasses import dataclass\n\nfrom rpaoias.assembler.lexer import Token\nfrom rpaoias.assembler.parser import ParsedLine, parse\nfrom rpaoias.cpu.word import INSTRUCTION_BYTES, MEMORY_BYTES, WORD_MASK\nfrom rpaoias.errors import AssemblyError, CPUFault\nfrom rpaoias.isa.codec import encode\nfrom rpaoias.isa.instruction import JUMPS, NO_OPERANDS, Instruction, Mode, Opcode\n\nREGISTER = re.compile(r\"R([0-9]+)\", re.IGNORECASE)\n\n\n@dataclass(frozen=True, slots=True)\nclass ListingEntry:\n    address: int\n    line: int\n    source: str\n    word: int\n\n\n@dataclass(frozen=True, slots=True)\nclass Program:\n    \"\"\"Образ единой памяти и отладочные метаданные; CPU получает только image/entry.\"\"\"\n\n    image: bytes\n    entry: int\n    symbols: dict[str, int]\n    listing: tuple[ListingEntry, ...]\n\n\ndef _error(message: str, tokens: tuple[Token, ...]) -> AssemblyError:\n    return AssemblyError(message, tokens[0].line, tokens[0].column)\n\n\ndef _expression(tokens: tuple[Token, ...], symbols: dict[str, int]) -> int:\n    \"\"\"Небольшая грамматика: необязательный знак, затем числа/метки через +/-.\n\n    Поддерживаем result+2 и -32768, но не вызываем eval и не имитируем\n    полноценный язык выражений. Неподдерживаемую запись отвергаем явно.\n    \"\"\"\n    if not tokens:\n        raise AssemblyError(\"Пустое выражение\")\n    total = 0\n    index = 0\n    sign = 1\n    if tokens[0].text in (\"+\", \"-\"):\n        sign = -1 if tokens[0].text == \"-\" else 1\n        index += 1\n    while index < len(tokens):\n        token = tokens[index]\n        if token.kind == \"NUMBER\":\n            base = 16 if token.text.lower().startswith(\"0x\") else (\n                2 if token.text.lower().startswith(\"0b\") else 10)\n            try:\n                value = int(token.text, base)\n            except ValueError as exc:\n                raise AssemblyError(\"Числовой литерал слишком длинный или некорректный\",\n                                    token.line, token.column) from exc\n        elif token.kind == \"IDENT\" and not token.text.startswith(\".\"):\n            name = token.text.upper()\n            if name not in symbols:\n                raise AssemblyError(f\"Неизвестная метка {token.text}\", token.line, token.column)\n            value = symbols[name]\n        else:\n            raise AssemblyError(\"Ожидалось число или имя метки\", token.line, token.column)\n        total += sign * value\n        index += 1\n        if index == len(tokens):\n            return total\n        operator = tokens[index]\n        if operator.text not in (\"+\", \"-\"):\n            raise AssemblyError(\"Между частями выражения нужен + или -\", operator.line, operator.column)\n        sign = -1 if operator.text == \"-\" else 1\n        index += 1\n    raise _error(\"Выражение заканчивается знаком без числа\", tokens)\n\n\ndef _register(tokens: tuple[Token, ...]) -> int | None:\n    if len(tokens) != 1:\n        return None\n    match = REGISTER.fullmatch(tokens[0].text)\n    if match is None:\n        return None\n    number = int(match.group(1))\n    if number >= 16:\n        raise _error(\"Доступны только регистры R0..R15\", tokens)\n    return number\n\n\ndef _operand(tokens: tuple[Token, ...], symbols: dict[str, int]) -> tuple[Mode, int]:\n    \"\"\"Квадратные скобки меняют смысл: адрес, а не значение по этому адресу.\"\"\"\n    register = _register(tokens)\n    if register is not None:\n        return Mode.REGISTER, register\n    if tokens[0].text == \"[\":\n        if tokens[-1].text != \"]\" or len(tokens) <= 2:\n            raise _error(\"Ожидался адрес внутри [...]\", tokens)\n        inside = tokens[1:-1]\n        register = _register(inside)\n        if register is not None:\n            return Mode.INDIRECT, register\n        return Mode.DIRECT, _expression(inside, symbols)\n    value = _expression(tokens, symbols)\n    if not -32768 <= value <= WORD_MASK:\n        raise _error(\"Литерал не помещается в 16 бит (-32768..65535)\", tokens)\n    # Отрицательная запись разрешена в исходнике, но поле машины хранит биты.\n    return Mode.IMMEDIATE, value & WORD_MASK\n\n\ndef _count(line: ParsedLine, expected: int) -> None:\n    if len(line.operands) != expected:\n        raise AssemblyError(f\"{line.operation}: нужно операндов {expected}, получено {len(line.operands)}\",\n                            line.number)\n\n\ndef _instruction(line: ParsedLine, symbols: dict[str, int]) -> Instruction:\n    if line.operation == \"STORE\":\n        raise AssemblyError(\"Используй MOV [адрес], Rn; STORE – внутреннее имя opcode\", line.number)\n    try:\n        opcode = Opcode[str(line.operation)]\n    except KeyError as exc:\n        raise AssemblyError(f\"Неизвестная команда {line.operation}\", line.number) from exc\n    if opcode in NO_OPERANDS:\n        _count(line, 0)\n        return Instruction(opcode)\n    if opcode in JUMPS:\n        _count(line, 1)\n        # Адрес не маскируем: JMP -4 не должен превращаться в 65532.\n        return Instruction(opcode, 0, Mode.IMMEDIATE, _expression(line.operands[0], symbols))\n    _count(line, 2)\n    destination_mode, destination = _operand(line.operands[0], symbols)\n    source_mode, source = _operand(line.operands[1], symbols)\n    if opcode == Opcode.MOV and destination_mode in (Mode.DIRECT, Mode.INDIRECT):\n        if source_mode != Mode.REGISTER:\n            raise AssemblyError(\"Для MOV в память источником должен быть регистр\", line.number)\n        return Instruction(Opcode.STORE, source, destination_mode, destination)\n    if destination_mode != Mode.REGISTER:\n        raise AssemblyError(\"Первый операнд этой команды должен быть регистром\", line.number)\n    return Instruction(opcode, destination, source_mode, source)\n\n\ndef assemble(source: str) -> Program:\n    \"\"\"Полная трансляция; при ошибке частично собранный образ наружу не выходит.\"\"\"\n    lines = parse(source)\n    symbols: dict[str, int] = {}\n    located: list[tuple[int, ParsedLine]] = []\n    entry_line: ParsedLine | None = None\n    address = 0\n\n    # ПРОХОД 1: размер каждого оператора известен без адресов будущих меток.\n    for line in lines:\n        if line.label:\n            if line.label in symbols:\n                raise AssemblyError(f\"Повторное объявление метки {line.label}\", line.number)\n            if REGISTER.fullmatch(line.label):\n                raise AssemblyError(\"Имя регистра нельзя использовать как метку\", line.number)\n            if line.operation == \".ORG\":\n                raise AssemblyError(\"Размести метку после .org на отдельной строке\", line.number)\n            symbols[line.label] = address\n        if line.operation is None:\n            continue\n        if line.operation == \".ORG\":\n            _count(line, 1)\n            # .org не зависит от меток, чтобы не получить циклические адреса.\n            if any(token.kind == \"IDENT\" for token in line.operands[0]):\n                raise AssemblyError(\".org принимает только числовое выражение\", line.number)\n            address = _expression(line.operands[0], {})\n            if not 0 <= address < MEMORY_BYTES:\n                raise AssemblyError(\".org выходит за память 0..4095\", line.number)\n            continue\n        if line.operation == \".ENTRY\":\n            _count(line, 1)\n            if entry_line is not None:\n                raise AssemblyError(\"Директива .entry может встречаться только один раз\", line.number)\n            entry_line = line\n            continue\n        if line.operation.startswith(\".\") and line.operation != \".WORD\":\n            raise AssemblyError(f\"Неизвестная директива {line.operation}\", line.number)\n        if line.operation == \".WORD\":\n            if not line.operands:\n                raise AssemblyError(\".word требует хотя бы одно значение\", line.number)\n            width, alignment = 2 * len(line.operands), 2\n        else:\n            width, alignment = INSTRUCTION_BYTES, INSTRUCTION_BYTES\n        if address % alignment or address + width > MEMORY_BYTES:\n            raise AssemblyError(\"Размещение выходит за ОЗУ или нарушает выравнивание\", line.number)\n        located.append((address, line))\n        address += width\n\n    # ПРОХОД 2: у каждой метки уже есть адрес. В один образ пишутся и код, и данные.\n    image = bytearray(MEMORY_BYTES)\n    occupied: set[int] = set()\n    listing: list[ListingEntry] = []\n    for address, line in located:\n        if line.operation == \".WORD\":\n            data = bytearray()\n            for expression in line.operands:\n                value = _expression(expression, symbols)\n                if not -32768 <= value <= WORD_MASK:\n                    raise _error(\"Значение .word не помещается в 16 бит\", expression)\n                data.extend((value & WORD_MASK).to_bytes(2, \"little\"))\n        else:\n            try:\n                instruction = _instruction(line, symbols)\n                word = encode(instruction)\n            except CPUFault as exc:\n                raise AssemblyError(str(exc), line.number) from exc\n            data = bytearray(word.to_bytes(INSTRUCTION_BYTES, \"little\"))\n            listing.append(ListingEntry(address, line.number, line.source, word))\n        addresses = set(range(address, address + len(data)))\n        if occupied & addresses:\n            raise AssemblyError(\"Области кода/данных перекрываются; проверь .org\", line.number)\n        occupied.update(addresses)\n        image[address:address + len(data)] = data\n    if not listing:\n        raise AssemblyError(\"Программа не содержит машинных инструкций\")\n    entry = _expression(entry_line.operands[0], symbols) if entry_line else 0\n    if entry not in {row.address for row in listing}:\n        raise AssemblyError(\"Точка входа должна указывать на собранную инструкцию\",\n                            entry_line.number if entry_line else 1)\n    return Program(bytes(image), entry, symbols, tuple(listing))\n","html":["<span class=\"sd\">&quot;&quot;&quot;Двухпроходный ассемблер: сначала адреса, затем машинные инструкции.<\/span>","","<span class=\"sd\">Методичка, стр. 54, описывает таблицу меток и неразрешенные ссылки.<\/span>","<span class=\"sd\">Мы выбираем другой конкретный алгоритм: первый проход узнает адреса ВСЕХ<\/span>","<span class=\"sd\">меток, второй подставляет их значения. Поэтому JMP вперед не отличается<\/span>","<span class=\"sd\">по сложности от JMP назад. Это наше проектное решение.<\/span>","","<span class=\"sd\">.org и .word – директивы сборщика, а не команды процессора. В частности,<\/span>","<span class=\"sd\">метка не занимает четыре байта и не сдвигает PC сама по себе.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">re<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dataclasses<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">dataclass<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.assembler.lexer<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Token<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.assembler.parser<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ParsedLine<\/span><span class=\"p\">,<\/span> <span class=\"n\">parse<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.cpu.word<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">INSTRUCTION_BYTES<\/span><span class=\"p\">,<\/span> <span class=\"n\">MEMORY_BYTES<\/span><span class=\"p\">,<\/span> <span class=\"n\">WORD_MASK<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.errors<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">AssemblyError<\/span><span class=\"p\">,<\/span> <span class=\"n\">CPUFault<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.isa.codec<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">encode<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.isa.instruction<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">JUMPS<\/span><span class=\"p\">,<\/span> <span class=\"n\">NO_OPERANDS<\/span><span class=\"p\">,<\/span> <span class=\"n\">Instruction<\/span><span class=\"p\">,<\/span> <span class=\"n\">Mode<\/span><span class=\"p\">,<\/span> <span class=\"n\">Opcode<\/span>","","<span class=\"n\">REGISTER<\/span> <span class=\"o\">=<\/span> <span class=\"n\">re<\/span><span class=\"o\">.<\/span><span class=\"n\">compile<\/span><span class=\"p\">(<\/span><span class=\"sa\">r<\/span><span class=\"s2\">&quot;R([0-9]+)&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">re<\/span><span class=\"o\">.<\/span><span class=\"n\">IGNORECASE<\/span><span class=\" eturn tuple(tokens)\n","html":["<span class=\"sd\">&quot;&quot;&quot;Лексический анализ: из символов в токены с координатами.<\/span>","","<span class=\"sd\">Методичка, 4.4, стр. 49–50: лексер узнает отдельные элементы, но еще<\/span>","<span class=\"sd\">не решает, допустима ли вся команда. Квадратная скобка – токен;<\/span>","<span class=\"sd\">проверка, что внутри указан корректный адрес, относится к следующим этапам.<\/span>","","<span class=\"sd\">eval() здесь нет: текст ассемблера не должен становиться Python-кодом.<\/span>","<span class=\"sd\">&quot;&quot;&quot;<\/span>","","<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">re<\/span>","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dataclasses<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">dataclass<\/span>","","<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rpaoias.errors<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">AssemblyError<\/span>","","","<span class=\"nd\">@dataclass<\/span><span class=\"p\">(<\/span><span class=\"n\">frozen<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">,<\/span> <span class=\"n\">slots<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">)<\/span>","<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">Token<\/span><span class=\"p\">:<\/span>","    <span class=\"n\">kind<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>","    <span class=\"n\">text<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>","    <span class=\"n\">line<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span>","    <span class=\"n\">column<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span>","","","<span class=\"c1\"># Порядок альтернатив важен: 0x10 нужно узнать целиком, а не как 0 и x10.<\/span>","< atch<\/span> <span class=\"o\">=<\/span> <span class=\"n\">TOKEN<\/span><span class=\"o\">.<\/span><span class=\"n\">match<\/span><span class=\"p\">(<\/span><span class=\"n\">line<\/span><span class=\"p\">,<\/span> <span class=\"n\">offset<\/span><span class=\"p\">)<\/span>","        <span class=\"k\">if<\/span> <span class=\"n\">match<\/span> <span class=\"ow\">is<\/span> <span class=\"kc\">None<\/span><span class=\"p\">:<\/span>","            <span class=\"k\">raise<\/span> <span class=\"n\">AssemblyError<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">&quot;Недопустимый символ <\/span><span class=\"si\">{<\/span><span class=\"n\">line<\/span><span class=\"p\">[<\/span><span class=\"n\">offset<\/span><span class=\"p\">]<\/span><span class=\"si\">!r}<\/span><span class=\"s2\">&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">line_number<\/span><span class=\"p\">,<\/span> <span class=\"n\">offset<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">1<\/span><span class=\"p\">)<\/span>","        <span class=\"n\">kind<\/span> <span class=\"o\">=<\/span> <span class=\"n\">match<\/span><span class=\"o\">.<\/span><span class=\"n\">lastgroup<\/span>","        <span class=\"k\">if<\/span> <span class=\"n\">kind<\/span> <span class=\"o\">==<\/span> <span class=\"s2\">&quot;COMMENT&quot;<\/span><span class=\"p\">:<\/span>","            <span class=\"k\">break<\/span>","        <span class=\"k\">if<\/span> <span class=\"n\">kind<\/span> <span class=\"o\">!=<\/span> <span class=\"s2\">&quot;SPACE&quot;<\/span><span class=\"p\">:<\/span>","            <span class=\"n\">tokens<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">Token<\/span><span class=\"p\">(<\/span><span class=\"nb\">str<\/span><span class=\"p\">(<\/span><span class=\"n\">kind<\/span><span class=\"p\">),<\/span> <span class=\"n\">match<\/span><span class=\"o\">.<\/span><span class=\"n\">group<\/span><span class=\"p\">(),<\/span> <span class=\"n\">line_number<\/span><span class=\"p\">,<\/span> <span class=\"n\">offset<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">1<\/span><span class=\"p\">))<\/span>","        <span class=\"n\">offset<\/span> <span class=\"o\">=<\/span> <span class=\"n\">match<\/span><span class=\"o\">.<\/span><span class=\"n\">end<\/span><span class=\"p\">()<\/span>","    <span class=\"k\">return<\/span> <span class=\"nb\">tuple<\/span><span class=\"p\">(<\/span><span class=\"n\">tokens<\/span><span class=\"p\">)<\/span>"],"symbols":{"Token":[17,21],"tokenize":[33,47]},"sha256":"48060361c4d04d846022501e0a461edf5903946420c173f2515c01a45f975c0b"},"src/rpaoias/assembler/parser.py":{"text":"\"\"\"Синтаксический анализ строк: метка, мнемоника и группы токенов операндов.\n\nМетодичка, 4.4: для простого ассемблера сложное AST не обязательно.\nЗдесь промежуточное представление – ParsedLine. Семантика ISA проверяется\nотдельно, поэтому парсер не содержит условных веток для каждой команды.\n\"\"\"\n\nfrom dataclasses import dataclass\n\nfrom rpaoias.assembler.lexer import Token, tokenize\nfrom rpaoias.errors import AssemblyError\n\n\n@dataclass(frozen=True, slots=True)\nclass ParsedLine:\n    number: int\n    source: str\n    label: str | None\n    operation: str | None\n    operands: tuple[tuple[Token, ...], ...]\n\n\ndef parse(source: str) -> tuple[ParsedLine, ...]:\n    \"\"\"Комментарии не становятся инструкциями, но исходные строки сохраняются.\"\"\"\n    result: list[ParsedLine] = []\n    for number, original in enumerate(source.splitlines(), start=1):\n        tokens = list(tokenize(original, number))\n        if not tokens:\n            continue\n        label = None\n        if len(tokens) >= 2 and tokens[1].text == \":\":\n            if tokens[0].kind != \"IDENT\" or tokens[0].text.startswith(\".\"):\n                raise AssemblyError(\"Недопустимое имя метки\", number, tokens[0].column)\n            label = tokens[0].text.upper()\n            tokens = tokens[2:]\n        if not tokens:\n            result.append(ParsedLine(number, original, label, None, ()))\n            continue\n        first = tokens.pop(0)\n        if first.kind != \"IDENT\":\n            raise AssemblyError(\"Ожидалась мнемоника или директива\", number, first.column)\n        groups: list[tuple[Token, ...]] = []\n        current: list[Token] = []\n        depth = 0\n        for token in tokens:\n            if token.text == \"[\":\n                depth += 1\n                if depth > 1:\n                    raise AssemblyError(\"Вложенные скобки не поддерживаются\", number, token.column)\n            elif token.text == \"]\":\n                depth -= 1\n                if depth < 0:\n                    raise AssemblyError(\"Лишняя закрывающая скобка\", number, token.column)\n            if token.text == \",\" and depth == 0:\n                if not current:\n                    raise AssemblyError(\"Пустой операнд перед запятой\", number, token.column)\n                groups.append(tuple(current))\n                current = []\n            else:\n                current.append(token)\n        if depth:\n            raise AssemblyError(\"Не закрыта квадратная скобка\", number, first.column)\n        if tokens and not current:\n            raise AssemblyError(\"После запятой отсутствует операнд\", number, tokens[-1].column)\n        if current:\n            groups.append(tuple(current))\n        result.append(ParsedLine(number, original, label, first.text.upper(), tuple(groups)))\n    return tuple(result)\n","html":["<span class=\"sd\">&quot;&quot;&quot;Синтаксический анализ строк: метка, мнемоника и группы токенов операндов.<\/span>","","<span class=\"sd\">Методичка, 4.4: для простого ассемблера сложное AST не обязательно.<\/span>","<span class=\"sd\">Здесь промежуточное представление – ParsedLine. Семантика ISA проверяется<\/span>","<span class=\"sd\">отдельно, поэтому парсер не содержит условных веток для каждой команды.<
