function showGlossary(){dialog('Словарь без потери места',`<input id="glossary-search" class="glossary-input" type="search" placeholder="CF, адресация, слово, PC…" aria-label="Поиск термина"><div id="terms"></div>`);const render=t=>{const list=CONTENT.glossary.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(t.toLowerCase()));$('#terms').innerHTML=list.map(x=>`<div class="term"><b>${x[0]}</b><span>${x[1]}</span><button data-nav="${x[2]}">К опыту →</button></div>`).join('')||'<p class="glossary-empty">Термин не найден. Попробуй часть слова.</p>';};render('');on($('#glossary-search'),'input',e=>render(e.target.value));}
function showRefs(){dialog('Источники, границы и поправки',`<p>Основа — предоставленное пособие Скрябина Ю. М. и Даниловича Е. С. «Разработка программно-аппаратного обеспечения информационных и автоматизированных систем», 55 страниц файла, печатные страницы 3–57; и неизменённый архив <b>rpaoias.zip, 0.1.0</b>.</p><p class="hint">Печатная страница = номер страницы PDF + 2. В ZIP со страницей приложен исходный PDF: <a href="materials/method.pdf" target="_blank" rel="noopener">открыть методичку</a>. При открытии отдельно скачанного HTML этот относительный файл отсутствует, но весь учебный текст и код работают.</p><h3>Как отделены уровни</h3><div class="source-pill"><b>М · методичка</b>Термины, тематика, требования варианта и формула задания. Ссылки в конце каждого эпизода ведут к соответствующим печатным страницам.</div><div class="source-pill"><b>П · проект</b>16-битные РОН, 32-битные инструкции, 4096 байт, little-endian, конкретные opcode и флаги — наши проектные решения. Точные правила проверяются по исходникам.</div><div class="source-pill"><b>Учебный опыт</b>Небольшие числа, переключатели, цветные пути, условные стеки и фазы — собственные объясняющие модели. Они не выдаются за дословное содержание пособия или аппаратные такты.</div><h3>Охват методички</h3><table class="coverage-table"><tr><th>Раздел</th><th>Где разобран</th></tr><tr><td>1.1–1.2</td><td>Память, байты, архитектуры, регистры, PC/IR, стек.</td></tr><tr><td>2.1–2.3</td><td>Пересылки, адресация, адресность, арифметика, флаги, переходы, циклы, подпрограммы.</td></tr><tr><td>2.4</td><td>Безадресная машина, обратная польская запись, операции стека; не ISA варианта 2.</td></tr><tr><td>3.1–3.2</td><td>Дополнительный код, переполнение, длинное сложение, умножение, деление и форматы чисел.</td></tr><tr><td>4.1</td><td>Вариант 2, ограничения, граница между заданием и нашей спецификацией.</td></tr><tr><td>4.2</td><td>Банки памяти и дополнительная адресация как отдельная тема; PIC18 не эмулируется.</td></tr><tr><td>4.3–4.4</td><td>Выборка, декодирование, исполнение, маски, лексер, парсер, метки и сборка.</td></tr></table><h3>Замеченные противоречия источника</h3><p><b>С. 8:</b> формулировки о размерах команд и доступе RISC-V не используются как спецификация нашей машины. Предел для 16-битного байтового адреса — 65536 байт. См. внешний источник [R] для RISC-V.</p><p><b>С. 10:</b> в фразе LIFO опечатка; показываем «последним вошёл — первым вышел» и отмечаем отличие.</p><p><b>С. 15–16:</b> для MOV R2,12 в тексте 000C, в таблице 0007. В проекте принято 000C.</p><p><b>С. 19 и 34:</b> сдвиги описаны неодинаково. В опытах отдельно заданы логический, арифметический и циклический сдвиги; в проекте только SAR с явными правилами.</p><p><b>С. 20:</b> листинг проверки чётности перезаписывает значение через AND перед последующим сдвигом. Этот листинг не используется как исполняемый пример нашего проекта.</p><p><b>С. 25 и 28:</b> описание стекового JNZ и последующий пример противоречат друг другу. В нашей нестековой ISA JNZ однозначно проверяет ZF=0.</p><p><b>С. 29:</b> в списке написано 1+0=0. В расчётах явно используется 1+0=1.</p><p><b>С. 35 и 37:</b> «номер» и «размер» первого элемента. В проекте выбран размер — число следующих элементов. «Свёртка» означает ровно сумму AᵢBᵢ по формуле (4.1).</p><p>Это не полная экспертиза всех формул пособия. Спорные фрагменты не копируются в качестве готового кода. Дополнительные замечания проекта: <button class="small" data-file="docs/method-notes.md">method-notes.md</button>.</p><h3>Поправки к моим сообщениям в чате</h3><p>ADD R1,2 → <b>10140002</b>, а не 10100002. Второй код означает ADD R1,R2. load_example уже вызывает сборку. Между ADD и ADC нельзя менять CF; промежуточный MOV, который сохраняет флаги, допустим. 48 бит для простой суммы выбраны ради общего формата; математически там хватило бы 32.</p><h3>Проверенная внешняя документация</h3><p><b>[P]</b> <a href="https://docs.python.org/3.13/library/stdtypes.html" target="_blank" rel="noopener">Python 3.13: Built-in Types</a> — int, побитовые операции, порядок байтов.</p><p><b>[Q]</b> <a href="https://doc.qt.io/qtforpython-6.10/PySide6/QtCore/QTimer.html" target="_blank" rel="noopener">Qt for Python: QTimer</a> — таймер и цикл событий. Наличие документации не является проверкой GUI.</p><p><b>[R]</b> <a href="https://docs.riscv.org/reference/isa/v20260120/unpriv/rv32.html" target="_blank" rel="noopener">RISC-V: RV32I Base Integer Instruction Set</a> — базовые 32-битные и дополнительные 16-битные форматы; наша ISA не является RISC-V.</p><p class="hint">Эти источники использованы только для явно выделенных уточнений. Основной маршрут не заменён внешним учебником. Дата проверки: 02.10.2026.</p><h3>Откуда взялись анимации исполнения</h3><p>Записи получены настоящими assemble() и CPU.step() из архива: sum — 105 инструкций, dot_product — 141, carry — 8. Браузер воспроизводит снимки; фазы — объясняющее разделение одного атомарного шага, не реальные аппаратные такты. Числовые мини-опыты реализованы на JavaScript и проверяются отдельно против Python-АЛУ.</p><p class="hint">SHA-256 архива: <code style="overflow-wrap:anywhere">${DATA.zipSha256}</code></p>`);}

function showDraw(){dialog('Моя схема',`<p class="hint">Нарисуй, что куда передаётся. Подпиши стрелки: адрес / значение / команда / перенос. Это свободный черновик, не автоматическая проверка.</p><canvas class="drawing" id="drawing" aria-label="Поле для рисования" role="img"></canvas><div class="draw-controls"><label>Цвет <select id="pen-color" aria-label="Цвет пера"><option value="#243b53">Тёмный</option><option value="#14685d">Значение</option><option value="#265fa9">Адрес</option><option value="#9f4a26">Перенос</option></select></label><button id="draw-undo">Отменить</button><button id="draw-clear">Очистить</button><button id="draw-save">PNG ↗</button></div><p class="hint">${storageOK?'Рисунок сохраняется локально вместе с заметками.':'Постоянное хранение недоступно: сохрани рисунок кнопкой PNG перед закрытием страницы.'} Рисовать можно мышью, пальцем или пером.</p>`);const c=$('#drawing'),ctx=c.getContext('2d');let stroke=null;const rect=()=>c.getBoundingClientRect();function size(){const r=rect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);draw();}function draw(){const w=c.width,h=c.height;ctx.fillStyle='#fafcfe';ctx.fillRect(0,0,w,h);ctx.lineCap='round';ctx.lineJoin='round';for(const s of state.strokes){ctx.strokeStyle=s.color;ctx.lineWidth=3*(window.devicePixelRatio||1);ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(p[0]*w,p[1]*h):ctx.moveTo(p[0]*w,p[1]*h));ctx.stroke();}}function point(e){const r=rect();return [clamp((e.clientX-r.left)/r.width,0,1),clamp((e.clientY-r.top)/r.height,0,1)];}on(c,'pointerdown',e=>{c.setPointerCapture(e.pointerId);stroke={color:$('#pen-color').value,points:[point(e)]};state.strokes.push(stroke);});on(c,'pointermove',e=>{if(!stroke)return;stroke.points.push(point(e));draw();});const finish=()=>{if(stroke&&stroke.points.length===1){const p=stroke.points[0];stroke.points.push([p[0]+.001,p[1]+.001]);draw();}stroke=null;persist();};on(c,'pointerup',finish);on(c,'pointercancel',finish);on($('#draw-undo'),'click',()=>{state.strokes.pop();draw();persist();});on($('#draw-clear'),'click',()=>{if(!state.strokes.length||confirm('Очистить рисунок?')){state.strokes=[];draw();persist();}});on($('#draw-save'),'click',()=>c.toBlob(blob=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='rpaoias-my-diagram.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);},'image/png'));requestAnimationFrame(size);}

// Модель кодирования для интерактивного конструктора. Те же ограничения, что в Instruction.validate.
function encodeModel(op,reg,mode,operand){const code=DATA.opcodes[op];if(!Number.isInteger(mode)||mode<0||mode>3)throw Error('Режим должен быть 0…3.');if(code===undefined)throw Error('Неизвестный opcode.');if(!Number.isInteger(reg)||reg<0||reg>15)throw Error('Регистр должен быть R0…R15.');if(!Number.isInteger(operand)||operand<0||operand>65535)throw Error('Поле операнда должно быть 0…65535.');const no=['NOP','HALT'].includes(op),jump=op.startsWith('J');if(no){if(reg||mode||operand)throw Error('NOP и HALT требуют нулевые поля.');}else if(jump){if(reg!==0||mode!==1||operand%4||operand>4092)throw Error('Переход: reg=0, mode=01, адрес 0…4092 кратен 4.');}else{if([0,3].includes(mode)&&operand>15)throw Error('Здесь поле содержит номер регистра 0…15, не его значение.');if(mode===2&&(operand%2||operand>4094))throw Error('Прямой адрес слова должен быть чётным, 0…4094.');if(op==='STORE'&&![2,3].includes(mode))throw Error('STORE требует адрес памяти.');if(['ADD','ADC','SUB','MUL','CMP','SAR'].includes(op)&&![0,1].includes(mode))throw Error('Арифметика не обращается напрямую к ОЗУ.');if(op==='MUL'&&reg%2)throw Error('MUL требует чётный первый регистр.');if(op==='SAR'&&mode===1&&operand>15)throw Error('SAR допускает сдвиг 0…15.');}return (code*2**24+reg*2**20+mode*2**18+operand)>>>0;}
WIDGETS.encoding=r=>{r.innerHTML=`<div class="control-row"><label>Операция <select id="enc-op">${['MOV','STORE','ADD','ADC','SUB','MUL','CMP','SAR','JMP','JNZ','HALT'].map(x=>`<option value="${x}">${x==='STORE'?'MOV в память (STORE)':x}</option>`).join('')}</select></label><label>reg <select id="enc-reg">${Array.from({length:16},(_,i)=>`<option value="${i}" ${i===2?'selected':''}>R${i}</option>`).join('')}</select></label><label>mode <select id="enc-mode">${['00 · регистр','01 · число','10 · прямой адрес','11 · регистр-указатель'].map((x,i)=>`<option value="${i}" ${i===1?'selected':''}>${x}</option>`).join('')}</select></label><label>operand <input id="enc-val" value="12" aria-label="Поле операнда инструкции"></label></div><div id="enc-output"></div>`;
 const draw=()=>{try{const op=$('#enc-op',r).value,reg=Number($('#enc-reg',r).value),mode=Number($('#enc-mode',r).value),original=parseNum($('#enc-val',r).value);if(original<-32768||original>65535)throw Error('Литерал вне 16-битного диапазона ввода.');const val=original&65535,word=encodeModel(op,reg,mode,val),other=[`R${val}`,String(original),`[0x${hex(val)}]`,`[R${val}]`][mode];let as=op==='STORE'?`MOV ${other}, R${reg}`:['NOP','HALT'].includes(op)?op:op.startsWith('J')?`${op} 0x${hex(val)}`:`${op} R${reg}, ${other}`;$('#enc-output',r).innerHTML=`<div class="field-grid">${[['opcode','31…24',bin(DATA.opcodes[op],8)],['reg','23…20',bin(reg,4)],['mode','19…18',bin(mode,2)],['резерв','17…16','00'],['operand','15…0',bin(val,16)]].map(([n,p,b])=>`<div class="field"><small>${n}<br>биты ${p}</small><b>${b}</b></div>`).join('')}</div><div class="split-grid">${stat('Машинное слово','0x'+hex(word,8))}${stat('Ассемблер',as)}</div><div class="byte-row">${[0,1,2,3].map(i=>`<div class="byte-cell"><b>${hex((word>>>(i*8))&255,2)}</b><small>байт +${i}</small></div>`).join('')}</div><p class="hint">Байты по возрастанию адресов: little-endian. Номера полей читаются слева направо от старших к младшим.</p>`;}catch(e){$('#enc-output',r).innerHTML=`<div class="error-message"><b>Сочетание не разрешено.</b> ${esc(e.message)}</div>`;}};
 on($('#enc-op',r),'change',()=>{const op=$('#enc-op',r).value;if(['HALT','NOP'].includes(op)){$('#enc-reg',r).value='0';$('#enc-mode',r).value='0';$('#enc-val',r).value='0';}else if(op.startsWith('J')){$('#enc-reg',r).value='0';$('#enc-mode',r).value='1';$('#enc-val',r).value='8';}else if(op==='STORE'){$('#enc-mode',r).value='2';$('#enc-val',r).value='1024';}else{$('#enc-mode',r).value='1';$('#enc-val',r).value=op==='SAR'?'1':'12';}draw();});$$('#enc-reg,#enc-mode',r).forEach(e=>on(e,'change',draw));on($('#enc-val',r),'input',draw);draw();};
WIDGETS.logic=r=>{r.innerHTML=`<div class="control-row"><label>A <input id="logic-a" type="number" value="173" min="0" max="255"></label><label>Операция <select id="logic-op"><option>AND</option><option>OR</option><option>XOR</option><option>NOT</option></select></label><label>B / маска <input id="logic-b" type="number" value="15" min="0" max="255"></label></div><div id="logic-output"></div>`;const draw=()=>{const a=Number($('#logic-a',r).value),b=Number($('#logic-b',r).value),op=$('#logic-op',r).value;$('#logic-b',r).disabled=op==='NOT';if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>255||b>255){$('#logic-output',r).innerHTML='<p class="error-message">Восьмибитный опыт: значения 0…255.</p>';return;}const val={AND:a&b,OR:a|b,XOR:a^b,NOT:(~a)&255}[op],row=(title,n)=>`<div class="logic-row"><strong>${title}</strong>${bin(n,8).split('').map(x=>`<span class="${x==='1'?'on':''}">${x}</span>`).join('')}</div>`;$('#logic-output',r).innerHTML=`${row('A',a)}${op==='NOT'?'':row('B',b)}<hr style="border:0;border-top:1px solid var(--line)">${row('Итог',val)}${out(`<b>${op==='NOT'?'NOT '+a:a+' '+op+' '+b} = ${val}</b> (0x${hex(val,2)}). ${op==='AND'?'Там, где в B ноль, результат обязательно нулевой.':op==='OR'?'Хватает единицы хотя бы на одном входе.':op==='XOR'?'Единица получается только при разных входных битах.':'Каждый из восьми битов заменён противоположным.'}`)}`;};$$('input,select',r).forEach(x=>on(x,x.tagName==='SELECT'?'change':'input',draw));draw();};
function aluModel(op,a,b,carry=0){a&=65535;b&=65535;const sub=op==='SUB'||op==='CMP';const full=sub?a-b:a+b+(op==='ADC'?carry:0);const value=full&65535;const math=sub?s16(a)-s16(b):s16(a)+s16(b)+(op==='ADC'?carry:0);return{value,flags:{zf:Number(value===0),sf:Number(!!(value&32768)),cf:Number(sub?a<b:full>65535),of:Number(math<-32768||math>32767)},math,full};}
WIDGETS.alu=r=>{const presets=[['FFFF + 1',65535,1,'ADD',0],['32767 + 1',32767,1,'ADD',0],['0 − 1',0,1,'SUB',0],['−32768 − 1',32768,1,'SUB',0],['ADC: +перенос',65535,0,'ADC',1]];r.innerHTML=`<div class="code-tabs">${presets.map((x,i)=>button(x[0],'',`data-alu="${i}"`)).join('')}</div><div class="control-row"><label>A <input id="alu-a" value="65535" aria-label="Первый операнд АЛУ"></label><label><select id="alu-op" aria-label="Операция АЛУ"><option>ADD</option><option>ADC</option><option>SUB</option><option>CMP</option></select></label><label>B <input id="alu-b" value="1" aria-label="Второй операнд АЛУ"></label><label><input type="checkbox" id="alu-cf">Входящий CF</label></div><div id="alu-output"></div>`;const draw=()=>{try{const a=parseNum($('#alu-a',r).value),b=parseNum($('#alu-b',r).value),op=$('#alu-op',r).value,carry=Number($('#alu-cf',r).checked);if(a<-32768||a>65535||b<-32768||b>65535)throw Error('Операнды должны задавать 16 бит: −32768…65535.');$('#alu-cf',r).disabled=op!=='ADC';const ans=aluModel(op,a,b,carry),sign=op==='SUB'||op==='CMP'?'−':'+';$('#alu-output',r).innerHTML=`<div class="split-grid">${stat(op==='CMP'?'Разность для флагов':'Сохраняемые 16 бит','0x'+hex(ans.value),`unsigned ${ans.value} · signed ${s16(ans.value)}`)}${stat('Математический signed-результат',fmt(ans.math),`${s16(a)} ${sign} ${s16(b)}${op==='ADC'?' + '+carry:''}`)}</div>${flagsHTML(ans.flags)}${out(`<b>CF:</b> ${op==='SUB'||op==='CMP'?`unsigned ${a&65535} ${ans.flags.cf?'меньше':'не меньше'} ${b&65535}; заём ${ans.flags.cf?'нужен':'не нужен'}.`:`полная сумма без знака = ${ans.full}; ${ans.full>65535?'превышает':'не превышает'} 65535.`}<br><b>OF:</b> signed-результат ${ans.math} ${ans.flags.of?'не входит':'входит'} в −32768…32767.${op==='CMP'?'<br>CMP не записывает показанную разность обратно в первый операнд.':''}`)}`;}catch(e){$('#alu-output',r).innerHTML=`<p class="error-message">${esc(e.message)}</p>`;}};$$('input,select',r).forEach(x=>on(x,x.type==='checkbox'||x.tagName==='SEL WIDGETS.branch=r=>{r.innerHTML=`<div class="control-row"><label>CMP: A <input id="branch-a" value="10" aria-label="Левый операнд сравнения"></label><label>B <input id="branch-b" value="15" aria-label="Правый операнд сравнения"></label><label>Переход <select id="branch-op"><option>JC</option><option>JZ</option><option>JNZ</option><option>JNC</option><option>JO</option><option>JNO</option><option>JMP</option></select></label></div><div id="branch-output"></div>`;const draw=()=>{try{const a=parseNum($('#branch-a',r).value),b=parseNum($('#branch-b',r).value);if(a<-32768||a>65535||b<-32768||b>65535)throw Error('Используй 16-битные операнды.');const ans=aluModel('CMP',a,b),f=ans.flags,op=$('#branch-op',r).value,take={JC:!!f.cf,JZ:!!f.zf,JNZ:!f.zf,JNC:!f.cf,JO:!!f.of,JNO:!f.of,JMP:true}[op];$('#branch-output',r).innerHTML=`${flagsHTML(f)}${flow([box('Перед переходом','PC = 0010',`${op} 0x0080`),box('Условие',take?'выполнено':'не выполнено',`${op} проверяет ${op==='JMP'?'ничего: всегда':op.includes('Z')?'ZF':op.includes('C')?'CF':'OF'}`),box('Следующий PC',take?'0080':'0014',take?'Адрес перехода':'Обычное PC+4','active')])}${out(`CMP не изменил операнды. Биты A=${hex(a&65535)} (signed ${s16(a)}), B=${hex(b&65535)} (signed ${s16(b)}).<br>${op==='JC'||op==='JNC'?'Здесь CF относится к беззнаковому сравнению.':'Условие смотрит на флаги, оставленные сравнением.'}`)}`;}catch(e){$('#branch-output',r).innerHTML=`<p class="error-message">${esc(e.message)}</p>`;}};$$('input,select',r).forEach(x=>on(x,x.tagName==='SELECT'?'change':'input',draw));draw();};

const join48=words=>{const n=BigInt(words[0]||0)+(BigInt(words[1]||0)<<16n)+(BigInt(words[2]||0)<<32n);return n>=1n<<47n?n-(1n<<48n):n;};

WIDGETS.loop=r=>{const t=DATA.traces.loop;let n=0;const draw=()=>{const s=n?t.steps[n-1].after:t.initial,next=t.steps[n],last=n?t.steps[n-1]:null;r.innerHTML=`<p class="lead">Три числа: 3, 4, −2. Длина лежит отдельно перед ними. Показаны реальные состояния Python-ядра после команд.</p>${controls(button('Сначала','','id="loop-reset"')+button('Подготовить указатель и счётчик','','id="loop-prep"')+button('Одна команда →','primary','id="loop-next"')+button('До следующей итерации →','','id="loop-iteration"'))}<div class="data-row">${[3,3,4,-2].map((v,i)=>`<div class="datum ${s.r[3]===1024+i*2?'active':''}"><small>${i===0?'Длина':'Элемент '+(i-1)}</small><b>${v}</b><code>0x${hex(1024+i*2)}</code></div>`).join('')}</div><div class="split-grid">${stat('R0 · сумма',s16(s.r[0]))}${stat('R3 · адрес','0x'+hex(s.r[3]))}${stat('R5 · осталось',s.r[5])}${stat('PC','0x'+hex(s.pc),s.halted?'Остановлен':'Следующий адрес команды')}</div><div class="trace-state"><b>Выполнено ${n} / ${t.steps.length} команд.</b><p>${last?'Только что: <code>'+esc(last.asm)+'</code><br>'+esc(last.source.split(';').slice(1).join(';').trim()):'Начальное состояние. Пока ничего не прочитано.'}</p><p>${next?'Далее: <code>'+esc(next.asm)+'</code>':'HALT. Сумма 3 + 4 − 2 = 5.'}</p></div>${flagsHTML(s.flags)}`;on($('#loop-reset',r),'click',()=>{n=0;draw();});on($('#loop-prep',r),'click',()=>{n=4;draw();});on($('#loop-next',r),'click',()=>{n=Math.min(n+1,t.steps.length);draw();});on($('#loop-iteration',r),'click',()=>{if(n<4)n=4;else{n++;while(n<t.steps.length&&t.steps[n].address!==t.symbols.LOOP)n++;}draw();});$('#loop-next',r).disabled=s.halted;$('#loop-iteration',r).disabled=s.halted;};draw();};

WIDGETS.extension=r=>{r.innerHTML=`<div class="control-row"><label>Исходное signed 16 <input id="ext-a" type="number" min="-32768" max="32767" value="-7"></label><label>Новая ширина <select id="ext-n"><option value="3">48 бит</option><option value="2">32 бита</option></select></label>${[-7,7,-32768,32767].map(n=>button(n,'small',`data-ext="${n}"`)).join('')}</div><div id="ext-output"></div>`;const draw=()=>{const a=Number($('#ext-a',r).value),n=Number($('#ext-n',r).value);if(!Number.isInteger(a)||a<-32768||a>32767){$('#ext-output',r).innerHTML='<p class="error-message">Исходное число: −32768…32767.</p>';return;}const words=[a&65535,...Array(n-1).fill(a<0?65535:0)],wrong=[a&65535,...Array(n-1).fill(0)];$('#ext-output',r).innerHTML=`<p><b>Знаковое расширение:</b> новые биты равны исходному знаковому биту.</p>${wordBoxes(words,Array.from({length:n},(_,i)=>i?'расширение':'исходные 16 бит'))}${out(`Число осталось <b>${a}</b>. Старшие ${16*(n-1)} битов ${a<0?'заполнены единицами':'нулевые'}.`)}${a<0?`<p><b>А теперь ошибочно дополним нулями:</b></p>${wordBoxes(wrong,Array.from({length:n},(_,i)=>i?'ошибочно нули':'те же 16 бит'))}<p class="warn">Получится положительное ${a&65535}, а не ${a}. Скопировать младшее слово недостаточно.</p>`:'<p class="hint">Для неотрицательного числа знаковое расширение совпадает с дополнением нулями.</p>'}`;};$$('input,select',r).forEach(e=>on(e,e.tagName==='SELECT'?'change':'input',draw));on(r,'click',e=>{const b=e.target.closest('[data-ext]');if(b){$('#ext-a',r).value=b.dataset.ext;draw();}});draw();};
WIDGETS.adc=r=>{let preset=0,phase=0,words=[65535,0,0],cf=0,broken=false,log=[];const setups=[{name:'Перенос в среднее слово',a:[65535,0,0],b:[1,0,0]},{name:'Перенос через два слова',a:[65535,65535,0],b:[1,0,0]},{name:'−7 + 8',a:[65529,65535,65535],b:[8,0,0]}];const reset=()=>{phase=0;words=[...setups[preset].a];cf=0;broken=false;log=[];};const draw=()=>{const p=setups[preset];r.innerHTML=`<div class="control-row"><label>Опыт <select id="adc-preset">${setups.map((x,i)=>`<option value="${i}" ${i===preset?'selected':''}>${x.name}</option>`).join('')}</select><button id="adc-reset">Сначала</button></div><p>Накопитель. Читаем от старшего слова слева к младшему справа.</p>${wordBoxes(words,undefined,phase-1)}<div class="control-row"><span class="carry-chip">CF = ${cf}</span><b>Число signed 48: ${fmt(join48(words))}</b></div><p>Прибавляем слова: <code>${[...p.b].reverse().map(x=>hex(x)).join(':')}</code>. Ожидаемое signed-значение: <b>${fmt(join48(p.a)+join48(p.b))}</b>.</p>${controls(button(phase===0?'ADD младшего слова →':phase===1?'ADC среднего слова →':'ADC старшего слова →','primary','id="adc-step"')+button('Вставить команду, обнуляющую CF','danger small','id="adc-break"'))}<div class="trace-state">${log.length?log.map(x=>'<p>'+x+'</p>').join(''):'Пока арифметические команды не выполнены.'}</div>${broken?'<p class="warn">Перенос был испорчен посторонней арифметикой. У CPU больше нет бита, который нужно передать выше. MOV сам по себе CF не меняет.</p>':''}${phase===3?out('Все три слова обработаны. '+(join48(words)===join48(p.a)+join48(p.b)?'Получен ожидаемый результат.':'Результат не совпадает: перенос потерян. Повтори без постороннего изменения CF.')):''}`;on($('#adc-preset',r),'change',e=>{preset=Number(e.target.value);reset();draw();});on($('#adc-reset',r),'click',()=>{reset();draw();});on($('#adc-step',r),'click',()=>{if(phase>=3)return;const op=phase?'ADC':'ADD',before=words[phase],oldcf=cf,z=aluModel(op,before,p.b[phase],cf);words[phase]=z.value;cf=z.flags.cf;lo
